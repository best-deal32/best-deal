<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملفي الشخصي - سلة</title>
    <style>
        :root {
            --bg-dark: #0d0d0d;
            --bg-card: #1a1a1a;
            --gold: #d4af37;
            --gold-light: #f1c40f;
            --text: #e0e0e0;
            --text-muted: #aaaaaa;
            --border: #333;
            --radius: 16px;
            --input-bg: #222;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* شريط علوي */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--gold);
            padding: 15px 30px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo .basket-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 6px var(--gold-light));
        }
        .nav-links a, .nav-links button {
            color: var(--text);
            text-decoration: none;
            margin: 0 10px;
            font-weight: 500;
            transition: 0.3s;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
        }
        .nav-links a:hover, .nav-links button:hover { color: var(--gold); }
        .btn-outline {
            border: 1px solid var(--gold);
            color: var(--gold);
            background: transparent;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-outline:hover { background: var(--gold); color: #000; }

        /* محتوى */
        .main-container {
            flex: 1;
            padding: 30px 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }
        .back-link {
            color: var(--gold);
            text-decoration: none;
            margin-bottom: 20px;
            display: inline-block;
            font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }

        .profile-header {
            display: flex;
            gap: 25px;
            align-items: center;
            margin-bottom: 35px;
            flex-wrap: wrap;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .store-image-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 20px;
            overflow: hidden;
            background: var(--input-bg);
            border: 2px solid var(--gold);
            cursor: pointer;
        }
        .store-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .store-image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--text-muted);
        }
        .store-image-upload {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7);
            color: var(--gold);
            text-align: center;
            padding: 5px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .store-name {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gold);
        }
        .contact-number {
            color: var(--text-muted);
            margin: 8px 0;
        }
        .btn-edit {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-edit:hover { background: var(--gold-light); }

        /* أقسام */
        .section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .section h2 {
            color: var(--gold);
            margin-bottom: 15px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .list-item {
            background: var(--input-bg);
            border-radius: 12px;
            padding: 12px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .discount-badge {
            background: var(--gold);
            color: #000;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }
        .product-mini {
            background: var(--input-bg);
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 10px;
        }
        .product-mini img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            background: #111;
        }
        .product-mini .pname { font-weight: 600; margin: 8px 0 4px; }
        .product-mini .pprice { color: var(--gold); font-weight: bold; }

        .locations {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .location-tag {
            background: var(--gold);
            color: #000;
            padding: 5px 14px;
            border-radius: 20px;
            font-weight: 500;
        }

        .add-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .add-btn:hover { background: var(--gold-light); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            align-items: center; justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--gold);
            border-radius: var(--radius);
            padding: 25px;
            width: 90%;
            max-width: 400px;
            color: var(--text);
        }
        .modal-content h3 { color: var(--gold); margin-bottom: 15px; }
        .modal-content input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            margin-bottom: 10px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .save-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }
        .cancel-btn {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text);
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">
            <span class="basket-icon">🧺</span>
            <span>سلة</span>
        </a>
        <div class="nav-links">
            <a href="dashboard.html">الرئيسية</a>
            <a href="offers.html">العروض</a>
            <a href="create-offer.html">إضافة منتج</a>
            <button class="btn-outline" id="logoutBtn">تسجيل الخروج</button>
        </div>
    </nav>

    <div class="main-container">
        <a href="dashboard.html" class="back-link">← العودة للوحة التحكم</a>

        <!-- رأس الصفحة -->
        <div class="profile-header">
            <div class="store-image-wrapper" onclick="document.getElementById('storeImageInput').click()">
                <img id="storeImagePreview" src="" alt="صورة المتجر" style="display:none;">
                <div class="store-image-placeholder" id="imagePlaceholder">🧺</div>
                <div class="store-image-upload">تغيير</div>
                <input type="file" id="storeImageInput" accept="image/*" style="display:none;" onchange="uploadStoreImage()">
            </div>
            <div>
                <div class="store-name" id="storeNameDisplay">اسم المتجر</div>
                <div class="contact-number" id="contactDisplay">📞 لا يوجد رقم تواصل</div>
                <button class="btn-edit" onclick="openContactModal()">تعديل الرقم</button>
            </div>
        </div>

        <!-- المنتجات -->
        <div class="section">
            <h2>📦 منتجاتي</h2>
            <div class="products-grid" id="productsGrid"></div>
        </div>

        <!-- العروض -->
        <div class="section">
            <h2>🎁 عروضي</h2>
            <div id="offersList"></div>
        </div>

        <!-- مناديب التوصيل -->
        <div class="section">
            <h2>🚚 مناديب التوصيل</h2>
            <div id="driversList"></div>
            <button class="add-btn" onclick="openDriverModal()">+ إضافة مندوب</button>
        </div>

        <!-- مناطق التوصيل -->
        <div class="section">
            <h2>🗺️ مناطق التوصيل</h2>
            <div class="locations" id="locationsList"></div>
            <button class="add-btn" onclick="openLocationModal()">+ إضافة منطقة</button>
        </div>
    </div>

    <!-- مودال تعديل رقم التواصل -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <h3>تعديل رقم التواصل</h3>
            <input type="text" id="newContact" placeholder="أدخل الرقم الجديد">
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal('contactModal')">إلغاء</button>
                <button class="save-btn" onclick="saveContact()">حفظ</button>
            </div>
        </div>
    </div>

    <!-- مودال إضافة مندوب -->
    <div id="driverModal" class="modal">
        <div class="modal-content">
            <h3>إضافة مندوب توصيل</h3>
            <input type="text" id="driverName" placeholder="اسم المندوب">
            <input type="text" id="driverPhone" placeholder="رقم الهاتف">
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal('driverModal')">إلغاء</button>
                <button class="save-btn" onclick="addDriver()">حفظ</button>
            </div>
        </div>
    </div>

    <!-- مودال إضافة منطقة -->
    <div id="locationModal" class="modal">
        <div class="modal-content">
            <h3>إضافة منطقة توصيل</h3>
            <input type="text" id="locationName" placeholder="اسم المنطقة">
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal('locationModal')">إلغاء</button>
                <button class="save-btn" onclick="addLocation()">حفظ</button>
            </div>
        </div>
    </div>

    <footer>© 2025 سلة - جميع الحقوق محفوظة</footer>

    <script>
        // التحقق من تسجيل الدخول كبائع
        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/me', { credentials: 'include' });
                if (!res.ok) { window.location.href = 'login.html'; return; }
                const user = await res.json();
                if (user.role !== 'seller' && user.role !== 'admin') {
                    alert('يجب أن تكون بائعاً للوصول لهذه الصفحة.');
                    window.location.href = 'dashboard.html';
                }
            } catch (e) { window.location.href = 'login.html'; }
        }

        // تحميل بيانات الملف الشخصي
        async function loadProfile() {
            try {
                const res = await fetch('/api/profile', { credentials: 'include' });
                if (!res.ok) { alert('فشل تحميل البيانات'); return; }
                const data = await res.json();

                document.getElementById('storeNameDisplay').textContent = data.store_name || 'اسم المتجر';
                document.getElementById('contactDisplay').textContent = data.contact_phone ? `📞 ${data.contact_phone}` : '📞 لا يوجد رقم تواصل';

                if (data.store_image) {
                    document.getElementById('storeImagePreview').src = data.store_image;
                    document.getElementById('storeImagePreview').style.display = 'block';
                    document.getElementById('imagePlaceholder').style.display = 'none';
                }

                renderProducts(data.products || []);
                renderOffers(data.offers || []);
                renderDrivers(data.drivers || []);
                renderLocations(data.locations || []);
            } catch (err) { console.error(err); }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            if (products.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted);">لا توجد منتجات</p>';
                return;
            }
            grid.innerHTML = products.map(p => `
                <div class="product-mini">
                    <img src="${p.image || 'https://via.placeholder.com/150x100/1a1a1a/d4af37?text=🧺'}" alt="${p.name}">
                    <div class="pname">${p.name}</div>
                    <div class="pprice">${p.price}$</div>
                </div>
            `).join('');
        }

        function renderOffers(offers) {
            const container = document.getElementById('offersList');
            if (offers.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted);">لا توجد عروض</p>';
                return;
            }
            container.innerHTML = offers.map(o => `
                <div class="list-item">
                    <span>${o.title}</span>
                    <span class="discount-badge">${o.discount || 'عرض'}</span>
                </div>
            `).join('');
        }

        function renderDrivers(drivers) {
            const container = document.getElementById('driversList');
            if (drivers.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted);">لا يوجد مناديب</p>';
                return;
            }
            container.innerHTML = drivers.map(d => `
                <div class="list-item">
                    <span>🧑‍💼 ${d.name}</span>
                    <span>📞 ${d.phone}</span>
                </div>
            `).join('');
        }

        function renderLocations(locations) {
            const container = document.getElementById('locationsList');
            if (locations.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted);">لا توجد مناطق</p>';
                return;
            }
            container.innerHTML = locations.map(l => `
                <span class="location-tag">${l.name}</span>
            `).join('');
        }

        // دوال المودال
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function openContactModal() {
            document.getElementById('newContact').value = '';
            openModal('contactModal');
        }
        async function saveContact() {
            const phone = document.getElementById('newContact').value.trim();
            if (!phone) return;
            await fetch('/api/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contactPhone: phone }),
                credentials: 'include'
            });
            closeModal('contactModal');
            loadProfile();
        }

        function openDriverModal() { openModal('driverModal'); }
        async function addDriver() {
            const name = document.getElementById('driverName').value.trim();
            const phone = document.getElementById('driverPhone').value.trim();
            if (!name || !phone) return;
            await fetch('/api/drivers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, phone }),
                credentials: 'include'
            });
            document.getElementById('driverName').value = '';
            document.getElementById('driverPhone').value = '';
            closeModal('driverModal');
            loadProfile();
        }

        function openLocationModal() { openModal('locationModal'); }
        async function addLocation() {
            const name = document.getElementById('locationName').value.trim();
            if (!name) return;
            await fetch('/api/locations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name }),
                credentials: 'include'
            });
            document.getElementById('locationName').value = '';
            closeModal('locationModal');
            loadProfile();
        }

        // رفع صورة المتجر
        async function uploadStoreImage() {
            const file = document.getElementById('storeImageInput').files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('storeImage', file);
            await fetch('/api/profile', {
                method: 'PUT',
                body: formData,
                credentials: 'include'
            });
            loadProfile();
        }

        // تسجيل الخروج
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.href = 'index.html';
        });

        // بدء التشغيل
        checkAuth().then(loadProfile);
    </script>
</body>
</html>
