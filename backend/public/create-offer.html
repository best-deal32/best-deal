<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء عرض - سلة</title>
    <style>
        :root {
            --red: #b22222;
            --red-light: #dc3545;
            --gold: #f4b400;
            --gold-light: #ffcc00;
            --bg-dark: #1c1c1c;
            --bg-card: rgba(30, 30, 30, 0.75);
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text: #f0f0f0;
            --text-muted: #bbbbbb;
            --border: #444;
            --radius: 18px;
            --transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            --input-bg: rgba(255, 255, 255, 0.07);
            --input-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 20%, #3a1010, #0f0505);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* شريط التنقل */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(244, 180, 0, 0.4);
            padding: 0 25px;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--gold);
            font-size: 2rem;
            font-weight: 800;
        }

        .logo .basket-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px var(--gold));
            transition: transform 0.3s;
        }

        .logo:hover .basket-icon {
            transform: rotate(-5deg) scale(1.1);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a,
        .nav-links button {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 30px;
            transition: var(--transition);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
        }

        .nav-links a:hover,
        .nav-links button:hover {
            background: rgba(244,180,0,0.15);
            color: var(--gold);
        }

        .btn-logout {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid var(--red);
            color: var(--red-light);
            padding: 8px 22px;
            border-radius: 30px;
            font-weight: bold;
        }

        .btn-logout:hover {
            background: var(--red);
            color: white;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--gold);
            font-size: 2rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                right: 0;
                background: rgba(20, 0, 0, 0.95);
                backdrop-filter: blur(20px);
                border-bottom: 2px solid var(--gold);
                padding: 25px;
                gap: 18px;
                border-radius: 0 0 20px 20px;
            }
            .nav-links.show {
                display: flex;
            }
            .menu-toggle {
                display: block;
            }
        }

        /* المحتوى الرئيسي */
        .main-container {
            flex: 1;
            padding: 35px 25px;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
        }

        .back-link {
            color: var(--gold);
            text-decoration: none;
            margin-bottom: 20px;
            display: inline-block;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--gold-light);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-desc {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        /* بطاقة النموذج */
        .form-card {
            background: var(--bg-card);
            backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 0 1px rgba(244,180,0,0.15) inset;
            border-top: 1px solid rgba(244,180,0,0.3);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--gold);
        }

        /* حقول الإدخال */
        input, textarea, select {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
            backdrop-filter: blur(10px);
            width: 100%;
        }

        /* تعديل خيارات القائمة المنسدلة لتكون داكنة */
        select option {
            background: #2a2a2a;
            color: #f0f0f0;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--gold);
            background: rgba(255,255,255,0.12);
        }

        input[type="file"] {
            padding: 10px;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background: rgba(244,180,0,0.15);
            border: 1px solid var(--gold);
            color: var(--gold-light);
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            margin-left: 15px;
            transition: var(--transition);
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--gold);
            color: #000;
        }

        /* أزرار اختيار المقاسات */
        .toggle-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toggle-btn {
            padding: 10px 22px;
            border-radius: 30px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            backdrop-filter: blur(5px);
            user-select: none;
        }

        .toggle-btn:hover {
            background: rgba(244,180,0,0.15);
            border-color: var(--gold-light);
        }

        .toggle-btn.active {
            background: rgba(244,180,0,0.2);
            border-color: var(--gold);
            color: var(--gold-light);
            box-shadow: 0 0 12px rgba(244,180,0,0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid var(--red-light);
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin-top: 25px;
        }

        .btn-submit:hover {
            background: var(--red);
            border-color: var(--red);
        }

        .btn-submit:active {
            transform: scale(0.97);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: var(--red-light);
            font-size: 0.9rem;
            margin-top: 12px;
            display: none;
            background: rgba(220,53,69,0.15);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--red);
        }

        .limit-info {
            background: rgba(244,180,0,0.1);
            border: 1px solid var(--gold);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .limit-info .count {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--gold);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">
            <span class="basket-icon">🧺</span>
            <span>سلة</span>
        </a>
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="dashboard.html">الرئيسية</a>
            <a href="offers.html">العروض</a>
            <a href="profile.html">ملفي</a>
            <button class="btn-logout" id="logoutBtn">تسجيل الخروج</button>
        </div>
    </nav>

    <div class="main-container">
        <a href="dashboard.html" class="back-link">← العودة للوحة التحكم</a>
        <h1>➕ إنشاء عرض جديد</h1>
        <p class="page-desc">أضف منتجاً جديداً من الألبسة إلى متجرك</p>

        <div class="limit-info" id="limitInfo">
            <p>المنتجات المتبقية لك: <span class="count" id="remainingCount">...</span></p>
            <p id="limitMessage"></p>
        </div>

        <div class="form-card">
            <form id="productForm">
                <div class="form-group">
                    <label>📷 صورة المنتج</label>
                    <input type="file" name="image" accept="image/*" required>
                </div>

                <div class="form-group">
                    <label>📛 اسم المنتج</label>
                    <input type="text" name="name" placeholder="أدخل اسم المنتج" required>
                </div>

                <div class="form-group">
                    <label>👚 نوع القطعة</label>
                    <select name="type" required>
                        <option value="">اختر النوع</option>
                        <option value="بنطال">بنطال</option>
                        <option value="كنزة">كنزة</option>
                        <option value="جاكيت">جاكيت</option>
                        <option value="حذاء">حذاء</option>
                        <option value="قميص">قميص</option>
                        <option value="تي شيرت">تي شيرت</option>
                        <option value="فستان">فستان</option>
                        <option value="تنورة">تنورة</option>
                        <option value="معطف">معطف</option>
                        <option value="بدلة">بدلة</option>
                        <option value="بلوزة">بلوزة</option>
                        <option value="شورت">شورت</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>📏 المقاسات المتوفرة (اختر كل ما ينطبق)</label>
                    <div class="toggle-group" id="sizeGroup">
                        <span class="toggle-btn" data-value="XS">XS</span>
                        <span class="toggle-btn" data-value="S">S</span>
                        <span class="toggle-btn" data-value="M">M</span>
                        <span class="toggle-btn" data-value="L">L</span>
                        <span class="toggle-btn" data-value="XL">XL</span>
                        <span class="toggle-btn" data-value="XXL">XXL</span>
                        <span class="toggle-btn" data-value="3XL">3XL</span>
                        <span class="toggle-btn" data-value="4XL">4XL</span>
                    </div>
                    <input type="hidden" name="size" id="sizeInput">
                </div>

                <div class="form-group">
                    <label>🎨 الألوان المتوفرة</label>
                    <input type="text" name="colors" placeholder="مثال: أحمر، أزرق، أسود" required>
                </div>

                <div class="form-group">
                    <label>💰 السعر (بالدولار)</label>
                    <input type="number" name="price" min="1" step="0.01" placeholder="أدخل السعر" required>
                </div>

                <div class="form-group">
                    <label>📝 وصف المنتج</label>
                    <textarea name="description" rows="4" placeholder="وصف تفصيلي للمنتج..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">إضافة المنتج</button>
                <div id="serverError" class="error-message"></div>
            </form>
        </div>
    </div>

    <footer>© 2025 سلة - جميع الحقوق محفوظة</footer>

    <script>
        // ---------- التحقق من الصلاحية وحدود المنتجات ----------
        async function checkAuthAndLimits() {
            try {
                const res = await fetch('/api/auth/me', { credentials: 'include' });
                if (!res.ok) {
                    window.location.href = 'login.html';
                    return null;
                }
                const user = await res.json();
                if (user.role !== 'seller' && user.role !== 'admin') {
                    alert('يجب أن تكون بائعاً لإضافة منتجات.');
                    window.location.href = 'dashboard.html';
                    return null;
                }

                const current = user.currentProducts || 0;
                const max = user.maxProducts || 20;
                const remaining = Math.max(0, max - current);

                document.getElementById('remainingCount').textContent = remaining;
                const msgEl = document.getElementById('limitMessage');
                const submitBtn = document.getElementById('submitBtn');

                if (remaining <= 0) {
                    msgEl.textContent = 'لقد وصلت إلى الحد الأقصى. لا يمكنك إضافة منتجات جديدة. قم بترقية باقتك.';
                    msgEl.style.color = '#e74c3c';
                    submitBtn.disabled = true;
                } else if (remaining <= 5) {
                    msgEl.textContent = `أنت على وشك الوصول للحد الأقصى. باقٍ ${remaining} منتجات فقط.`;
                    msgEl.style.color = '#f39c12';
                    submitBtn.disabled = false;
                } else {
                    msgEl.textContent = '';
                    submitBtn.disabled = false;
                }

                return user;
            } catch (e) {
                window.location.href = 'login.html';
                return null;
            }
        }

        // ---------- أزرار المقاسات المتعددة ----------
        const sizeButtons = document.querySelectorAll('#sizeGroup .toggle-btn');
        const sizeInput = document.getElementById('sizeInput');

        sizeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.toggle('active');
                updateSizeInput();
            });
        });

        function updateSizeInput() {
            const selected = [];
            sizeButtons.forEach(btn => {
                if (btn.classList.contains('active')) {
                    selected.push(btn.dataset.value);
                }
            });
            sizeInput.value = selected.join(', ');
        }

        // ---------- إرسال النموذج ----------
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('serverError');
            errorEl.style.display = 'none';

            const form = e.target;
            const formData = new FormData(form);

            const name = formData.get('name')?.trim();
            const price = formData.get('price');
            const type = formData.get('type');
            const colors = formData.get('colors')?.trim();
            const imageFile = formData.get('image');

            if (!name || !price || !type || !colors || !imageFile || imageFile.name === '') {
                errorEl.textContent = 'يرجى ملء جميع الحقول المطلوبة.';
                errorEl.style.display = 'block';
                return;
            }

            if (sizeInput.value.trim() === '') {
                errorEl.textContent = 'يرجى اختيار مقاس واحد على الأقل.';
                errorEl.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/api/products', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });
                const data = await res.json();

                if (res.ok) {
                    alert('تم إضافة المنتج بنجاح!');
                    form.reset();
                    sizeButtons.forEach(b => b.classList.remove('active'));
                    updateSizeInput();
                    checkAuthAndLimits();
                } else {
                    errorEl.textContent = data.message || 'فشل إضافة المنتج';
                    errorEl.style.display = 'block';
                    if (res.status === 403) {
                        document.getElementById('submitBtn').disabled = true;
                        document.getElementById('limitMessage').textContent = 'لقد وصلت إلى الحد الأقصى.';
                        document.getElementById('limitMessage').style.color = '#e74c3c';
                    }
                }
            } catch (err) {
                console.error(err);
                errorEl.textContent = 'خطأ في الاتصال بالخادم';
                errorEl.style.display = 'block';
            }
        });

        // ---------- أحداث التنقل ----------
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('navLinks').classList.toggle('show');
        });

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.href = 'index.html';
        });

        // بدء التشغيل
        checkAuthAndLimits();
    </script>
</body>
</html>
