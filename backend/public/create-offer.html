<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء عرض - سلة</title>
    <style>
        :root {
            --primary-red: #b22222;
            --primary-light-red: #dc3545;
            --primary-yellow: #f4b400;
            --primary-light-yellow: #ffcc00;
            --bg-dark: #1c1c1c;
            --bg-card: #262626;
            --text: #f5f5f5;
            --text-muted: #bbbbbb;
            --border: #404040;
            --radius: 16px;
            --input-bg: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #2d1a1a 0%, #0f0a0a 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* شريط علوي */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--primary-yellow);
            padding: 0 20px;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--primary-yellow);
            font-size: 2rem;
            font-weight: 800;
        }
        .logo .basket-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 8px var(--primary-yellow));
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 30px;
            transition: 0.3s;
        }
        .nav-links a:hover {
            background: rgba(244,180,0,0.1);
            color: var(--primary-yellow);
        }
        .btn-logout {
            background: transparent;
            border: 2px solid var(--primary-yellow);
            color: var(--primary-yellow);
            padding: 8px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-logout:hover {
            background: var(--primary-yellow);
            color: #000;
        }
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--primary-yellow);
            font-size: 2rem;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                right: 0;
                background: #1a1a1a;
                border-bottom: 2px solid var(--primary-yellow);
                padding: 20px;
                gap: 15px;
            }
            .nav-links.show {
                display: flex;
            }
            .menu-toggle {
                display: block;
            }
        }

        /* المحتوى الرئيسي */
        .main-container {
            flex: 1;
            padding: 30px 20px;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
        }
        .back-link {
            color: var(--primary-yellow);
            text-decoration: none;
            margin-bottom: 20px;
            display: inline-block;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--primary-yellow);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-desc {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        /* نموذج الألبسة */
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border-top: 4px solid var(--primary-yellow);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-yellow);
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary-yellow);
            background: #3a3a3a;
        }
        .form-group input[type="file"] {
            padding: 10px;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            background: var(--primary-red);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(220,53,69,0.4);
            margin-top: 15px;
        }
        .btn-submit:hover {
            background: var(--primary-light-red);
            box-shadow: 0 6px 20px rgba(220,53,69,0.6);
        }
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .error-message {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
            background: rgba(231,76,60,0.15);
            padding: 10px;
            border-radius: 8px;
        }
        .limit-info {
            background: rgba(244,180,0,0.1);
            border: 1px solid var(--primary-yellow);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
        }
        .limit-info p {
            margin: 5px 0;
        }
        .limit-info .count {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-yellow);
        }
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: auto;
        }
    </style>
</head>
<body>
    <!-- شريط التنقل -->
    <nav class="navbar">
        <a href="dashboard.html" class="logo">
            <span class="basket-icon">🧺</span>
            <span>سلة</span>
        </a>
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="dashboard.html">الرئيسية</a>
            <a href="offers.html">العروض</a>
            <a href="profile.html">ملفي</a>
            <button class="btn-logout" id="logoutBtn">تسجيل الخروج</button>
        </div>
    </nav>

    <!-- المحتوى الرئيسي -->
    <div class="main-container">
        <a href="dashboard.html" class="back-link">← العودة للوحة التحكم</a>
        <h1>➕ إنشاء عرض جديد</h1>
        <p class="page-desc">أضف منتجاً جديداً من الألبسة إلى متجرك</p>

        <!-- معلومات الحد المسموح -->
        <div class="limit-info" id="limitInfo">
            <p>المنتجات المتبقية لك: <span class="count" id="remainingCount">...</span></p>
            <p id="limitMessage"></p>
        </div>

        <!-- نموذج إضافة المنتج -->
        <div class="form-card">
            <form id="productForm">
                <div class="form-group">
                    <label>📷 صورة المنتج</label>
                    <input type="file" name="image" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>📛 اسم المنتج</label>
                    <input type="text" name="name" placeholder="أدخل اسم المنتج" required>
                </div>
                <div class="form-group">
                    <label>📏 المقاسات المتوفرة</label>
                    <input type="text" name="size" placeholder="مثال: S, M, L, XL" required>
                </div>
                <div class="form-group">
                    <label>👚 نوع القطعة</label>
                    <input type="text" name="type" placeholder="مثال: بنطال، كنزة، جاكيت..." required>
                </div>
                <div class="form-group">
                    <label>🎨 الألوان المتوفرة</label>
                    <input type="text" name="colors" placeholder="مثال: أحمر، أزرق، أسود" required>
                </div>
                <div class="form-group">
                    <label>💰 السعر (بالدولار)</label>
                    <input type="number" name="price" min="1" step="0.01" placeholder="أدخل السعر" required>
                </div>
                <div class="form-group">
                    <label>📝 وصف المنتج</label>
                    <textarea name="description" rows="4" placeholder="وصف تفصيلي للمنتج..."></textarea>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">إضافة المنتج</button>
                <div id="serverError" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- التذييل -->
    <footer>© 2025 سلة - جميع الحقوق محفوظة</footer>

    <script>
        // التحقق من تسجيل الدخول كبائع
        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/me', { credentials: 'include' });
                if (!res.ok) {
                    window.location.href = 'login.html';
                    return null;
                }
                const user = await res.json();
                if (user.role !== 'seller' && user.role !== 'admin') {
                    alert('يجب أن تكون بائعاً لإضافة منتجات.');
                    window.location.href = 'dashboard.html';
                    return null;
                }
                return user;
            } catch (e) {
                window.location.href = 'login.html';
                return null;
            }
        }

        // تحديث معلومات الحد المسموح
        async function updateLimitInfo() {
            const user = await checkAuth();
            if (!user) return;

            const current = user.currentProducts || 0;
            const max = user.maxProducts || 20;
            const remaining = Math.max(0, max - current);

            document.getElementById('remainingCount').textContent = remaining;
            const msgEl = document.getElementById('limitMessage');
            const submitBtn = document.getElementById('submitBtn');

            if (remaining <= 0) {
                msgEl.textContent = 'لقد وصلت إلى الحد الأقصى. لا يمكنك إضافة منتجات جديدة. قم بترقية باقتك.';
                msgEl.style.color = '#e74c3c';
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.5';
            } else if (remaining <= 5) {
                msgEl.textContent = `أنت على وشك الوصول للحد الأقصى. باقٍ ${remaining} منتجات فقط.`;
                msgEl.style.color = '#f39c12';
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            } else {
                msgEl.textContent = '';
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
        }

        // إرسال النموذج
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('serverError');
            errorEl.style.display = 'none';

            const form = e.target;
            const formData = new FormData(form);

            // التحقق من الحقول المطلوبة
            const name = formData.get('name')?.trim();
            const price = formData.get('price');
            const size = formData.get('size')?.trim();
            const type = formData.get('type')?.trim();
            const colors = formData.get('colors')?.trim();
            const imageFile = formData.get('image');

            if (!name || !price || !size || !type || !colors || !imageFile || imageFile.name === '') {
                errorEl.textContent = 'يرجى ملء جميع الحقول المطلوبة.';
                errorEl.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/api/products', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });
                const data = await res.json();

                if (res.ok) {
                    alert('تم إضافة المنتج بنجاح!');
                    form.reset();
                    updateLimitInfo(); // تحديث العداد
                } else {
                    errorEl.textContent = data.message || 'فشل إضافة المنتج';
                    errorEl.style.display = 'block';
                    if (res.status === 403) {
                        // تم الوصول للحد الأقصى، نعطل الزر
                        document.getElementById('submitBtn').disabled = true;
                        document.getElementById('submitBtn').style.opacity = '0.5';
                        document.getElementById('limitMessage').textContent = 'لقد وصلت إلى الحد الأقصى. لا يمكنك إضافة منتجات جديدة.';
                        document.getElementById('limitMessage').style.color = '#e74c3c';
                    }
                }
            } catch (err) {
                console.error(err);
                errorEl.textContent = 'خطأ في الاتصال بالخادم';
                errorEl.style.display = 'block';
            }
        });

        // زر القائمة للجوال
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('navLinks').classList.toggle('show');
        });

        // تسجيل الخروج
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.href = 'index.html';
        });

        // بدء التشغيل
        updateLimitInfo();
    </script>
</body>
</html>
