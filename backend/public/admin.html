<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الأدمن - سلة</title>
    <style>
        :root {
            --bg-dark: #0d0d0d;
            --bg-card: #1a1a1a;
            --gold: #d4af37;
            --gold-light: #f1c40f;
            --text: #e0e0e0;
            --text-muted: #aaaaaa;
            --danger: #c0392b;
            --border: #333;
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--gold);
            padding: 15px 30px;
        }
        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo .basket-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 6px var(--gold-light));
        }
        .nav-links a {
            color: var(--text);
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
            transition: 0.3s;
        }
        .nav-links a:hover { color: var(--gold); }
        .btn-logout {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn-logout:hover { background: var(--gold); color: #000; }
        .main-container {
            flex: 1;
            padding: 30px 20px;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }
        .section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .section h2 {
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: right; color: var(--gold-light); padding: 12px; border-bottom: 2px solid var(--gold); }
        td { padding: 12px; border-bottom: 1px solid var(--border); color: var(--text); }
        .btn-sm { padding: 6px 14px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-role { background: var(--gold); color: #000; }
        .btn-role:hover { background: var(--gold-light); }
        .btn-delete { background: var(--danger); color: white; }
        .btn-delete:hover { background: #e74c3c; }
        select { background: #222; color: var(--text); border: 1px solid var(--gold); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
        .featured-form { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .featured-form input { flex: 1; background: #222; border: 1px solid var(--border); color: white; padding: 12px 15px; border-radius: 30px; }
        .btn-add { background: var(--gold); color: #000; border: none; padding: 12px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .banner-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .banner-form-grid input, .banner-form-grid textarea { background: #222; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 12px; }
        .banner-form-grid button { grid-column: span 2; background: var(--gold); color: #000; border: none; padding: 12px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .message { padding: 10px; border-radius: 8px; margin: 10px 0; display: none; }
        .message.success { background: #2ecc71; color: white; display: block; }
        .message.error { background: #e74c3c; color: white; display: block; }
        footer { text-align: center; padding: 20px; color: var(--text-muted); border-top: 1px solid var(--border); }
        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 10px; }
            .banner-form-grid { grid-template-columns: 1fr; }
            .banner-form-grid button { grid-column: 1; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <span class="basket-icon">🧺</span>
            <span>سلة</span>
        </div>
        <div class="nav-links">
            <a href="dashboard.html">الرئيسية</a>
            <a href="admin.html" style="color:var(--gold);">لوحة التحكم</a>
            <button class="btn-logout" id="logoutBtn">تسجيل الخروج</button>
        </div>
    </nav>

    <div class="main-container">
        <div id="globalMessage" class="message"></div>

        <div class="section">
            <h2>👥 إدارة المستخدمين</h2>
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>اسم المستخدم</th>
                        <th>رقم الهاتف</th>
                        <th>الدور</th>
                        <th>متجر</th>
                        <th>مفعل</th>
                        <th>تاريخ التسجيل</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="section">
            <h2>⭐ إضافة منتج إلى العروض المميزة</h2>
            <div class="featured-form">
                <input type="text" id="productIdInput" placeholder="معرف المنتج (UUID)">
                <button class="btn-add" id="addFeaturedBtn">إضافة</button>
            </div>
            <h3>المنتجات المميزة الحالية</h3>
            <div id="featuredList"></div>
        </div>

        <div class="section">
            <h2>📢 إضافة إعلان عام (Banner)</h2>
            <div class="banner-form-grid">
                <input type="text" id="bannerTitle" placeholder="عنوان الإعلان" required>
                <input type="file" id="bannerImage" accept="image/*">
                <textarea id="bannerDesc" placeholder="وصف (اختياري)" rows="3"></textarea>
                <button type="button" id="addBannerBtn">إضافة الإعلان</button>
            </div>
            <h3>الإعلانات الحالية</h3>
            <div id="bannersList"></div>
        </div>
    </div>

    <footer>© 2025 سلة - جميع الحقوق محفوظة</footer>

    <script>
        function showMessage(msg, type) {
            const el = document.getElementById('globalMessage');
            el.textContent = msg;
            el.className = `message ${type}`;
            setTimeout(() => { el.className = 'message'; }, 3000);
        }

        async function checkAdmin() {
            try {
                const res = await fetch('/api/auth/me', { credentials: 'include' });
                if (!res.ok) { window.location.href = 'login.html'; return false; }
                const user = await res.json();
                if (user.role !== 'admin') { window.location.href = 'dashboard.html'; return false; }
                return true;
            } catch (e) { window.location.href = 'login.html'; return false; }
        }

        async function loadUsers() {
            const res = await fetch('/api/admin/users', { credentials: 'include' });
            const users = await res.json();
            const tbody = document.querySelector('#usersTable tbody');
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.username}</td>
                    <td>${u.phone || '—'}</td>
                    <td>
                        <select onchange="changeRole('${u.id}', this.value)">
                            <option value="user" ${u.role==='user'?'selected':''}>مستخدم</option>
                            <option value="seller" ${u.role==='seller'?'selected':''}>بائع</option>
                            <option value="admin" ${u.role==='admin'?'selected':''}>أدمن</option>
                        </select>
                    </td>
                    <td>${u.store_name || '—'}</td>
                    <td>${u.verified ? '✅' : '❌'}</td>
                    <td>${new Date(u.created_at).toLocaleDateString('ar')}</td>
                    <td>
                        <button class="btn-sm btn-delete" onclick="deleteUser('${u.id}')">🗑 حذف</button>
                    </td>
                </tr>
            `).join('');
        }

        async function changeRole(userId, newRole) {
            await fetch(`/api/admin/user/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: newRole }),
                credentials: 'include'
            });
            loadUsers();
            showMessage('تم تحديث الدور', 'success');
        }

        async function deleteUser(userId) {
            if (!confirm('هل أنت متأكد من حذف هذا المستخدم؟')) return;
            const res = await fetch(`/api/admin/user/${userId}`, {
                method: 'DELETE',
                credentials: 'include'
            });
            if (res.ok) {
                showMessage('تم حذف المستخدم', 'success');
                loadUsers();
            } else {
                const data = await res.json().catch(() => ({ message: 'فشل الحذف' }));
                showMessage(data.message || 'فشل الحذف', 'error');
            }
        }

        async function loadFeatured() {
            const res = await fetch('/api/featured');
            const data = await res.json();
            const products = data.products || [];
            const container = document.getElementById('featuredList');
            if (products.length === 0) {
                container.innerHTML = '<p>لا توجد منتجات مميزة</p>';
                return;
            }
            container.innerHTML = products.map(p => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#222; padding:10px; border-radius:12px; margin-bottom:8px;">
                    <span>${p.name} (${p.id})</span>
                    <button class="btn-sm btn-delete" onclick="removeFeatured('${p.feature_id}')">إزالة</button>
                </div>
            `).join('');
        }

        async function removeFeatured(id) {
            await fetch(`/api/admin/featured/${id}`, { method: 'DELETE', credentials: 'include' });
            loadFeatured();
        }

        async function loadBanners() {
            const res = await fetch('/api/featured');
            const data = await res.json();
            const banners = data.banners || [];
            const container = document.getElementById('bannersList');
            if (banners.length === 0) {
                container.innerHTML = '<p>لا توجد إعلانات</p>';
                return;
            }
            container.innerHTML = banners.map(b => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#222; padding:10px; border-radius:12px; margin-bottom:8px;">
                    <span>${b.title}</span>
                    <button class="btn-sm btn-delete" onclick="deleteBanner('${b.id}')">حذف</button>
                </div>
            `).join('');
        }

        async function deleteBanner(id) {
            await fetch(`/api/admin/banners/${id}`, { method: 'DELETE', credentials: 'include' });
            loadBanners();
        }

        // ---------- الدوال الجديدة مع التنبيهات للتشخيص ----------
        async function addBanner() {
            console.log('addBanner clicked');
            alert('تم الضغط على زر إضافة الإعلان');

            const title = document.getElementById('bannerTitle').value.trim();
            const desc = document.getElementById('bannerDesc').value.trim();
            const fileInput = document.getElementById('bannerImage');

            if (!title) {
                showMessage('يرجى إدخال عنوان الإعلان', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('title', title);
            if (desc) formData.append('description', desc);
            if (fileInput.files[0]) formData.append('image', fileInput.files[0]);

            console.log('سيتم إرسال:', title, desc, fileInput.files[0]?.name);

            try {
                const res = await fetch('/api/admin/banners', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });

                console.log('استجابة الخادم:', res.status);

                if (res.ok) {
                    document.getElementById('bannerTitle').value = '';
                    document.getElementById('bannerDesc').value = '';
                    fileInput.value = '';
                    loadBanners();
                    showMessage('تم إضافة الإعلان', 'success');
                } else {
                    const data = await res.json().catch(() => ({ message: 'استجابة غير صالحة من الخادم' }));
                    console.error('خطأ من الخادم:', data);
                    showMessage(data.message || 'خطأ في الإضافة', 'error');
                }
            } catch (err) {
                console.error('فشل الاتصال:', err);
                showMessage('فشل الاتصال بالخادم. تحقق من الاتصال بالإنترنت.', 'error');
            }
        }

        async function addFeatured() {
            console.log('addFeatured clicked');
            alert('تم الضغط على زر إضافة عرض مميز');

            const productId = document.getElementById('productIdInput').value.trim();
            if (!productId) {
                showMessage('يرجى إدخال معرف المنتج', 'error');
                return;
            }

            console.log('معرف المنتج:', productId);

            try {
                const res = await fetch('/api/admin/featured', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId }),
                    credentials: 'include'
                });

                console.log('استجابة الخادم:', res.status);

                if (res.ok) {
                    document.getElementById('productIdInput').value = '';
                    loadFeatured();
                    showMessage('تمت الإضافة', 'success');
                } else {
                    const data = await res.json().catch(() => ({ message: 'استجابة غير صالحة' }));
                    console.error('خطأ من الخادم:', data);
                    showMessage(data.message || 'خطأ', 'error');
                }
            } catch (err) {
                console.error('فشل الاتصال:', err);
                showMessage('فشل الاتصال بالخادم', 'error');
            }
        }

        // ربط الأحداث بعد تحميل الصفحة
        document.addEventListener('DOMContentLoaded', async () => {
            const isAdmin = await checkAdmin();
            if (!isAdmin) return;

            document.getElementById('addFeaturedBtn').addEventListener('click', addFeatured);
            document.getElementById('addBannerBtn').addEventListener('click', addBanner);
            document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                e.preventDefault();
                await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                window.location.href = 'index.html';
            });

            loadUsers();
            loadFeatured();
            loadBanners();
        });
    </script>
</body>
</html>
