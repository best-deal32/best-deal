<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - MarketHub</title>
    <style>
        :root {
            --green-dark: #059669;
            --green-light: #6ee7b7;
            --blue-dark: #1e40af;
            --blue-light: #93c5fd;
            --white: #ffffff;
            --text-light: #f0fdf4;
            --bg-glass: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #065f46 0%, #1e3a8a 100%);
            min-height: 100vh;
            color: var(--white);
            display: flex;
            flex-direction: column;
        }

        /* ========== الشريط العلوي ========== */
        .navbar {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-glass);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .navbar .logo {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .navbar .logo .emerald-text { color: var(--green-light); }
        .navbar .logo .blue-text { color: var(--blue-light); }

        .navbar .user-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .navbar .user-area .admin-badge {
            background: var(--green-dark);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
        }

        .btn-outline-light {
            border: 1px solid rgba(255,255,255,0.5);
            background: transparent;
            color: white;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .btn-outline-light:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        /* ========== تخطيط الصفحة ========== */
        .main-container {
            flex: 1;
            display: flex;
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            gap: 30px;
            flex-wrap: wrap;
        }

        /* ========== القائمة الجانبية ========== */
        .sidebar {
            width: 250px;
            background: var(--bg-glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-glass);
            border-radius: 25px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: fit-content;
            position: sticky;
            top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .sidebar button {
            background: transparent;
            border: 1px solid var(--border-glass);
            color: var(--text-light);
            padding: 14px 20px;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-align: right;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar button:hover,
        .sidebar button.active {
            background: rgba(110, 231, 183, 0.2);
            border-color: var(--green-light);
            color: var(--green-light);
            transform: translateX(-5px);
        }

        /* ========== منطقة المحتوى ========== */
        .content {
            flex: 1;
            min-width: 300px;
        }

        .section {
            background: var(--bg-glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-glass);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .section h2 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 15px;
        }

        /* ========== الجداول ========== */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 14px 16px;
            text-align: right;
            border-bottom: 1px solid var(--border-glass);
        }

        th {
            background: rgba(0,0,0,0.2);
            font-weight: 700;
            color: var(--green-light);
        }

        select {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-glass);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* ========== أزرار ========== */
        .btn {
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.3s;
            font-size: 0.9rem;
        }
        .btn-success { background: var(--green-dark); color: white; }
        .btn-success:hover { background: #047857; transform: translateY(-2px); }
        .btn-danger { background: #b91c1c; color: white; }
        .btn-danger:hover { background: #991b1b; transform: translateY(-2px); }

        /* ========== نماذج ========== */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: var(--text-light);
        }

        .form-group input,
        .form-group textarea {
            padding: 12px 15px;
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--green-light);
            background: rgba(255,255,255,0.15);
        }

        .banner-card {
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .banner-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
        }

        .message {
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .error { background: rgba(220,38,38,0.3); color: #fca5a5; }
        .success { background: rgba(5,150,105,0.3); color: var(--green-light); }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                position: static;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <span class="emerald-text">Market</span><span class="blue-text">Hub</span>
        </div>
        <div class="user-area">
            <span class="admin-badge">👑 مدير النظام</span>
            <button id="logoutBtn" class="btn-outline-light">تسجيل خروج</button>
        </div>
    </nav>

    <div class="main-container">
        <!-- القائمة الجانبية -->
        <div class="sidebar">
            <button class="active" data-section="users">👥 المستخدمين</button>
            <button data-section="featured">⭐ منتجات مميزة</button>
            <button data-section="banners">📢 إعلانات عامة</button>
        </div>

        <!-- المحتوى -->
        <div class="content">
            <!-- قسم المستخدمين -->
            <div id="section-users" class="section">
                <h2>👥 إدارة المستخدمين</h2>
                <table id="usersTable">
                    <thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>المتجر</th><th>تغيير الدور</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>

            <!-- قسم المنتجات المميزة -->
            <div id="section-featured" class="section" style="display:none;">
                <h2>⭐ المنتجات المميزة الحالية</h2>
                <div id="featuredProductsList"></div>
                <h3 style="margin-top:30px;">إضافة منتج مميز</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>معرف المنتج (UUID)</label>
                        <input type="text" id="productIdInput" placeholder="أدخل معرف المنتج">
                    </div>
                    <div class="form-group" style="align-self: flex-end;">
                        <button class="btn btn-success" onclick="addFeaturedProduct()">إضافة</button>
                    </div>
                </div>
            </div>

            <!-- قسم الإعلانات العامة -->
            <div id="section-banners" class="section" style="display:none;">
                <h2>📢 إعلانات عامة</h2>
                <div id="bannersList"></div>
                <h3 style="margin-top:30px;">إنشاء إعلان جديد</h3>
                <form id="bannerForm" enctype="multipart/form-data">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>العنوان</label>
                            <input type="text" id="bannerTitle" required placeholder="عنوان الإعلان">
                        </div>
                        <div class="form-group">
                            <label>الوصف (اختياري)</label>
                            <input type="text" id="bannerDescription" placeholder="وصف مختصر">
                        </div>
                        <div class="form-group">
                            <label>صورة (اختياري)</label>
                            <input type="file" id="bannerImage" accept="image/*">
                        </div>
                        <div class="form-group" style="align-self: flex-end;">
                            <button type="submit" class="btn btn-success">إنشاء إعلان</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer style="text-align:center; padding:20px; color:rgba(255,255,255,0.5);">
        © 2025 MarketHub - لوحة الإدارة
    </footer>

    <script>
        // ---------- التحقق من صلاحية الأدمن ----------
        async function checkAdmin() {
            try {
                const res = await fetch('/api/auth/me', { credentials: 'include' });
                if (!res.ok) {
                    window.location.href = 'login.html';
                    return;
                }
                const user = await res.json();
                if (user.role !== 'admin') {
                    window.location.href = 'dashboard.html';
                    return;
                }
            } catch (err) {
                window.location.href = 'login.html';
            }
        }

        // ---------- التنقل بين الأقسام ----------
        document.querySelectorAll('.sidebar button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const sectionId = btn.dataset.section;
                document.getElementById('section-users').style.display = sectionId === 'users' ? 'block' : 'none';
                document.getElementById('section-featured').style.display = sectionId === 'featured' ? 'block' : 'none';
                document.getElementById('section-banners').style.display = sectionId === 'banners' ? 'block' : 'none';
                if (sectionId === 'users') loadUsers();
                if (sectionId === 'featured') loadFeaturedProducts();
                if (sectionId === 'banners') loadBanners();
            });
        });

        // ---------- تحميل المستخدمين ----------
        async function loadUsers() {
            const res = await fetch('/api/admin/users', { credentials: 'include' });
            const users = await res.json();
            const tbody = document.querySelector('#usersTable tbody');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">لا يوجد مستخدمون</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.username}</td>
                    <td>${u.email}</td>
                    <td>${u.role}</td>
                    <td>${u.store_name || '—'}</td>
                    <td>
                        <select onchange="changeRole('${u.id}', this.value)" data-current="${u.role}">
                            <option value="user" ${u.role==='user'?'selected':''}>مستخدم</option>
                            <option value="seller" ${u.role==='seller'?'selected':''}>بائع</option>
                            <option value="admin" ${u.role==='admin'?'selected':''}>أدمن</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        async function changeRole(userId, role) {
            await fetch(`/api/admin/user/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role }),
                credentials: 'include'
            });
            loadUsers();
        }

        // ---------- المنتجات المميزة ----------
        async function loadFeaturedProducts() {
            const res = await fetch('/api/featured');
            const data = await res.json();
            const container = document.getElementById('featuredProductsList');
            const products = data.products || [];
            if (products.length === 0) {
                container.innerHTML = '<p>لا توجد منتجات مميزة</p>';
                return;
            }
            container.innerHTML = products.map(p => `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; background:rgba(0,0,0,0.2); padding:12px; border-radius:12px;">
                    <div>
                        <strong>${p.name}</strong> (${p.store_name}) - ${p.price}$
                    </div>
                    <button class="btn btn-danger" onclick="removeFeatured('${p.feature_id}')">إزالة</button>
                </div>
            `).join('');
        }

        async function addFeaturedProduct() {
            const productId = document.getElementById('productIdInput').value.trim();
            if (!productId) return alert('يرجى إدخال معرف المنتج');
            const res = await fetch('/api/admin/featured', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ productId }),
                credentials: 'include'
            });
            if (res.ok) {
                document.getElementById('productIdInput').value = '';
                loadFeaturedProducts();
            } else {
                const data = await res.json();
                alert(data.message || 'فشل الإضافة');
            }
        }

        async function removeFeatured(id) {
            await fetch(`/api/admin/featured/${id}`, { method: 'DELETE', credentials: 'include' });
            loadFeaturedProducts();
        }

        // ---------- الإعلانات العامة ----------
        async function loadBanners() {
            const res = await fetch('/api/featured');
            const data = await res.json();
            const container = document.getElementById('bannersList');
            const banners = data.banners || [];
            if (banners.length === 0) {
                container.innerHTML = '<p>لا توجد إعلانات عامة</p>';
                return;
            }
            container.innerHTML = banners.map(b => `
                <div class="banner-card">
                    <div style="display:flex; align-items:center; gap:15px;">
                        ${b.image ? `<img src="${b.image}" alt="${b.title}">` : ''}
                        <div>
                            <h4>${b.title}</h4>
                            <p>${b.description || ''}</p>
                        </div>
                    </div>
                    <button class="btn btn-danger" onclick="deleteBanner('${b.id}')">حذف</button>
                </div>
            `).join('');
        }

        document.getElementById('bannerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('title', document.getElementById('bannerTitle').value.trim());
            formData.append('description', document.getElementById('bannerDescription').value.trim());
            const imageFile = document.getElementById('bannerImage').files[0];
            if (imageFile) formData.append('image', imageFile);

            const res = await fetch('/api/admin/banners', {
                method: 'POST',
                body: formData,
                credentials: 'include'
            });
            if (res.ok) {
                document.getElementById('bannerTitle').value = '';
                document.getElementById('bannerDescription').value = '';
                document.getElementById('bannerImage').value = '';
                loadBanners();
            } else {
                alert('فشل إنشاء الإعلان');
            }
        });

        async function deleteBanner(id) {
            await fetch(`/api/admin/banners/${id}`, { method: 'DELETE', credentials: 'include' });
            loadBanners();
        }

        // ---------- تسجيل الخروج ----------
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.href = 'index.html';
        });

        // ---------- بدء التشغيل ----------
        checkAdmin().then(() => {
            loadUsers(); // تحميل القسم الافتراضي
        });
    </script>
</body>
</html>
