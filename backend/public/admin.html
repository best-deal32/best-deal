<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Vivor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        :root { --bg-deep: #040b14; --blue-mid: #1a3a6b; --blue-accent: #3b6cc2; --text: #e0e6f0; }
        body { font-family: 'Cairo', sans-serif; background: radial-gradient(ellipse at top, #0a1628 0%, var(--bg-deep) 70%); color: var(--text); min-height: 100vh; padding: 20px; }
        .glass { background: rgba(11,31,59,0.8); backdrop-filter: blur(15px); border: 1px solid rgba(43,80,150,0.4); border-radius: 2rem; }
        .btn { background: linear-gradient(135deg, #1a3a6b, #2a5298); color: #fff; font-weight: 800; border-radius: 1.5rem; padding: 0.7rem 1.5rem; border: none; cursor: pointer; }
        .hidden { display: none; }
        .flex-center { display: flex; align-items: center; justify-content: center; min-height: 80vh; }
        input { background: rgba(4,11,20,0.7); border: 1px solid rgba(59,108,194,0.4); color: #fff; padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 15px; }
    </style>
</head>
<body>
    <!-- شاشة البوابة -->
    <div id="gatewayScreen" class="flex-center">
        <div class="glass p-8 max-w-sm w-full text-center">
            <i class="fa-solid fa-dragon text-4xl text-blue-400 mb-3"></i>
            <h2 class="text-xl font-bold mb-4">بوابة الأدمن</h2>
            <input type="password" id="gatewayPass" placeholder="كلمة المرور السرية" dir="ltr">
            <button id="gatewayBtn" class="btn w-full">دخول</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي (مخفي حتى التحقق) -->
    <div id="mainPanel" class="hidden max-w-7xl mx-auto glass p-6">
        <!-- رأس الصفحة -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-dragon text-4xl text-blue-400 drop-shadow-xl"></i>
                <h1 class="text-2xl font-black text-blue-300">VIVOR - لوحة التحكم</h1>
            </div>
            <div><button onclick="loadEverything()" class="btn"><i class="fa-solid fa-rotate ml-1"></i> تحديث</button></div>
        </div>
        <!-- إحصائيات وتبويبات (نفس الهيكل السابق) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-[#0b1f3b] border border-blue-500/30 rounded-2xl p-4 text-center"><p class="text-xs text-slate-400">المستخدمين</p><p id="stat-users" class="text-2xl font-black text-blue-300">0</p></div>
            <div class="bg-[#0b1f3b] border border-blue-500/30 rounded-2xl p-4 text-center"><p class="text-xs text-slate-400">إيداعات معلقة</p><p id="stat-deposits" class="text-2xl font-black text-yellow-400">0</p></div>
            <div class="bg-[#0b1f3b] border border-blue-500/30 rounded-2xl p-4 text-center"><p class="text-xs text-slate-400">سحوبات معلقة</p><p id="stat-withdrawals" class="text-2xl font-black text-yellow-400">0</p></div>
            <div class="bg-[#0b1f3b] border border-blue-500/30 rounded-2xl p-4 text-center"><p class="text-xs text-slate-400">إجمالي الأرصدة</p><p id="stat-balance" class="text-2xl font-black text-blue-300">$0</p></div>
        </div>
        <!-- بقية الأقسام (مختصرة) -->
        <p class="text-center text-slate-400">جاري تحميل بقية الأقسام...</p>
    </div>

    <script>
        const API = '';
        let gatewayToken = '';

        // دخول البوابة
        document.getElementById('gatewayBtn').addEventListener('click', async () => {
            const pass = document.getElementById('gatewayPass').value;
            try {
                const res = await fetch(API + '/api/auth/verify-admin-gateway', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ secretPassword: pass }),
                    credentials: 'include'
                });
                const data = await res.json();
                if (data.success) {
                    // استخراج التوكن من الكوكيز يدويًا (لاستخدامه في header)
                    gatewayToken = document.cookie.replace(/(?:(?:^|.*;\s*)admin_gateway_token\s*\=\s*([^;]*).*$)|^.*$/, "$1");
                    if (!gatewayToken) {
                        // إذا لم نتمكن من قراءة الكوكيز، نطلب من المستخدم إعادة المحاولة
                        Swal.fire('خطأ', 'تعذر قراءة التوكن. تأكد من السماح بالكوكيز.', 'error');
                        return;
                    }
                    document.getElementById('gatewayScreen').classList.add('hidden');
                    document.getElementById('mainPanel').classList.remove('hidden');
                    loadEverything();
                } else {
                    Swal.fire('خطأ', 'كلمة المرور غير صحيحة', 'error');
                }
            } catch (e) {
                Swal.fire('خطأ', 'فشل الاتصال', 'error');
            }
        });

        // دالة api ترسل التوكن في الهيدر
        async function api(url, opt = {}) {
            opt.headers = opt.headers || {};
            opt.headers['Authorization'] = 'Bearer ' + gatewayToken;
            const res = await fetch(url, opt);
            if (res.status === 401) {
                // انتهت صلاحية البوابة
                document.getElementById('gatewayScreen').classList.remove('hidden');
                document.getElementById('mainPanel').classList.add('hidden');
                Swal.fire({ icon: 'warning', title: 'انتهت الجلسة', text: 'أدخل كلمة المرور مرة أخرى' });
                throw new Error('Unauthorized');
            }
            return res;
        }

        async function loadEverything() {
            // سيتم تحميل كل شيء بشكل طبيعي باستخدام دالة api الجديدة
            const usersR = await api(API + '/api/admin/users');
            const depositsR = await api(API + '/api/admin/deposits');
            // ... إلخ
            // (نفس التعليمات السابقة لتحميل البيانات)
            Swal.fire('تم', 'تم التحميل', 'success');
        }
    </script>
</body>
</html>
