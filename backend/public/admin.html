<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الأدمن - MarketHub</title>
    <style>
        /* تصميم مماثل */
        :root {
            --green-dark: #059669; --green-light: #6ee7b7;
            --blue-dark: #1e40af; --blue-light: #93c5fd;
            --white: #ffffff; --bg-glass: rgba(255, 255, 255, 0.1);
            --border-glass: rgba(255, 255, 255, 0.2);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #065f46 0%, #1e3a8a 100%);
            min-height: 100vh; color: var(--white); display: flex; flex-direction: column;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glass); padding: 15px 30px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { font-size: 1.8rem; font-weight: 800; }
        .main-container { flex:1; padding:30px 20px; max-width:1100px; margin:0 auto; width:100%; }
        .section { background:var(--bg-glass); backdrop-filter:blur(10px); border-radius:20px; padding:20px; margin-bottom:25px; }
        table { width:100%; border-collapse:collapse; margin-top:10px; }
        th, td { padding:10px; border-bottom:1px solid var(--border-glass); text-align:right; }
        .btn { padding:5px 15px; border-radius:20px; border:none; cursor:pointer; }
        .btn-danger { background:#b91c1c; color:white; }
        .btn-success { background:var(--green-dark); color:white; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><span class="emerald-text">Market</span><span class="blue-text">Hub</span> | أدمن</div>
        <a href="dashboard.html" style="color:white">الرئيسية</a>
    </nav>

    <div class="main-container">
        <div class="section">
            <h2>المستخدمين</h2>
            <table id="usersTable"><thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>إجراءات</th></tr></thead><tbody></tbody></table>
        </div>

        <div class="section">
            <h2>العروض المميزة الحالية</h2>
            <div id="featuredList"></div>
            <h3>إضافة منتج إلى المميزة</h3>
            <input type="text" id="productIdInput" placeholder="معرف المنتج (UUID)">
            <button onclick="addFeatured()" class="btn btn-success">إضافة</button>
        </div>
    </div>

    <script>
        async function checkAdmin() {
            const res = await fetch('/api/auth/me', { credentials: 'include' });
            if (res.ok) {
                const user = await res.json();
                if (user.role !== 'admin') window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'login.html';
            }
        }
        checkAdmin();

        async function loadUsers() {
            const res = await fetch('/api/admin/users', { credentials: 'include' });
            const users = await res.json();
            const tbody = document.querySelector('#usersTable tbody');
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.username}</td>
                    <td>${u.email}</td>
                    <td>${u.role}</td>
                    <td>
                        <select onchange="changeRole('${u.id}', this.value)">
                            <option value="user" ${u.role==='user'?'selected':''}>مستخدم</option>
                            <option value="seller" ${u.role==='seller'?'selected':''}>بائع</option>
                            <option value="admin" ${u.role==='admin'?'selected':''}>أدمن</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        async function changeRole(userId, role) {
            await fetch(`/api/admin/user/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role }),
                credentials: 'include'
            });
            loadUsers();
        }

        async function loadFeatured() {
            const res = await fetch('/api/featured');
            const featured = await res.json();
            document.getElementById('featuredList').innerHTML = featured.map(f =>
                `<div>${f.product.name} (${f.product.id}) <button onclick="removeFeatured('${f.id}')" class="btn btn-danger">حذف</button></div>`
            ).join('') || '<p>لا توجد عروض مميزة</p>';
        }

        async function addFeatured() {
            const productId = document.getElementById('productIdInput').value.trim();
            if (!productId) return;
            const res = await fetch('/api/admin/featured', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ productId }),
                credentials: 'include'
            });
            if (res.ok) {
                document.getElementById('productIdInput').value = '';
                loadFeatured();
            } else {
                alert('فشل الإضافة');
            }
        }

        async function removeFeatured(id) {
            await fetch(`/api/admin/featured/${id}`, { method: 'DELETE', credentials: 'include' });
            loadFeatured();
        }

        loadUsers();
        loadFeatured();
    </script>
</body>
</html>
