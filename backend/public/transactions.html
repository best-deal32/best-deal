<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>سجل المعاملات | Vivor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        
        :root {
            --bg-deep: #040b14;
            --bg-card: #071426;
            --blue-mid: #1a3a6b;
            --blue-light: #2a5298;
            --blue-accent: #3b6cc2;
            --border-light: rgba(43, 80, 150, 0.45);
            --text-primary: #e0e6f0;
            --text-dim: #99a8c0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: radial-gradient(ellipse at top, #0a1628 0%, var(--bg-deep) 70%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 1.5rem;
            overflow-x: hidden;
            padding-bottom: 6rem; /* for bottom nav */
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .dragon-icon {
            font-size: 2rem;
            color: var(--blue-accent);
            filter: drop-shadow(0 0 10px rgba(59,108,194,0.6));
        }

        .lang-selector {
            background: rgba(11, 31, 59, 0.65);
            border-radius: 3rem;
            padding: 0.3rem;
            display: inline-flex;
            gap: 0.2rem;
            border: 1px solid var(--border-light);
        }

        .lang-option {
            padding: 0.4rem 0.9rem;
            border-radius: 3rem;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-dim);
        }

        .lang-option.active {
            background: linear-gradient(135deg, var(--blue-mid), var(--blue-light));
            color: #fff;
            box-shadow: 0 0 15px rgba(42, 82, 152, 0.5);
        }

        .lang-option:hover:not(.active) {
            background: rgba(42, 82, 152, 0.2);
            color: #fff;
        }

        .btn-blue {
            background: linear-gradient(135deg, var(--blue-mid), var(--blue-light));
            color: #fff;
            font-weight: 800;
            border-radius: 1.25rem;
            padding: 0.6rem 1.5rem;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            box-shadow: 0 8px 20px rgba(26,58,107,0.5);
            font-size: 0.9rem;
        }

        .btn-blue:hover {
            background: linear-gradient(135deg, #204080, #3265b0);
            transform: translateY(-2px);
        }

        .filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .filter-btn {
            background: rgba(11,31,59,0.6);
            border: 1px solid var(--border-light);
            border-radius: 2rem;
            padding: 0.4rem 1.1rem;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-dim);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--blue-mid), var(--blue-light));
            color: #fff;
            border-color: transparent;
        }

        .filter-btn:hover:not(.active) {
            background: rgba(42,82,152,0.2);
            color: #fff;
        }

        .transaction-card {
            background: rgba(11,31,59,0.75);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            border-radius: 1.5rem;
            padding: 1rem 1.2rem;
            margin-bottom: 0.8rem;
            transition: 0.3s;
        }

        .transaction-card:hover {
            border-color: var(--blue-accent);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transform: translateY(-2px);
        }

        .type-badge {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .type-deposit { background: rgba(16,185,129,0.2); color: #10b981; }
        .type-withdrawal { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .type-investment { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .type-referral { background: rgba(168,85,247,0.2); color: #a78bfa; }

        .status-badge {
            margin-right: 0.4rem;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .status-approved { color: #10b981; }
        .status-pending { color: #f59e0b; }
        .status-rejected { color: #ef4444; }
        .status-active { color: #60a5fa; }
        .status-completed { color: #10b981; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(7,20,38,0.96);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-link.active { color: var(--blue-accent); }
        .nav-link i { font-size: 22px; margin-bottom: 4px; }

        .loading-spinner {
            display: flex;
            justify-content: center;
            padding: 3rem;
        }

        .back-btn {
            color: var(--text-dim);
            transition: 0.2s;
            font-weight: 700;
            cursor: pointer;
        }

        .back-btn:hover {
            color: var(--blue-accent);
        }

        @media (max-width: 500px) {
            .transaction-card {
                padding: 0.8rem 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- رأس الصفحة -->
        <div class="flex justify-between items-center mb-6">
            <button onclick="window.location.href='dashboard.html'" class="back-btn">
                <i class="fa-solid fa-arrow-right ml-2"></i> العودة للوحة التحكم
            </button>
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-dragon dragon-icon"></i>
                <span class="text-xl font-black text-white italic tracking-wide">VIVOR</span>
            </div>
            <div class="lang-selector">
                <div class="lang-option active" data-lang="ar">العربية</div>
                <div class="lang-option" data-lang="en">English</div>
                <div class="lang-option" data-lang="zh">中文</div>
                <div class="lang-option" data-lang="de">Deutsch</div>
            </div>
        </div>

        <h1 class="text-2xl font-black text-blue-300 mb-4"><i class="fa-solid fa-clock-rotate-left ml-2"></i> سجل المعاملات</h1>

        <!-- أزرار الفلترة -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">الكل</button>
            <button class="filter-btn" data-filter="deposit">إيداعات</button>
            <button class="filter-btn" data-filter="withdrawal">سحوبات</button>
            <button class="filter-btn" data-filter="investment">استثمارات</button>
            <button class="filter-btn" data-filter="referral">إحالات</button>
        </div>

        <!-- مؤشر التحميل -->
        <div id="loadingIndicator" class="loading-spinner">
            <i class="fa-solid fa-spinner fa-spin text-2xl text-blue-400"></i>
        </div>

        <!-- قائمة المعاملات -->
        <div id="transactionsList" class="space-y-2" style="display: none;"></div>

        <!-- رسالة عدم وجود بيانات -->
        <div id="noDataMessage" class="text-center py-12 text-slate-500" style="display: none;">
            <i class="fa-regular fa-folder-open text-4xl mb-2"></i>
            <p>لا توجد معاملات حتى الآن</p>
        </div>
    </div>

    <!-- القائمة السفلية -->
    <div class="bottom-nav">
        <div onclick="window.location.href='dashboard.html'" class="nav-link"><i class="fa-solid fa-house-chimney"></i><span>الرئيسية</span></div>
        <div onclick="window.location.href='deposit.html'" class="nav-link"><i class="fa-solid fa-wallet"></i><span>الإيداع</span></div>
        <div onclick="window.location.href='investments.html'" class="nav-link"><i class="fa-solid fa-chart-line"></i><span>المشاريع</span></div>
        <div onclick="window.location.href='transactions.html'" class="nav-link active"><i class="fa-solid fa-clock-rotate-left"></i><span>التاريخ</span></div>
        <div onclick="logout()" class="nav-link text-red-400"><i class="fa-solid fa-power-off"></i><span>خروج</span></div>
    </div>

    <script>
        // ============================================================
        // 1. الإعدادات العامة - مسارات نسبية
        // ============================================================
        const API_BASE_URL = '';
        const URL_ME = `${API_BASE_URL}/api/users/me`;
        const URL_REFRESH = `${API_BASE_URL}/api/auth/refresh`;
        const URL_DEPOSITS = `${API_BASE_URL}/api/deposits/my`;
        const URL_WITHDRAWALS = `${API_BASE_URL}/api/withdrawals/my`;
        const URL_INVESTMENTS = `${API_BASE_URL}/api/investments/my`;
        const URL_REFERRALS = `${API_BASE_URL}/api/referrals/my`;

        let socket = null;
        let currentLang = localStorage.getItem('preferredLanguage') || 'ar';
        const translations = {};

        // ============================================================
        // 2. i18n Translations
        // ============================================================
        async function loadTranslations(lang) {
            try {
                const response = await fetch(`/locales/${lang}/translation.json`);
                if (!response.ok) throw new Error();
                const data = await response.json();
                translations[lang] = data;
                return data;
            } catch (err) {
                console.warn(`Failed to load translations for ${lang}, falling back to ar`);
                if (lang !== 'ar') return loadTranslations('ar');
                return {};
            }
        }

        function applyTranslations(lang) {
            const t = translations[lang];
            if (!t) return;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
            const htmlEl = document.documentElement;
            if (lang === 'ar') {
                htmlEl.setAttribute('dir', 'rtl');
                htmlEl.setAttribute('lang', 'ar');
            } else {
                htmlEl.setAttribute('dir', 'ltr');
                htmlEl.setAttribute('lang', lang);
            }
            localStorage.setItem('preferredLanguage', lang);
            currentLang = lang;
            document.querySelectorAll('.lang-option').forEach(opt => {
                if (opt.getAttribute('data-lang') === lang) opt.classList.add('active');
                else opt.classList.remove('active');
            });
            document.cookie = `i18n=${lang}; path=/; max-age=31536000`;
        }

        async function setLanguage(lang) {
            if (!translations[lang]) await loadTranslations(lang);
            applyTranslations(lang);
            loadTransactions();
        }

        document.querySelectorAll('.lang-option').forEach(opt => {
            opt.addEventListener('click', async () => {
                const lang = opt.getAttribute('data-lang');
                if (lang === currentLang) return;
                await setLanguage(lang);
            });
        });

        // ============================================================
        // WebSocket (لتوافق النظام)
        // ============================================================
        function initSocket() {
            if (!socket) {
                socket = io(window.location.origin, { withCredentials: true });
                socket.on('connect', () => {
                    console.log('Socket connected on transactions page');
                });
                socket.on('notification', (data) => {
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: data.type || 'info',
                        title: data.title,
                        text: data.message,
                        showConfirmButton: false,
                        timer: 5000,
                        background: '#071426',
                        color: '#fff'
                    });
                });
            }
        }

        // ============================================================
        // 3. Auth helper
        // ============================================================
        async function fetchWithAuth(url, options = {}) {
            options.credentials = 'include';
            let response = await fetch(url, options);
            if (response.status === 401 || response.status === 403) {
                const refreshRes = await fetch(URL_REFRESH, { method: 'POST', credentials: 'include' });
                if (refreshRes.ok) {
                    response = await fetch(url, options);
                } else {
                    localStorage.removeItem('currentUser');
                    window.location.href = 'login.html';
                    throw new Error('Session expired');
                }
            }
            return response;
        }

        // ============================================================
        // 4. Fetch all transactions
        // ============================================================
        async function loadTransactions() {
            const loadingDiv = document.getElementById('loadingIndicator');
            const container = document.getElementById('transactionsList');
            const noDataDiv = document.getElementById('noDataMessage');

            loadingDiv.style.display = 'flex';
            container.style.display = 'none';
            noDataDiv.style.display = 'none';

            try {
                const [deposits, withdrawals, investments, referralsRes] = await Promise.all([
                    fetchWithAuth(URL_DEPOSITS).then(r => r.ok ? r.json() : []),
                    fetchWithAuth(URL_WITHDRAWALS).then(r => r.ok ? r.json() : []),
                    fetchWithAuth(URL_INVESTMENTS).then(r => r.ok ? r.json() : []),
                    fetchWithAuth(URL_REFERRALS).then(r => r.ok ? r.json() : { referrals: [] })
                ]);

                const referrals = referralsRes.referrals || [];
                let allTransactions = [];

                // إيداعات
                (deposits || []).forEach(d => {
                    allTransactions.push({
                        id: d.id,
                        type: 'deposit',
                        amount: parseFloat(d.amount) || 0,
                        status: d.status || 'pending',
                        date: new Date(d.date),
                        details: `الطريقة: ${d.method || 'USDT'}`,
                    });
                });

                // سحوبات
                (withdrawals || []).forEach(w => {
                    let typeText = w.type === 'profit' ? 'أرباح' : 'أصل';
                    allTransactions.push({
                        id: w.id,
                        type: 'withdrawal',
                        amount: parseFloat(w.amount) || 0,
                        status: w.status || 'pending',
                        date: new Date(w.date),
                        details: `${typeText} | محفظة: ${(w.walletAddress || '').substring(0,10)}...`,
                    });
                });

                // استثمارات
                (investments || []).forEach(inv => {
                    let projectName = '';
                    if (inv.projectType === 'daily') projectName = 'يومي';
                    else if (inv.projectType === 'weekly') projectName = 'أسبوعي';
                    else if (inv.projectType === 'monthly') projectName = 'شهري';
                    else if (inv.projectType === '15days') projectName = '15 يوم';
                    else projectName = 'VIP';
                    allTransactions.push({
                        id: inv.id,
                        type: 'investment',
                        amount: parseFloat(inv.amount) || 0,
                        status: 'active',
                        date: new Date(inv.startDate),
                        details: `مشروع ${projectName}`,
                    });
                });

                // إحالات
                (referrals || []).forEach(ref => {
                    const reward = parseFloat(ref.reward) || 0;
                    if (reward > 0) {
                        allTransactions.push({
                            id: `ref_${ref.username}`,
                            type: 'referral',
                            amount: reward,
                            status: 'completed',
                            date: new Date(ref.registeredAt),
                            details: `مكافأة من ${ref.username}`,
                        });
                    }
                });

                // ترتيب تنازلي حسب التاريخ
                allTransactions.sort((a, b) => b.date - a.date);

                // تطبيق الفلتر الحالي
                const activeFilter = document.querySelector('.filter-btn.active')?.getAttribute('data-filter') || 'all';
                let filtered = allTransactions;
                if (activeFilter !== 'all') {
                    filtered = allTransactions.filter(t => t.type === activeFilter);
                }

                if (filtered.length === 0) {
                    noDataDiv.style.display = 'block';
                    container.style.display = 'none';
                } else {
                    noDataDiv.style.display = 'none';
                    renderTransactions(filtered);
                    container.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                Swal.fire('خطأ', 'فشل تحميل المعاملات', 'error');
                noDataDiv.style.display = 'block';
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        function renderTransactions(transactions) {
            const container = document.getElementById('transactionsList');
            const t = translations[currentLang] || {};
            container.innerHTML = '';

            transactions.forEach(tx => {
                const amountNum = (typeof tx.amount === 'number') ? tx.amount : parseFloat(tx.amount) || 0;
                const typeClass = `type-${tx.type}`;
                let typeText = '';
                if (tx.type === 'deposit') typeText = t.deposit || 'إيداع';
                else if (tx.type === 'withdrawal') typeText = t.withdrawal || 'سحب';
                else if (tx.type === 'investment') typeText = t.investment || 'استثمار';
                else if (tx.type === 'referral') typeText = t.referral || 'إحالة';

                let statusText = '';
                let statusClass = '';
                if (tx.status === 'approved') { statusText = t.approved || 'موافق عليه'; statusClass = 'status-approved'; }
                else if (tx.status === 'pending') { statusText = t.pending_status || 'قيد المراجعة'; statusClass = 'status-pending'; }
                else if (tx.status === 'rejected') { statusText = t.rejected || 'مرفوض'; statusClass = 'status-rejected'; }
                else if (tx.status === 'active') { statusText = t.active || 'نشط'; statusClass = 'status-active'; }
                else if (tx.status === 'completed') { statusText = t.completed || 'مكتمل'; statusClass = 'status-completed'; }
                else { statusText = tx.status; statusClass = ''; }

                const amountColor = (tx.type === 'deposit' || tx.type === 'referral') ? 'text-green-400' : (tx.type === 'withdrawal' ? 'text-yellow-400' : 'text-blue-400');
                const amountSign = (tx.type === 'withdrawal') ? '- ' : '+ ';
                const dateStr = tx.date.toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-US', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });

                const card = document.createElement('div');
                card.className = 'transaction-card';
                card.innerHTML = `
                    <div class="flex flex-wrap justify-between items-start gap-2">
                        <div class="flex items-center gap-2">
                            <span class="type-badge ${typeClass}">${typeText}</span>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="text-left">
                            <span class="text-lg font-bold ${amountColor}">${amountSign}${amountNum.toFixed(2)} $</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center mt-2 text-xs text-slate-400">
                        <span>${dateStr}</span>
                        <span class="truncate max-w-[200px]">${escapeHtml(tx.details)}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ============================================================
        // 5. Filtering
        // ============================================================
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadTransactions();
            });
        });

        // ============================================================
        // 6. Logout
        // ============================================================
        async function logout() {
            const result = await Swal.fire({
                title: 'تسجيل الخروج',
                text: 'هل أنت متأكد؟',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#3b6cc2'
            });
            if (result.isConfirmed) {
                try {
                    await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                } catch(e) {}
                document.cookie.split(";").forEach((c) => {
                    document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
                });
                localStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ============================================================
        // 7. Initialization
        // ============================================================
        window.onload = async () => {
            await loadTranslations(currentLang);
            applyTranslations(currentLang);
            initSocket();
            try {
                const res = await fetchWithAuth(URL_ME);
                if (!res.ok) throw new Error();
                await loadTransactions();
            } catch(e) {
                window.location.href = 'login.html';
            }
        };
    </script>
</body>
</html>
