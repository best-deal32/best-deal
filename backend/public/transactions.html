<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>سجل المعاملات | Best Deal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        
        :root {
            --gold: #d4af37;
            --gold-dark: #8a6d3b;
            --dark-bg: #06090f;
            --card-bg: rgba(15, 23, 42, 0.9);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #d4af37 0%, #f7e08a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 2rem;
            backdrop-filter: blur(20px);
            transition: all 0.3s;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 15, 26, 0.98);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        .nav-link.active { color: var(--gold); }
        .nav-link i { font-size: 22px; margin-bottom: 4px; }

        .lang-selector {
            background: rgba(0,0,0,0.4);
            border-radius: 2rem;
            padding: 0.25rem;
            display: inline-flex;
            gap: 0.25rem;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .lang-option {
            padding: 0.3rem 0.7rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            color: #94a3b8;
        }
        .lang-option.active {
            background: linear-gradient(135deg, #d4af37, #8a6d3b);
            color: #000;
        }

        .filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .filter-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-btn.active {
            background: linear-gradient(135deg, #d4af37, #8a6d3b);
            color: #000;
            border-color: transparent;
        }
        .filter-btn:hover:not(.active) {
            background: rgba(212,175,55,0.2);
        }

        .transaction-item {
            background: rgba(255,255,255,0.03);
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 0.75rem;
            transition: 0.2s;
        }
        .transaction-item:hover {
            background: rgba(255,255,255,0.06);
        }
        .type-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: bold;
        }
        .type-deposit { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .type-withdrawal { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .type-investment { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .type-referral { background: rgba(168, 85, 247, 0.2); color: #a78bfa; }
        .status-approved { color: #10b981; }
        .status-pending { color: #f59e0b; }
        .status-rejected { color: #ef4444; }
        .status-active { color: #60a5fa; }
        .status-completed { color: #10b981; }
    </style>
</head>
<body class="pb-32">

    <header class="max-w-7xl mx-auto px-6 py-6 flex justify-between items-center">
        <button onclick="window.location.href='dashboard.html'" class="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center hover:bg-white/10">
            <i class="fa-solid fa-arrow-right text-xl text-[#d4af37]"></i>
        </button>
        <h1 class="text-2xl font-black gold-gradient-text italic" data-i18n="transactions_title">سجل المعاملات</h1>
        <div class="lang-selector">
            <div class="lang-option active" data-lang="ar">العربية</div>
            <div class="lang-option" data-lang="en">English</div>
            <div class="lang-option" data-lang="zh">中文</div>
            <div class="lang-option" data-lang="de">Deutsch</div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pb-24">
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all" data-i18n="filter_all">الكل</button>
            <button class="filter-btn" data-filter="deposit" data-i18n="filter_deposit">إيداعات</button>
            <button class="filter-btn" data-filter="withdrawal" data-i18n="filter_withdrawal">سحوبات</button>
            <button class="filter-btn" data-filter="investment" data-i18n="filter_investment">استثمارات</button>
            <button class="filter-btn" data-filter="referral" data-i18n="filter_referral">إحالات</button>
        </div>

        <div id="loadingIndicator" class="text-center py-12">
            <i class="fa-solid fa-spinner fa-spin text-2xl text-gold"></i>
            <p class="mt-2" data-i18n="loading_transactions">جاري تحميل المعاملات...</p>
        </div>

        <div id="transactionsList" class="space-y-3" style="display: none;"></div>
        <div id="noDataMessage" class="text-center py-12 text-slate-500" style="display: none;" data-i18n="no_transactions">لا توجد معاملات حتى الآن</div>
    </main>

    <div class="bottom-nav">
        <div onclick="window.location.href='dashboard.html'" class="nav-link"><i class="fa-solid fa-house-chimney"></i><span data-i18n="home">الرئيسية</span></div>
        <div onclick="window.location.href='deposit.html'" class="nav-link"><i class="fa-solid fa-wallet"></i><span data-i18n="deposit">الإيداع</span></div>
        <div onclick="window.location.href='investments.html'" class="nav-link"><i class="fa-solid fa-chart-line"></i><span data-i18n="investments">المشاريع</span></div>
        <div onclick="window.location.href='transactions.html'" class="nav-link active"><i class="fa-solid fa-clock-rotate-left"></i><span data-i18n="history">التاريخ</span></div>
        <div onclick="logout()" class="nav-link text-red-500"><i class="fa-solid fa-power-off"></i><span data-i18n="logout">خروج</span></div>
    </div>

    <script>
        // ============================================================
        // 1. الإعدادات العامة - مسارات نسبية
        // ============================================================
        const API_BASE_URL = '';
        const URL_ME = `${API_BASE_URL}/api/users/me`;
        const URL_REFRESH = `${API_BASE_URL}/api/auth/refresh`;
        const URL_DEPOSITS = `${API_BASE_URL}/api/deposits/my`;
        const URL_WITHDRAWALS = `${API_BASE_URL}/api/withdrawals/my`;
        const URL_INVESTMENTS = `${API_BASE_URL}/api/investments/my`;
        const URL_REFERRALS = `${API_BASE_URL}/api/referrals/my`;

        // ============================================================
        // 2. i18n Translations
        // ============================================================
        let currentLang = localStorage.getItem('preferredLanguage') || 'ar';
        const translations = {};

        async function loadTranslations(lang) {
            try {
                const response = await fetch(`/locales/${lang}/translation.json`);
                if (!response.ok) throw new Error();
                const data = await response.json();
                translations[lang] = data;
                return data;
            } catch (err) {
                console.warn(`Failed to load translations for ${lang}, falling back to ar`);
                if (lang !== 'ar') return loadTranslations('ar');
                return {};
            }
        }

        function applyTranslations(lang) {
            const t = translations[lang];
            if (!t) return;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
            const htmlEl = document.documentElement;
            if (lang === 'ar') {
                htmlEl.setAttribute('dir', 'rtl');
                htmlEl.setAttribute('lang', 'ar');
            } else {
                htmlEl.setAttribute('dir', 'ltr');
                htmlEl.setAttribute('lang', lang);
            }
            localStorage.setItem('preferredLanguage', lang);
            currentLang = lang;
            document.querySelectorAll('.lang-option').forEach(opt => {
                if (opt.getAttribute('data-lang') === lang) opt.classList.add('active');
                else opt.classList.remove('active');
            });
            document.cookie = `i18n=${lang}; path=/; max-age=31536000`;
        }

        async function setLanguage(lang) {
            if (!translations[lang]) await loadTranslations(lang);
            applyTranslations(lang);
            loadTransactions();
        }

        document.querySelectorAll('.lang-option').forEach(opt => {
            opt.addEventListener('click', async () => {
                const lang = opt.getAttribute('data-lang');
                if (lang === currentLang) return;
                await setLanguage(lang);
            });
        });

        // ============================================================
        // 3. Auth helper
        // ============================================================
        async function fetchWithAuth(url, options = {}) {
            options.credentials = 'include';
            let response = await fetch(url, options);
            if (response.status === 401 || response.status === 403) {
                const refreshRes = await fetch(URL_REFRESH, { method: 'POST', credentials: 'include' });
                if (refreshRes.ok) {
                    response = await fetch(url, options);
                } else {
                    localStorage.removeItem('currentUser');
                    window.location.href = 'login.html';
                    throw new Error('Session expired');
                }
            }
            return response;
        }

        // ============================================================
        // 4. Fetch all transactions (مع تحويل الأرقام بشكل آمن)
        // ============================================================
        async function loadTransactions() {
            const loadingDiv = document.getElementById('loadingIndicator');
            const container = document.getElementById('transactionsList');
            const noDataDiv = document.getElementById('noDataMessage');
            loadingDiv.style.display = 'block';
            container.style.display = 'none';
            noDataDiv.style.display = 'none';

            try {
                // جلب جميع البيانات بشكل متوازٍ
                const [deposits, withdrawals, investments, referralsRes] = await Promise.all([
                    fetchWithAuth(URL_DEPOSITS).then(r => r.ok ? r.json() : []),
                    fetchWithAuth(URL_WITHDRAWALS).then(r => r.ok ? r.json() : []),
                    fetchWithAuth(URL_INVESTMENTS).then(r => r.ok ? r.json() : []),
                    fetchWithAuth(URL_REFERRALS).then(r => r.ok ? r.json() : { referrals: [] })
                ]);
                const referrals = referralsRes.referrals || [];

                let allTransactions = [];

                // معالجة الإيداعات (تحويل amount إلى رقم)
                (deposits || []).forEach(d => {
                    allTransactions.push({
                        id: d.id,
                        type: 'deposit',
                        amount: parseFloat(d.amount) || 0,
                        status: d.status || 'pending',
                        date: new Date(d.date),
                        details: `الطريقة: ${d.method || 'USDT'}`,
                        original: d
                    });
                });

                // معالجة السحوبات
                (withdrawals || []).forEach(w => {
                    let typeText = w.type === 'profit' ? 'أرباح' : 'أصل';
                    allTransactions.push({
                        id: w.id,
                        type: 'withdrawal',
                        amount: parseFloat(w.amount) || 0,
                        status: w.status || 'pending',
                        date: new Date(w.date),
                        details: `${typeText} | محفظة: ${(w.walletAddress || '').substring(0,10)}...`,
                        original: w
                    });
                });

                // معالجة الاستثمارات
                (investments || []).forEach(inv => {
                    let projectName = '';
                    if (inv.projectType === 'daily') projectName = 'يومي';
                    else if (inv.projectType === 'weekly') projectName = 'أسبوعي';
                    else if (inv.projectType === 'monthly') projectName = 'شهري';
                    else if (inv.projectType === 'vip') projectName = 'VIP';
                    allTransactions.push({
                        id: inv.id,
                        type: 'investment',
                        amount: parseFloat(inv.amount) || 0,
                        status: 'active',
                        date: new Date(inv.startDate),
                        details: `مشروع ${projectName}`,
                        original: inv
                    });
                });

                // معالجة مكافآت الإحالات (فقط التي لها مكافأة > 0)
                (referrals || []).forEach(ref => {
                    const reward = parseFloat(ref.reward) || 0;
                    if (reward > 0) {
                        allTransactions.push({
                            id: `ref_${ref.username}`,
                            type: 'referral',
                            amount: reward,
                            status: 'completed',
                            date: new Date(ref.registeredAt),
                            details: `مكافأة من ${ref.username}`,
                            original: ref
                        });
                    }
                });

                // ترتيب تنازلي حسب التاريخ
                allTransactions.sort((a,b) => b.date - a.date);

                // تطبيق الفلتر الحالي
                const activeFilter = document.querySelector('.filter-btn.active')?.getAttribute('data-filter') || 'all';
                let filtered = allTransactions;
                if (activeFilter !== 'all') {
                    filtered = allTransactions.filter(t => t.type === activeFilter);
                }

                if (filtered.length === 0) {
                    noDataDiv.style.display = 'block';
                    container.style.display = 'none';
                } else {
                    noDataDiv.style.display = 'none';
                    renderTransactions(filtered);
                    container.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                Swal.fire('خطأ', translations[currentLang]?.load_failed || 'فشل تحميل المعاملات', 'error');
                noDataDiv.style.display = 'block';
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        function renderTransactions(transactions) {
            const container = document.getElementById('transactionsList');
            const t = translations[currentLang] || {};
            container.innerHTML = '';
            transactions.forEach(tx => {
                // تأكيد أن amount رقم قبل استخدام toFixed
                const amountNum = (typeof tx.amount === 'number') ? tx.amount : parseFloat(tx.amount) || 0;
                const typeClass = `type-${tx.type}`;
                let typeText = '';
                if (tx.type === 'deposit') typeText = t.deposit || 'إيداع';
                else if (tx.type === 'withdrawal') typeText = t.withdrawal || 'سحب';
                else if (tx.type === 'investment') typeText = t.investment || 'استثمار';
                else typeText = t.referral || 'إحالة';

                let statusText = '';
                let statusClass = '';
                if (tx.status === 'approved') { statusText = t.approved || 'موافق عليه'; statusClass = 'status-approved'; }
                else if (tx.status === 'pending') { statusText = t.pending_status || 'قيد المراجعة'; statusClass = 'status-pending'; }
                else if (tx.status === 'rejected') { statusText = t.rejected || 'مرفوض'; statusClass = 'status-rejected'; }
                else if (tx.status === 'active') { statusText = t.active || 'نشط'; statusClass = 'status-active'; }
                else if (tx.status === 'completed') { statusText = t.completed || 'مكتمل'; statusClass = 'status-completed'; }
                else { statusText = tx.status; statusClass = ''; }

                const amountColor = (tx.type === 'deposit' || tx.type === 'referral') ? 'text-green-400' : (tx.type === 'withdrawal' ? 'text-yellow-400' : 'text-blue-400');
                const amountSign = (tx.type === 'withdrawal') ? '- ' : '+ ';
                const dateStr = tx.date.toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-US', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });

                const item = document.createElement('div');
                item.className = 'transaction-item';
                item.innerHTML = `
                    <div class="flex flex-wrap justify-between items-start gap-2">
                        <div>
                            <span class="type-badge ${typeClass}">${typeText}</span>
                            <span class="text-xs mr-2 ${statusClass}">${statusText}</span>
                        </div>
                        <div class="text-left">
                            <span class="text-lg font-bold ${amountColor}">${amountSign}${amountNum.toFixed(2)} $</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center mt-2 text-xs text-slate-400">
                        <span>${dateStr}</span>
                        <span class="truncate max-w-[200px]">${escapeHtml(tx.details)}</span>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // ============================================================
        // 5. Filtering
        // ============================================================
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadTransactions();
            });
        });

        // ============================================================
        // 6. Logout
        // ============================================================
        async function logout() {
            const result = await Swal.fire({
                title: translations[currentLang]?.logout_title || 'تسجيل الخروج',
                text: translations[currentLang]?.logout_confirm || 'هل أنت متأكد؟',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#d4af37'
            });
            if (result.isConfirmed) {
                try {
                    await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                } catch(e) {}
                document.cookie.split(";").forEach((c) => {
                    document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
                });
                localStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ============================================================
        // 7. Initialization
        // ============================================================
        window.onload = async () => {
            await loadTranslations(currentLang);
            applyTranslations(currentLang);
            try {
                const res = await fetchWithAuth(URL_ME);
                if (!res.ok) throw new Error();
                await loadTransactions();
            } catch(e) {
                window.location.href = 'login.html';
            }
        };
    </script>
</body>
</html>
