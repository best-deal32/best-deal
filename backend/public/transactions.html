<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>سجل المعاملات | Fargo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        :root {
            --bg-deep: #040b14;
            --red-dark: #800000;
            --red-mid: #a00000;
            --red-light: #c00000;
            --red-accent: #ff3333;
            --text-primary: #e0e6f0;
            --text-dim: #99a8c0;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(ellipse at top, #1a0000 0%, var(--bg-deep) 70%);
            color: var(--text-primary);
            margin: 0; padding: 0; min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 5rem;
        }
        .glass-card {
            background: rgba(20,5,5,0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,51,51,0.35);
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .btn-red {
            background: linear-gradient(135deg, var(--red-mid), var(--red-light));
            color: #fff; font-weight: 800; border-radius: 1.25rem;
            padding: 0.7rem 1.5rem; transition: 0.3s; cursor: pointer;
            border: none; display: inline-flex; align-items: center; gap: 0.5rem;
        }
        .btn-red:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .lang-selector {
            background: rgba(20,5,5,0.65); border-radius: 3rem; padding: 0.3rem;
            display: inline-flex; gap: 0.2rem; border: 1px solid rgba(255,51,51,0.3);
        }
        .lang-option {
            padding: 0.4rem 0.9rem; border-radius: 3rem; font-size: 0.7rem;
            font-weight: bold; cursor: pointer; color: var(--text-dim); transition: 0.2s;
        }
        .lang-option.active {
            background: linear-gradient(135deg, var(--red-mid), var(--red-light));
            color: #fff;
        }
        .lang-option:hover:not(.active) { background: rgba(255,51,51,0.15); color: #fff; }
        .filter-bar {
            display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;
        }
        .filter-btn {
            background: rgba(20,5,5,0.6); border: 1px solid rgba(255,51,51,0.3);
            border-radius: 2rem; padding: 0.4rem 1.2rem; font-size: 0.75rem; font-weight: bold;
            cursor: pointer; transition: 0.2s; color: var(--text-dim);
        }
        .filter-btn.active {
            background: linear-gradient(135deg, var(--red-mid), var(--red-light));
            color: #fff; border-color: transparent;
        }
        .filter-btn:hover:not(.active) { background: rgba(255,51,51,0.15); color: #fff; }
        .transaction-card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1.5rem; padding: 1rem 1.2rem; margin-bottom: 0.8rem; transition: 0.3s;
        }
        .transaction-card:hover { border-color: var(--red-accent); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .type-badge {
            display: inline-block; padding: 0.2rem 0.7rem; border-radius: 20px;
            font-size: 0.7rem; font-weight: bold;
        }
        .type-deposit { background: rgba(16,185,129,0.2); color: #10b981; }
        .type-withdrawal { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .type-investment { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .type-referral { background: rgba(168,85,247,0.2); color: #a78bfa; }
        .status-badge { margin-right: 0.4rem; font-size: 0.7rem; font-weight: bold; }
        .status-approved { color: #10b981; }
        .status-pending { color: #f59e0b; }
        .status-rejected { color: #ef4444; }
        .status-active { color: #60a5fa; }
        .status-completed { color: #10b981; }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(7,20,38,0.96); border-top: 1px solid rgba(255,51,51,0.3);
            display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000;
        }
        .nav-link {
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-dim); font-size: 11px; font-weight: 800; cursor: pointer;
        }
        .nav-link.active { color: var(--red-accent); }
        .nav-link i { font-size: 1.5rem; margin-bottom: 3px; }
        @media (max-width: 640px) {
            .glass-card { padding: 1.2rem; border-radius: 1.5rem; }
            .filter-btn { padding: 0.3rem 0.9rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<header class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
    <button onclick="window.location.href='dashboard.html'" class="text-slate-400 hover:text-red-400 transition">
        <i class="fa-solid fa-arrow-right text-xl"></i>
    </button>
    <div class="flex items-center gap-3">
        <i class="fa-solid fa-shield-halved text-3xl text-red-400 drop-shadow-xl"></i>
        <span class="text-xl font-black text-white italic tracking-wide">FARGO</span>
    </div>
    <div class="lang-selector">
        <div class="lang-option active" data-lang="ar">العربية</div>
        <div class="lang-option" data-lang="en">English</div>
        <div class="lang-option" data-lang="zh">中文</div>
        <div class="lang-option" data-lang="de">Deutsch</div>
    </div>
</header>

<main class="max-w-5xl mx-auto px-4 mt-4">
    <!-- أزرار الفلترة -->
    <div class="filter-bar justify-center">
        <button class="filter-btn active" data-filter="all">الكل</button>
        <button class="filter-btn" data-filter="deposit">إيداعات</button>
        <button class="filter-btn" data-filter="withdrawal">سحوبات</button>
        <button class="filter-btn" data-filter="investment">استثمارات</button>
        <button class="filter-btn" data-filter="referral">إحالات</button>
    </div>

    <!-- مؤشر التحميل -->
    <div id="loadingIndicator" class="text-center py-12">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-red-400"></i>
        <p class="mt-2 text-slate-400">جاري تحميل المعاملات...</p>
    </div>

    <!-- قائمة المعاملات -->
    <div id="transactionsList" class="space-y-2" style="display: none;"></div>

    <!-- رسالة عدم وجود بيانات -->
    <div id="noDataMessage" class="text-center py-12 text-slate-500 hidden">
        <i class="fa-regular fa-folder-open text-5xl mb-3"></i>
        <p>لا توجد معاملات حتى الآن</p>
    </div>
</main>

<!-- القائمة السفلية -->
<div class="bottom-nav">
    <div onclick="window.location.href='dashboard.html'" class="nav-link"><i class="fa-solid fa-house-chimney"></i><span>الرئيسية</span></div>
    <div onclick="window.location.href='deposit.html'" class="nav-link"><i class="fa-solid fa-wallet"></i><span>إيداع</span></div>
    <div onclick="window.location.href='investments.html'" class="nav-link"><i class="fa-solid fa-chart-line"></i><span>استثمار</span></div>
    <div onclick="window.location.href='transactions.html'" class="nav-link active"><i class="fa-solid fa-clock-rotate-left"></i><span>التاريخ</span></div>
    <div onclick="logout()" class="nav-link text-red-400"><i class="fa-solid fa-power-off"></i><span>خروج</span></div>
</div>

<script>
    const API_BASE_URL = '';
    const URL_ME = `${API_BASE_URL}/api/users/me`;
    const URL_REFRESH = `${API_BASE_URL}/api/auth/refresh`;
    const URL_DEPOSITS = `${API_BASE_URL}/api/deposits/my`;
    const URL_WITHDRAWALS = `${API_BASE_URL}/api/withdrawals/my`;
    const URL_INVESTMENTS = `${API_BASE_URL}/api/investments/my`;
    const URL_REFERRALS = `${API_BASE_URL}/api/referrals/my`;

    let socket = null;
    let currentLang = localStorage.getItem('preferredLanguage') || 'ar';
    const translations = {};

    // i18n
    async function loadTranslations(lang) {
        try {
            const res = await fetch(`/locales/${lang}/translation.json`);
            if (!res.ok) throw new Error();
            translations[lang] = await res.json();
            return translations[lang];
        } catch (e) { return {}; }
    }
    async function applyTranslations(lang) {
        if (!translations[lang]) await loadTranslations(lang);
        const t = translations[lang] || {};
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.textContent = t[key];
        });
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
        localStorage.setItem('preferredLanguage', lang);
        currentLang = lang;
        document.querySelectorAll('.lang-option').forEach(o => o.classList.toggle('active', o.dataset.lang === lang));
        document.cookie = `i18n=${lang}; path=/; max-age=31536000`;
    }
    document.querySelectorAll('.lang-option').forEach(opt => {
        opt.addEventListener('click', async () => await applyTranslations(opt.dataset.lang));
    });

    // Socket
    function initSocket() {
        socket = io(window.location.origin, { withCredentials: true });
        socket.on('notification', data => {
            Swal.fire({ toast: true, position: 'top-end', icon: 'info', title: data.title, text: data.message, timer: 5000, background: '#1a0000', color: '#fff' });
        });
    }

    // Auth Fetch
    async function fetchWithAuth(url, options = {}) {
        options.credentials = 'include';
        let res = await fetch(url, options);
        if (res.status === 401 || res.status === 403) {
            const refresh = await fetch(URL_REFRESH, { method: 'POST', credentials: 'include' });
            if (refresh.ok) res = await fetch(url, options);
            else { localStorage.clear(); window.location.href = 'login.html'; throw new Error('Session expired'); }
        }
        return res;
    }

    // Load Transactions
    async function loadTransactions() {
        const loadingDiv = document.getElementById('loadingIndicator');
        const container = document.getElementById('transactionsList');
        const noDataDiv = document.getElementById('noDataMessage');
        loadingDiv.style.display = 'block';
        container.style.display = 'none';
        noDataDiv.classList.add('hidden');

        try {
            const [deposits, withdrawals, investments, referralsRes] = await Promise.all([
                fetchWithAuth(URL_DEPOSITS).then(r => r.ok ? r.json() : []),
                fetchWithAuth(URL_WITHDRAWALS).then(r => r.ok ? r.json() : []),
                fetchWithAuth(URL_INVESTMENTS).then(r => r.ok ? r.json() : []),
                fetchWithAuth(URL_REFERRALS).then(r => r.ok ? r.json() : { referrals: [] })
            ]);

            const referrals = referralsRes.referrals || [];
            let allTransactions = [];

            // إيداعات
            (deposits || []).forEach(d => {
                allTransactions.push({
                    id: d.id, type: 'deposit', amount: parseFloat(d.amount) || 0,
                    status: d.status || 'pending', date: new Date(d.date),
                    details: `الطريقة: ${d.method || 'USDT'} | الرمز: ${d.screenshotPath || '-'}`
                });
            });

            // سحوبات
            (withdrawals || []).forEach(w => {
                allTransactions.push({
                    id: w.id, type: 'withdrawal', amount: parseFloat(w.amount) || 0,
                    status: w.status || 'pending', date: new Date(w.date),
                    details: `${w.type === 'profit' ? 'أرباح' : 'أصل'} | محفظة: ${(w.walletAddress || '').substring(0,12)}...`
                });
            });

            // استثمارات
            (investments || []).forEach(inv => {
                let projectName = inv.projectType === 'metals' ? 'المعادن والعملات' : inv.projectType;
                allTransactions.push({
                    id: inv.id, type: 'investment', amount: parseFloat(inv.amount) || 0,
                    status: inv.withdrawnPrincipal ? 'completed' : 'active',
                    date: new Date(inv.startDate),
                    details: `مشروع ${projectName}`
                });
            });

            // إحالات
            (referrals || []).forEach(ref => {
                const reward = parseFloat(ref.reward) || 0;
                if (reward > 0) {
                    allTransactions.push({
                        id: `ref_${ref.username}`, type: 'referral', amount: reward,
                        status: 'completed', date: new Date(ref.registeredAt),
                        details: `مكافأة من ${ref.username}`
                    });
                }
            });

            // ترتيب
            allTransactions.sort((a, b) => b.date - a.date);

            // فلترة
            const activeFilter = document.querySelector('.filter-btn.active')?.dataset.filter || 'all';
            let filtered = allTransactions;
            if (activeFilter !== 'all') {
                filtered = allTransactions.filter(t => t.type === activeFilter);
            }

            if (filtered.length === 0) {
                noDataDiv.classList.remove('hidden');
            } else {
                renderTransactions(filtered);
                container.style.display = 'block';
            }
        } catch (err) {
            console.error(err);
            Swal.fire('خطأ', 'فشل تحميل المعاملات', 'error');
            noDataDiv.classList.remove('hidden');
        } finally {
            loadingDiv.style.display = 'none';
        }
    }

    function renderTransactions(transactions) {
        const container = document.getElementById('transactionsList');
        container.innerHTML = '';
        const t = translations[currentLang] || {};

        transactions.forEach(tx => {
            const amountNum = parseFloat(tx.amount) || 0;
            const typeClass = `type-${tx.type}`;
            let typeText = '';
            if (tx.type === 'deposit') typeText = 'إيداع';
            else if (tx.type === 'withdrawal') typeText = 'سحب';
            else if (tx.type === 'investment') typeText = 'استثمار';
            else typeText = 'إحالة';

            let statusText = '', statusClass = '';
            if (tx.status === 'approved') { statusText = 'موافق عليه'; statusClass = 'status-approved'; }
            else if (tx.status === 'pending') { statusText = 'معلق'; statusClass = 'status-pending'; }
            else if (tx.status === 'rejected') { statusText = 'مرفوض'; statusClass = 'status-rejected'; }
            else if (tx.status === 'active') { statusText = 'نشط'; statusClass = 'status-active'; }
            else if (tx.status === 'completed') { statusText = 'مكتمل'; statusClass = 'status-completed'; }
            else { statusText = tx.status; statusClass = ''; }

            const amountColor = (tx.type === 'deposit' || tx.type === 'referral') ? 'text-green-400' : (tx.type === 'withdrawal' ? 'text-yellow-400' : 'text-blue-400');
            const amountSign = (tx.type === 'withdrawal') ? '- ' : '+ ';
            const dateStr = tx.date.toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-US', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });

            const card = document.createElement('div');
            card.className = 'transaction-card';
            card.innerHTML = `
                <div class="flex flex-wrap justify-between items-start gap-2">
                    <div class="flex items-center gap-2">
                        <span class="type-badge ${typeClass}">${typeText}</span>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="text-left">
                        <span class="text-lg font-bold ${amountColor}">${amountSign}${amountNum.toFixed(2)} $</span>
                    </div>
                </div>
                <div class="flex justify-between items-center mt-2 text-xs text-slate-400">
                    <span>${dateStr}</span>
                    <span class="truncate max-w-[200px]">${esc(tx.details)}</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Filter action
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadTransactions();
        });
    });

    function logout() {
        Swal.fire({
            title: 'تسجيل الخروج', text: 'هل أنت متأكد؟',
            icon: 'question', showCancelButton: true,
            confirmButtonColor: '#ff3333', background: '#1a0000', color: '#fff'
        }).then(r => {
            if (r.isConfirmed) {
                fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                localStorage.clear();
                window.location.href = 'login.html';
            }
        });
    }

    function esc(s) { return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    // Init
    window.onload = async () => {
        await applyTranslations(currentLang);
        initSocket();
        try {
            const res = await fetchWithAuth(URL_ME);
            if (!res.ok) throw new Error();
            loadTransactions();
        } catch (e) { window.location.href = 'login.html'; }
    };
</script>
</body>
</html>
