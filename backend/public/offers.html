<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العروض - سلة</title>
    <style>
        :root {
            --red: #b22222;
            --red-light: #dc3545;
            --gold: #f4b400;
            --gold-light: #ffcc00;
            --bg-dark: #1c1c1c;
            --bg-card: rgba(30, 30, 30, 0.75);
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text: #f0f0f0;
            --text-muted: #bbbbbb;
            --border: #444;
            --radius: 20px;
            --transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 30% 20%, #3a1010, #0f0505);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* شريط التنقل */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(244, 180, 0, 0.4);
            padding: 0 25px;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--gold);
            font-size: 2rem;
            font-weight: 800;
        }

        .logo .basket-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px var(--gold));
            transition: transform 0.3s;
        }

        .logo:hover .basket-icon {
            transform: rotate(-5deg) scale(1.1);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 30px;
            transition: var(--transition);
        }

        .nav-links a:hover {
            background: rgba(244,180,0,0.15);
            color: var(--gold);
        }

        .btn-login {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid var(--red);
            color: var(--red-light);
            padding: 8px 22px;
            border-radius: 30px;
            font-weight: bold;
        }

        .btn-login:hover {
            background: var(--red);
            color: white;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--gold);
            font-size: 2rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                right: 0;
                background: rgba(20, 0, 0, 0.95);
                backdrop-filter: blur(20px);
                border-bottom: 2px solid var(--gold);
                padding: 25px;
                gap: 18px;
                border-radius: 0 0 20px 20px;
            }
            .nav-links.show {
                display: flex;
            }
            .menu-toggle {
                display: block;
            }
        }

        /* المحتوى الرئيسي */
        .main-container {
            flex: 1;
            padding: 35px 25px;
            max-width: 1350px;
            margin: 0 auto;
            width: 100%;
        }

        .page-title {
            font-size: 2.4rem;
            color: var(--gold-light);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-desc {
            color: var(--text-muted);
            margin-bottom: 35px;
            font-size: 1.1rem;
        }

        /* شبكة العروض */
        .offers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 28px;
            margin-bottom: 40px;
        }

        .offer-card {
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--glass-border);
            transition: var(--transition);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .offer-card:hover {
            transform: translateY(-6px);
            border-color: var(--gold);
            box-shadow: 0 18px 35px rgba(244,180,0,0.2);
        }

        .offer-card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            background: #111;
        }

        .offer-card .card-body {
            padding: 22px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .badge {
            background: var(--red);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 5px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
            width: fit-content;
            letter-spacing: 0.5px;
        }

        .offer-card h3 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: var(--text);
        }

        .offer-card .store {
            color: var(--gold-light);
            font-size: 0.95rem;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .offer-card .description {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 18px;
            flex: 1;
            line-height: 1.5;
        }

        .offer-card .price {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 15px;
        }

        .btn-details {
            display: block;
            text-align: center;
            padding: 12px;
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid var(--red-light);
            color: white;
            border-radius: 30px;
            font-weight: 700;
            transition: var(--transition);
            margin-top: auto;
            backdrop-filter: blur(5px);
        }

        .offer-card:hover .btn-details {
            background: var(--red);
            border-color: var(--red);
        }

        /* بطاقة الإعلان العام */
        .banner-card {
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--glass-border);
            transition: var(--transition);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .banner-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
        }

        .banner-card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            background: #111;
        }

        .banner-card .card-body {
            padding: 22px;
        }

        .banner-card h3 {
            color: var(--text);
            margin-bottom: 8px;
            font-size: 1.3rem;
        }

        .banner-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.3rem;
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: auto;
        }
    </style>
</head>
<body>
    <!-- شريط التنقل -->
    <nav class="navbar">
        <a href="dashboard.html" class="logo">
            <span class="basket-icon">🧺</span>
            <span>سلة</span>
        </a>
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="dashboard.html">الرئيسية</a>
            <a href="offers.html">العروض</a>
            <a href="login.html" class="btn-login">تسجيل الدخول</a>
        </div>
    </nav>

    <div class="main-container">
        <h1 class="page-title">⭐ العروض المميزة</h1>
        <p class="page-desc">منتجات وعروض مختارة بعناية من الإدارة</p>

        <!-- شبكة العروض -->
        <div class="offers-grid" id="offersGrid">
            <!-- تُملأ ديناميكياً -->
        </div>
    </div>

    <footer>© 2025 سلة - جميع الحقوق محفوظة</footer>

    <script>
        // قائمة الجوال
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('navLinks').classList.toggle('show');
        });

        async function loadOffers() {
            const urlParams = new URLSearchParams(window.location.search);
            const searchQuery = urlParams.get('search') || '';
            const grid = document.getElementById('offersGrid');

            try {
                if (searchQuery) {
                    // عرض نتائج البحث
                    const res = await fetch(`/api/search?keyword=${encodeURIComponent(searchQuery)}`);
                    const products = await res.json();
                    if (products.length === 0) {
                        grid.innerHTML = '<div class="empty-message">🔍 لا توجد نتائج للبحث</div>';
                        return;
                    }
                    grid.innerHTML = products.map(p => `
                        <a href="product-details.html?id=${p.id}" class="offer-card">
                            <img src="${p.image || 'https://via.placeholder.com/400x300/1c1c1c/f4b400?text=🧺+سلة'}" alt="${p.name}">
                            <div class="card-body">
                                <h3>${p.name}</h3>
                                <p class="store">${p.store_name || '—'}</p>
                                <p class="price">${p.price}$</p>
                                <span class="btn-details">عرض التفاصيل</span>
                            </div>
                        </a>
                    `).join('');
                    return;
                }

                // عرض العروض المميزة (منتجات + إعلانات)
                const res = await fetch('/api/featured');
                const data = await res.json();
                const products = data.products || [];
                const banners = data.banners || [];

                if (products.length === 0 && banners.length === 0) {
                    grid.innerHTML = '<div class="empty-message">لا توجد عروض مميزة حالياً</div>';
                    return;
                }

                let html = '';

                // المنتجات المميزة
                products.forEach(p => {
                    html += `
                    <a href="product-details.html?id=${p.id}" class="offer-card">
                        <img src="${p.image || 'https://via.placeholder.com/400x300/1c1c1c/f4b400?text=🧺+سلة'}" alt="${p.name}">
                        <div class="card-body">
                            <span class="badge">🔥 مميز</span>
                            <h3>${p.name}</h3>
                            <p class="store">${p.store_name || ''}</p>
                            ${p.description ? `<p class="description">${p.description.substring(0, 80)}...</p>` : ''}
                            <p class="price">${p.price}$</p>
                            <span class="btn-details">عرض التفاصيل</span>
                        </div>
                    </a>`;
                });

                // الإعلانات العامة
                banners.forEach(b => {
                    html += `
                    <div class="banner-card">
                        ${b.image ? `<img src="${b.image}" alt="${b.title}">` : ''}
                        <div class="card-body">
                            <h3>${b.title}</h3>
                            ${b.description ? `<p>${b.description}</p>` : ''}
                        </div>
                    </div>`;
                });

                grid.innerHTML = html;

            } catch (err) {
                console.error('خطأ في تحميل العروض:', err);
                grid.innerHTML = '<div class="empty-message">⚠️ تعذر تحميل العروض حالياً</div>';
            }
        }

        loadOffers();
    </script>
</body>
</html>
