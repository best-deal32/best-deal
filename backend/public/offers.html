<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العروض - سلة</title>
    <style>
        :root {
            --primary-red: #b22222;
            --primary-light-red: #dc3545;
            --primary-yellow: #f4b400;
            --primary-light-yellow: #ffcc00;
            --bg-dark: #1c1c1c;
            --bg-card: #262626;
            --text: #f5f5f5;
            --text-muted: #bbbbbb;
            --border: #404040;
            --radius: 16px;
            --input-bg: #333;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #2d1a1a 0%, #0f0a0a 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* شريط علوي */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--primary-yellow);
            padding: 0 20px;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--primary-yellow);
            font-size: 2rem;
            font-weight: 800;
        }
        .logo .basket-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 8px var(--primary-yellow));
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 30px;
            transition: 0.3s;
        }
        .nav-links a:hover { background: rgba(244,180,0,0.1); color: var(--primary-yellow); }
        .btn-login {
            background: transparent;
            border: 2px solid var(--primary-yellow);
            color: var(--primary-yellow);
            padding: 8px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-login:hover { background: var(--primary-yellow); color: #000; }
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--primary-yellow);
            font-size: 2rem;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px; left:0; right:0;
                background: #1a1a1a;
                border-bottom: 2px solid var(--primary-yellow);
                padding: 20px; gap: 15px;
            }
            .nav-links.show { display:flex; }
            .menu-toggle { display: block; }
        }

        .main-container {
            flex: 1;
            padding: 30px 20px;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }
        .page-title {
            color: var(--primary-yellow);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .page-desc {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        /* شبكة العروض */
        .offers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        .offer-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .offer-card:hover {
            border-color: var(--primary-yellow);
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(244,180,0,0.2);
        }
        .offer-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #111;
        }
        .offer-card .card-body {
            padding: 20px;
            flex:1;
            display: flex;
            flex-direction: column;
        }
        .badge {
            background: var(--primary-red);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
            width: fit-content;
        }
        .offer-card h3 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: var(--text);
        }
        .offer-card .store {
            color: var(--primary-yellow);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .offer-card .description {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            flex:1;
        }
        .offer-card .price {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-yellow);
            margin-bottom: 10px;
        }
        .offer-card .btn-details {
            display: block;
            text-align: center;
            padding: 10px;
            background: var(--primary-red);
            color: white;
            border-radius: 30px;
            font-weight: 700;
            transition: 0.3s;
            margin-top: auto;
        }
        .offer-card:hover .btn-details {
            background: var(--primary-light-red);
        }

        .banner-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
        }
        .banner-card:hover {
            border-color: var(--primary-yellow);
            transform: translateY(-5px);
        }
        .banner-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #111;
        }
        .banner-card .card-body {
            padding: 20px;
        }
        .banner-card h3 { color: var(--text); margin-bottom: 5px; }
        .banner-card p { color: var(--text-muted); }

        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-size: 1.2rem;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: auto;
        }
    </style>
</head>
<body>
    <!-- الشريط العلوي -->
    <nav class="navbar">
        <a href="dashboard.html" class="logo">
            <span class="basket-icon">🧺</span>
            <span>سلة</span>
        </a>
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="dashboard.html">الرئيسية</a>
            <a href="offers.html">العروض</a>
            <a href="login.html" class="btn-login">تسجيل الدخول</a>
        </div>
    </nav>

    <div class="main-container">
        <h1 class="page-title">⭐ العروض المميزة</h1>
        <p class="page-desc">منتجات وعروض مختارة بعناية من الإدارة</p>

        <!-- شبكة العروض -->
        <div class="offers-grid" id="offersGrid">
            <!-- تُملأ ديناميكياً -->
        </div>
    </div>

    <footer>© 2025 سلة - جميع الحقوق محفوظة</footer>

    <script>
        // زر القائمة للجوال
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('navLinks').classList.toggle('show');
        });

        async function loadOffers() {
            const urlParams = new URLSearchParams(window.location.search);
            const searchQuery = urlParams.get('search') || '';
            const grid = document.getElementById('offersGrid');

            try {
                if (searchQuery) {
                    // عرض نتائج البحث
                    const res = await fetch(`/api/search?keyword=${encodeURIComponent(searchQuery)}`);
                    const products = await res.json();
                    if (products.length === 0) {
                        grid.innerHTML = '<div class="empty-message">لا توجد نتائج للبحث</div>';
                        return;
                    }
                    grid.innerHTML = products.map(p => `
                        <a href="product-details.html?id=${p.id}" class="offer-card">
                            <img src="${p.image || 'https://via.placeholder.com/400x300/1c1c1c/f4b400?text=🧺+سلة'}" alt="${p.name}">
                            <div class="card-body">
                                <h3>${p.name}</h3>
                                <p class="store">${p.store_name || '—'}</p>
                                <p class="price">${p.price}$</p>
                                <span class="btn-details">عرض التفاصيل</span>
                            </div>
                        </a>
                    `).join('');
                    return;
                }

                // عرض العروض المميزة (منتجات + إعلانات)
                const res = await fetch('/api/featured');
                const data = await res.json();
                const products = data.products || [];
                const banners = data.banners || [];

                if (products.length === 0 && banners.length === 0) {
                    grid.innerHTML = '<div class="empty-message">لا توجد عروض مميزة حالياً</div>';
                    return;
                }

                let html = '';

                // المنتجات المميزة
                products.forEach(p => {
                    html += `
                    <a href="product-details.html?id=${p.id}" class="offer-card">
                        <img src="${p.image || 'https://via.placeholder.com/400x300/1c1c1a/f4b400?text=🧺+سلة'}" alt="${p.name}">
                        <div class="card-body">
                            <span class="badge">مميز</span>
                            <h3>${p.name}</h3>
                            <p class="store">${p.store_name || ''}</p>
                            <p class="price">${p.price}$</p>
                            <span class="btn-details">عرض التفاصيل</span>
                        </div>
                    </a>`;
                });

                // الإعلانات العامة (بدون رابط)
                banners.forEach(b => {
                    html += `
                    <div class="banner-card">
                        ${b.image ? `<img src="${b.image}" alt="${b.title}">` : ''}
                        <div class="card-body">
                            <h3>${b.title}</h3>
                            ${b.description ? `<p>${b.description}</p>` : ''}
                        </div>
                    </div>`;
                });

                grid.innerHTML = html;

            } catch (err) {
                console.error('خطأ في تحميل العروض:', err);
                grid.innerHTML = '<div class="empty-message">تعذر تحميل العروض حالياً</div>';
            }
        }

        loadOffers();
    </script>
</body>
</html>
