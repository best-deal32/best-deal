<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fargo | استثمار المعادن والعملات الرقمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(ellipse at top, #022c43 0%, #021a2b 70%);
            color: #e6f7ff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* أشكال ديكورية متحركة */
        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            animation: float 20s infinite ease-in-out;
        }
        .shape1 { width: 500px; height: 500px; background: #45b3e0; top: -200px; left: -150px; }
        .shape2 { width: 400px; height: 400px; background: #2e86ab; bottom: -150px; right: -100px; animation-delay: -10s; }
        .shape3 { width: 300px; height: 300px; background: #1e6b8a; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -5s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .glass-panel {
            background: rgba(4, 40, 70, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(69, 179, 224, 0.3);
            border-radius: 3rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .btn-sky {
            background: linear-gradient(135deg, #1e6b8a, #2e86ab);
            color: #fff;
            font-weight: 800;
            border-radius: 1.5rem;
            padding: 0.9rem 2.5rem;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 10px 25px rgba(46, 134, 171, 0.4);
        }
        .btn-sky:hover {
            background: linear-gradient(135deg, #1a5670, #2e86ab);
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(69, 179, 224, 0.5);
        }

        .btn-outline-sky {
            background: transparent;
            border: 2px solid #45b3e0;
            color: #45b3e0;
            font-weight: 800;
            border-radius: 1.5rem;
            padding: 0.9rem 2.5rem;
            transition: 0.3s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-outline-sky:hover {
            background: rgba(69, 179, 224, 0.1);
            color: #fff;
        }

        .invest-card {
            background: rgba(4, 40, 70, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(69, 179, 224, 0.4);
            border-radius: 2rem;
            transition: transform 0.3s;
        }
        .invest-card:hover {
            transform: translateY(-5px);
            border-color: #45b3e0;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .lang-selector {
            background: rgba(4,40,70,0.7);
            border-radius: 3rem;
            padding: 0.25rem;
            display: inline-flex;
            gap: 0.2rem;
            border: 1px solid rgba(69,179,224,0.3);
        }
        .lang-option {
            padding: 0.3rem 0.8rem;
            border-radius: 3rem;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            color: #b0d4e8;
            transition: 0.2s;
        }
        .lang-option.active {
            background: linear-gradient(135deg, #1e6b8a, #2e86ab);
            color: #fff;
        }
    </style>
</head>
<body>
    <!-- أشكال الخلفية -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>
    <div class="bg-shape shape3"></div>

    <div class="content flex flex-col min-h-screen">
        <!-- شريط التنقل -->
        <nav class="px-5 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-shield-halved text-4xl text-sky-400 drop-shadow-lg"></i>
                <span class="text-2xl font-black text-white italic tracking-wider">FARGO</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="lang-selector">
                    <div class="lang-option active" data-lang="ar">AR</div>
                    <div class="lang-option" data-lang="en">EN</div>
                </div>
            </div>
        </nav>

        <!-- المحتوى الرئيسي -->
        <main class="flex-grow flex flex-col items-center justify-center px-6 py-8">
            <div class="text-center max-w-2xl mx-auto mb-12">
                <i class="fa-solid fa-shield-halved text-8xl text-sky-300/30 mb-4 block"></i>
                <h1 class="text-5xl md:text-6xl font-black mb-4 leading-tight">
                    استثمر في <span class="text-sky-300">المعادن والعملات الرقمية</span>
                </h1>
                <p class="text-xl text-slate-300 mb-8">عائد <strong class="text-sky-200">3% يوميًا</strong> – ببساطة وأمان</p>
                
                <!-- أزرار الدخول -->
                <div class="flex flex-wrap justify-center gap-4">
                    <button onclick="location.href='login.html'" class="btn-sky text-lg">
                        <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول
                    </button>
                    <button onclick="location.href='register.html'" class="btn-outline-sky text-lg">
                        <i class="fa-solid fa-user-plus"></i> إنشاء حساب
                    </button>
                </div>
            </div>

            <!-- بطاقة الاستثمار البارزة -->
            <div class="invest-card p-8 max-w-md w-full text-center animate-pulse-slow">
                <i class="fa-solid fa-coins text-6xl text-sky-400 mb-4"></i>
                <h2 class="text-2xl font-black text-white mb-3">المعادن والعملات الرقمية</h2>
                <div class="text-5xl font-black text-sky-300 mb-2">3%</div>
                <p class="text-lg text-slate-300">عائد يومي</p>
                <div class="flex justify-center gap-4 mt-6 text-sm text-slate-400">
                    <span>الحد الأدنى <strong class="text-white">50$</strong></span>
                    <span>•</span>
                    <span>الحد الأقصى <strong class="text-white">10,000$</strong></span>
                </div>
                <p class="text-xs text-slate-500 mt-4">سحب أرباح يومي – استرداد رأس المال anytime</p>
            </div>
        </main>

        <!-- تذييل بسيط بدون سنة أو حقوق -->
        <footer class="text-center py-6"></footer>
    </div>

    <script>
        // تبديل اللغة
        document.querySelectorAll('.lang-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.lang-option').forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                document.documentElement.dir = opt.dataset.lang === 'ar' ? 'rtl' : 'ltr';
                document.documentElement.lang = opt.dataset.lang;
            });
        });
    </script>
</body>
</html>
