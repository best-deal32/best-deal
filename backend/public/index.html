<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة - السوق الرقمي</title>
    <style>
        :root {
            --primary-red: #b22222;
            --primary-light-red: #dc3545;
            --primary-yellow: #f4b400;
            --primary-light-yellow: #ffcc00;
            --bg-dark: #1c1c1c;
            --text: #f5f5f5;
            --text-muted: #bbbbbb;
            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top, #2d1a1a 0%, #0f0a0a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }

        /* البطاقة الزجاجية */
        .welcome-card {
            background: rgba(38, 38, 38, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--primary-yellow);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(244, 180, 0, 0.2);
            max-width: 550px;
            width: 100%;
            padding: 50px 30px;
            text-align: center;
        }

        .basket-logo {
            font-size: 5rem;
            filter: drop-shadow(0 0 15px var(--primary-yellow));
            margin-bottom: 10px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary-yellow);
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .welcome-message {
            margin-bottom: 40px;
        }

        .welcome-message p.main {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .welcome-message p.sub {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        /* الأزرار */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
        }

        @media (min-width: 480px) {
            .actions {
                flex-direction: row;
                justify-content: center;
                flex-wrap: wrap;
            }
        }

        .btn {
            display: inline-block;
            padding: 14px 38px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-family: inherit;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--primary-red);
            color: white;
            box-shadow: 0 6px 20px rgba(220, 53, 69, 0.5);
        }

        .btn-primary:hover {
            background-color: var(--primary-light-red);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(220, 53, 69, 0.6);
        }

        .btn-outline {
            border: 2px solid var(--primary-yellow);
            background: transparent;
            color: var(--primary-yellow);
        }

        .btn-outline:hover {
            background: rgba(244, 180, 0, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(244, 180, 0, 0.3);
        }

        .btn-ghost {
            border: 1px solid rgba(244, 180, 0, 0.4);
            color: var(--text-muted);
            font-weight: 500;
        }

        .btn-ghost:hover {
            background: rgba(244, 180, 0, 0.1);
            color: var(--primary-yellow);
            transform: translateY(-3px);
        }

        /* تذييل */
        footer {
            margin-top: 35px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <!-- شعار السلة -->
        <div class="basket-logo">🧺</div>
        <h1>سلة</h1>

        <div class="welcome-message">
            <p class="main">مرحباً بك في سوقك الرقمي</p>
            <p class="sub">اعرض ألبستك ومنتجاتك، واكتشف عروض المتاجر الأخرى</p>
            <p class="sub">انضم إلينا اليوم أو تصفح كزائر</p>
        </div>

        <div class="actions">
            <a href="login.html" class="btn btn-primary">تسجيل الدخول</a>
            <a href="register.html" class="btn btn-outline">إنشاء حساب</a>
            <a href="dashboard.html" class="btn btn-ghost">دخول كزائر</a>
        </div>
    </div>

    <footer>
        <p>© 2025 سلة - جميع الحقوق محفوظة</p>
    </footer>
</body>
</html>
