<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketHub - الرئيسية</title>
    <style>
        /* نفس تصميم index السابق بالضبط */
        :root {
            --green-dark: #059669;
            --green-light: #6ee7b7;
            --blue-dark: #1e40af;
            --blue-light: #93c5fd;
            --white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--green-dark) 0%, var(--blue-dark) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; color: var(--white);
        }
        .welcome-card {
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(15px);
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 550px; width: 100%; padding: 50px 30px; text-align: center;
        }
        h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 25px; }
        h1 .emerald-text { color: var(--green-light); }
        h1 .blue-text { color: var(--blue-light); }
        .welcome-message { margin-bottom: 45px; }
        .welcome-message p.main { font-size: 1.6rem; font-weight: 600; margin-bottom: 8px; }
        .welcome-message p.sub { font-size: 1.1rem; color: rgba(255,255,255,0.75); margin-bottom: 6px; }
        .actions { display: flex; flex-direction: column; gap: 18px; align-items: center; }
        @media (min-width: 480px) { .actions { flex-direction: row; justify-content: center; } }
        .btn {
            display: inline-block; padding: 14px 38px; font-size: 1.1rem; font-weight: 600;
            border-radius: 50px; text-decoration: none; transition: all 0.3s ease;
            cursor: pointer; border: none; background: none; color: var(--white);
            font-family: inherit; white-space: nowrap;
        }
        .btn-primary { background-color: var(--white); color: var(--green-dark); box-shadow: 0 6px 18px rgba(0,0,0,0.15); }
        .btn-primary:hover { background-color: #ecfdf5; transform: translateY(-3px); }
        .btn-outline { border: 2px solid var(--white); background: transparent; }
        .btn-outline:hover { background: rgba(255,255,255,0.15); transform: translateY(-3px); }
        .btn-ghost { border: 1px solid rgba(255,255,255,0.5); color: rgba(255,255,255,0.9); font-weight: 500; }
        .btn-ghost:hover { background: rgba(255,255,255,0.1); color: var(--white); transform: translateY(-3px); }
        footer { margin-top: 35px; color: rgba(255,255,255,0.45); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="welcome-card">
        <h1><span class="emerald-text">Market</span><span class="blue-text">Hub</span></h1>
        <div class="welcome-message">
            <p class="main">مرحباً بك في منصتنا المتكاملة</p>
            <p class="sub">سوقك الرقمي لعرض وبيع منتجاتك بكل سهولة</p>
            <p class="sub">انضم إلينا اليوم أو تصفح كزائر</p>
        </div>
        <div class="actions">
            <a href="login.html" class="btn btn-primary">تسجيل الدخول</a>
            <a href="register.html" class="btn btn-outline">إنشاء حساب</a>
            <a href="dashboard.html" class="btn btn-ghost">دخول كزائر</a>
        </div>
    </div>
    <footer><p>© 2025 MarketHub. جميع الحقوق محفوظة.</p></footer>
</body>
</html>
