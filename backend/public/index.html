<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة - السوق الرقمي</title>
    <style>
        :root {
            --red: #b22222;
            --red-light: #dc3545;
            --gold: #f4b400;
            --gold-light: #ffcc00;
            --bg-dark: #0f0505;
            --text: #f0f0f0;
            --text-muted: #bbbbbb;
            --glass-bg: rgba(20, 20, 20, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at 30% 10%, #4a1515, #0a0202);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
            overflow-x: hidden;
        }

        /* تأثيرات خلفية متحركة */
        .bg-decoration {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            z-index: -1;
            animation: float 12s infinite alternate ease-in-out;
        }

        .bg-decoration.red {
            width: 400px;
            height: 400px;
            background: var(--red);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .bg-decoration.gold {
            width: 350px;
            height: 350px;
            background: var(--gold);
            bottom: -120px;
            left: -80px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.1); }
            100% { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* البطاقة الرئيسية */
        .welcome-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 0 40px rgba(244, 180, 0, 0.15);
            max-width: 560px;
            width: 100%;
            padding: 55px 35px;
            text-align: center;
            position: relative;
            z-index: 2;
            transition: transform 0.4s;
        }

        .welcome-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 70px rgba(0,0,0,0.8), 0 0 60px rgba(244,180,0,0.25);
        }

        /* الشعار */
        .basket-logo {
            font-size: 5.5rem;
            filter: drop-shadow(0 0 20px var(--gold));
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            font-size: 3.8rem;
            font-weight: 900;
            color: var(--gold-light);
            margin-bottom: 20px;
            letter-spacing: -2px;
            text-shadow: 0 4px 15px rgba(244,180,0,0.4);
        }

        .welcome-message {
            margin-bottom: 45px;
        }

        .welcome-message p.main {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
        }

        .welcome-message p.sub {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            line-height: 1.6;
        }

        /* الأزرار */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        @media (min-width: 500px) {
            .actions {
                flex-direction: row;
                justify-content: center;
                flex-wrap: wrap;
            }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 36px;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            font-family: inherit;
            white-space: nowrap;
            backdrop-filter: blur(10px);
            min-width: 180px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.1);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn-primary {
            background: rgba(220, 53, 69, 0.25);
            border: 1px solid var(--red-light);
            color: white;
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.35);
        }

        .btn-primary:hover {
            background: var(--red);
            border-color: var(--red);
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(220, 53, 69, 0.5);
        }

        .btn-outline {
            border: 2px solid var(--gold);
            background: rgba(244, 180, 0, 0.08);
            color: var(--gold-light);
        }

        .btn-outline:hover {
            background: rgba(244, 180, 0, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(244, 180, 0, 0.3);
        }

        .btn-ghost {
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-weight: 500;
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: var(--gold);
            transform: translateY(-3px);
        }

        /* التذييل */
        footer {
            margin-top: 40px;
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
            z-index: 2;
        }
    </style>
</head>
<body>
    <!-- تأثيرات الخلفية -->
    <div class="bg-decoration red"></div>
    <div class="bg-decoration gold"></div>

    <!-- البطاقة الترحيبية -->
    <div class="welcome-card">
        <div class="basket-logo">🧺</div>
        <h1>سلة</h1>
        <div class="welcome-message">
            <p class="main">وجهتك الأولى للتسوق الرقمي</p>
            <p class="sub">اعرض ألبستك ومنتجاتك، واكتشف عروض المتاجر الأخرى</p>
            <p class="sub">انضم إلى مجتمع التجار اليوم أو تصفح كزائر</p>
        </div>
        <div class="actions">
            <a href="login.html" class="btn btn-primary">🔐 تسجيل الدخول</a>
            <a href="register.html" class="btn btn-outline">✨ إنشاء حساب</a>
            <a href="dashboard.html" class="btn btn-ghost">👀 دخول كزائر</a>
        </div>
    </div>
    <footer>© 2025 سلة - جميع الحقوق محفوظة</footer>
</body>
</html>
