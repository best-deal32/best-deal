<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من الحساب - MarketHub</title>
    <style>
        /* نفس التصميم السابق مع إضافات */
        :root {
            --green-dark: #059669; --green-light: #6ee7b7;
            --blue-dark: #1e40af; --blue-light: #93c5fd;
            --white: #ffffff; --text-light: #f0fdf4;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--green-dark) 0%, var(--blue-dark) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; color: var(--white);
        }
        .verify-card {
            background: rgba(255,255,255,0.12); backdrop-filter: blur(15px);
            border-radius: 30px; border: 1px solid rgba(255,255,255,0.25);
            max-width: 480px; width: 100%; padding: 40px 30px; text-align: center;
        }
        h1 { font-size: 2.2rem; margin-bottom: 10px; }
        h1 .emerald-text { color: var(--green-light); } h1 .blue-text { color: var(--blue-light); }
        .method-box {
            background: rgba(255,255,255,0.08); border-radius: 15px; padding: 20px; margin: 20px 0;
        }
        .code-inputs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; direction: ltr; }
        .code-inputs input {
            width: 45px; height: 55px; text-align: center; font-size: 1.8rem; font-weight: bold;
            border: 1px solid rgba(255,255,255,0.35); border-radius: 12px;
            background: rgba(255,255,255,0.1); color: var(--white); outline: none;
        }
        .btn { width: 100%; padding: 14px; font-weight: 700; border-radius: 50px; cursor: pointer; transition:0.3s; }
        .btn-primary { background: white; color: var(--green-dark); border: none; }
        .btn-telegram { background: #2AABEE; color: white; border: none; display: inline-block; width: auto; padding: 12px 25px; text-decoration: none; }
        .error-message { color: #fca5a5; display: none; }
        .success-message { color: var(--green-light); display: none; }
        .back-link { margin-top: 20px; color: var(--green-light); text-decoration: none; }
    </style>
</head>
<body>
    <div class="verify-card">
        <h1><span class="emerald-text">Market</span><span class="blue-text">Hub</span></h1>
        <p id="mainMsg">التحقق من الحساب</p>

        <div id="emailSection" class="method-box" style="display:none;">
            <p>تم إرسال رمز إلى بريدك الإلكتروني</p>
            <div class="code-inputs" id="codeInputs">
                <input type="text" maxlength="1" inputmode="numeric" data-index="0">
                <input type="text" maxlength="1" inputmode="numeric" data-index="1">
                <input type="text" maxlength="1" inputmode="numeric" data-index="2">
                <input type="text" maxlength="1" inputmode="numeric" data-index="3">
                <input type="text" maxlength="1" inputmode="numeric" data-index="4">
                <input type="text" maxlength="1" inputmode="numeric" data-index="5">
            </div>
            <button class="btn btn-primary" id="verifyEmailBtn">تحقق</button>
            <p style="margin-top:10px;"><a id="resendEmailLink" href="#">إعادة إرسال</a></p>
        </div>

        <div id="telegramSection" class="method-box" style="display:none;">
            <p>للتحقق عبر تيليجرام، اضغط على الزر أدناه وافتح البوت ثم أرسل <code>/start</code> مع الرمز.</p>
            <a id="telegramDeepLink" class="btn btn-telegram" href="#" target="_blank">فتح تيليجرام</a>
        </div>

        <div id="serverError" class="error-message"></div>
        <div id="serverSuccess" class="success-message"></div>
        <a href="register.html" class="back-link">← العودة للتسجيل</a>
    </div>

    <script>
        const email = sessionStorage.getItem('verifyEmail') || '';
        const phone = sessionStorage.getItem('verifyPhone') || '';
        const telegramLink = sessionStorage.getItem('telegramLink') || '';

        // إظهار الأقسام المناسبة
        if (email) {
            document.getElementById('emailSection').style.display = 'block';
        }
        if (phone && telegramLink) {
            document.getElementById('telegramSection').style.display = 'block';
            document.getElementById('telegramDeepLink').href = telegramLink;
        }
        if (!email && !phone) {
            window.location.href = 'register.html';
        }

        // ---------- البريد ----------
        const codeInputs = document.querySelectorAll('#codeInputs input');
        codeInputs.forEach((input, idx) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && idx < 5) codeInputs[idx+1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && idx > 0) codeInputs[idx-1].focus();
            });
        });

        function getCode() {
            let code = '';
            codeInputs.forEach(i => code += i.value);
            return code;
        }

        document.getElementById('verifyEmailBtn').addEventListener('click', async () => {
            const code = getCode();
            if (code.length !== 6) {
                document.getElementById('serverError').textContent = 'أدخل 6 أرقام';
                document.getElementById('serverError').style.display = 'block';
                return;
            }
            const res = await fetch('/api/auth/verify-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code })
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('serverSuccess').textContent = 'تم التحقق!';
                document.getElementById('serverSuccess').style.display = 'block';
                setTimeout(() => window.location.href = 'login.html', 1500);
            } else {
                document.getElementById('serverError').textContent = data.message;
                document.getElementById('serverError').style.display = 'block';
            }
        });

        document.getElementById('resendEmailLink').addEventListener('click', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/auth/resend-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            document.getElementById('serverError').style.display = 'block';
            document.getElementById('serverError').textContent = data.message || 'تم الإرسال';
        });
    </script>
</body>
</html>
