<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توثيق الحساب - سلة</title>
    <style>
        :root {
            --bg-dark: #0d0d0d;
            --bg-card: #1a1a1a;
            --gold: #d4af37;
            --gold-light: #f1c40f;
            --text: #e0e0e0;
            --text-muted: #aaaaaa;
            --border: #333;
            --input-bg: #222;
            --radius: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }
        .verify-card {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--gold);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(212, 175, 55, 0.15);
            max-width: 480px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }
        .basket-logo {
            font-size: 3.5rem;
            filter: drop-shadow(0 0 10px var(--gold-light));
            margin-bottom: 10px;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 10px;
        }
        .telegram-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            margin: 25px 0;
        }
        .telegram-box p {
            color: var(--text);
            margin-bottom: 15px;
            font-size: 1rem;
        }
        .btn-telegram {
            display: inline-block;
            background: #2AABEE;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(42,171,238,0.4);
        }
        .btn-telegram:hover { background: #1e8bc3; }
        .back-link {
            color: var(--gold);
            text-decoration: none;
            margin-top: 20px;
            display: inline-block;
            font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }
        .no-telegram {
            color: var(--text-muted);
            display: none;
        }
    </style>
</head>
<body>
    <div class="verify-card">
        <div class="basket-logo">🧺</div>
        <h1>توثيق الحساب</h1>

        <div class="telegram-box" id="telegramSection">
            <p>📱 للتحقق من حسابك عبر تيليجرام:</p>
            <p>1. اضغط على الزر أدناه لفتح البوت.</p>
            <p>2. سيتم إرسال رمز التحقق تلقائياً.</p>
            <a id="telegramLink" class="btn-telegram" href="#">فتح تيليجرام للتحقق</a>
            <p style="margin-top:15px; font-size:0.9rem; color:var(--text-muted);">بعد التحقق، عد إلى صفحة تسجيل الدخول.</p>
        </div>

        <div class="no-telegram" id="noTelegram">
            <p>لم يتم توفير رابط تيليجرام. يرجى التسجيل أولاً.</p>
        </div>

        <a href="login.html" class="back-link">← العودة لتسجيل الدخول</a>
    </div>

    <script>
        const tgLink = sessionStorage.getItem('telegramLink') || '';
        const tgSection = document.getElementById('telegramSection');
        const noTg = document.getElementById('noTelegram');
        const linkEl = document.getElementById('telegramLink');

        if (tgLink) {
            linkEl.href = tgLink;
            tgSection.style.display = 'block';
            noTg.style.display = 'none';
        } else {
            tgSection.style.display = 'none';
            noTg.style.display = 'block';
        }
    </script>
</body>
</html>
