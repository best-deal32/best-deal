<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توثيق الحساب - سلة</title>
    <style>
        :root {
            --red: #b22222;
            --red-light: #dc3545;
            --gold: #f4b400;
            --gold-light: #ffcc00;
            --bg-dark: #0f0505;
            --text: #f0f0f0;
            --text-muted: #bbbbbb;
            --glass-bg: rgba(25, 25, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.15);
            --transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at 30% 10%, #4a1515, #0a0202);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
            overflow-x: hidden;
        }

        /* تأثيرات خلفية متحركة */
        .bg-decoration {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            z-index: -1;
            animation: float 12s infinite alternate ease-in-out;
        }

        .bg-decoration.red {
            width: 400px;
            height: 400px;
            background: var(--red);
            top: -100px;
            left: -100px;
        }

        .bg-decoration.gold {
            width: 350px;
            height: 350px;
            background: var(--gold);
            bottom: -120px;
            right: -80px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.1); }
            100% { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* بطاقة التحقق */
        .verify-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 0 40px rgba(244, 180, 0, 0.15);
            max-width: 480px;
            width: 100%;
            padding: 45px 35px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .basket-logo {
            font-size: 4.5rem;
            filter: drop-shadow(0 0 15px var(--gold));
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--gold-light);
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        /* صندوق تيليجرام */
        .telegram-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            margin: 25px 0;
            backdrop-filter: blur(10px);
        }

        .telegram-box p {
            color: var(--text);
            margin-bottom: 12px;
            font-size: 1rem;
            line-height: 1.6;
        }

        .btn-telegram {
            display: inline-block;
            background: #2AABEE;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(42,171,238,0.4);
            border: none;
            cursor: pointer;
            margin: 10px 0;
        }

        .btn-telegram:hover {
            background: #1e8bc3;
            transform: translateY(-2px);
        }

        .no-telegram {
            color: var(--text-muted);
            display: none;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 14px;
        }

        .back-link {
            color: var(--gold-light);
            text-decoration: none;
            margin-top: 20px;
            display: inline-block;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: white;
            text-decoration: underline;
        }

        .error-message {
            color: #fca5a5;
            background: rgba(220,53,69,0.15);
            border: 1px solid var(--red);
            padding: 10px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- تأثيرات الخلفية -->
    <div class="bg-decoration red"></div>
    <div class="bg-decoration gold"></div>

    <div class="verify-card">
        <span class="basket-logo">🧺</span>
        <h1>توثيق الحساب</h1>

        <div class="telegram-box" id="telegramSection">
            <p>📱 للتحقق من حسابك عبر تيليجرام:</p>
            <p>1. اضغط على الزر أدناه لفتح البوت.</p>
            <p>2. سيتم إرسال رمز التحقق تلقائياً.</p>
            <a id="telegramLink" class="btn-telegram" href="#">فتح تيليجرام للتحقق</a>
            <p style="margin-top:15px; font-size:0.9rem; color:var(--text-muted);">بعد التحقق، عد إلى صفحة تسجيل الدخول.</p>
        </div>

        <div class="no-telegram" id="noTelegram">
            <p>لم يتم توفير رابط تيليجرام. يرجى التسجيل أولاً.</p>
        </div>

        <div id="errorMsg" class="error-message"></div>
        <a href="login.html" class="back-link">← العودة لتسجيل الدخول</a>
    </div>

    <script>
        const tgLink = sessionStorage.getItem('telegramLink') || '';
        const tgSection = document.getElementById('telegramSection');
        const noTg = document.getElementById('noTelegram');
        const linkEl = document.getElementById('telegramLink');
        const errorEl = document.getElementById('errorMsg');

        if (tgLink) {
            linkEl.href = tgLink;
            tgSection.style.display = 'block';
            noTg.style.display = 'none';
        } else {
            tgSection.style.display = 'none';
            noTg.style.display = 'block';
        }

        // معالجة فتح الرابط في تيليجرام
        linkEl.addEventListener('click', (e) => {
            if (!tgLink) {
                e.preventDefault();
                errorEl.textContent = 'لا يوجد رابط تحقق. يرجى التسجيل أولاً.';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
