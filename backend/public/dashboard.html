<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - سلة</title>
    <style>
        :root {
            --red: #b22222;
            --red-light: #dc3545;
            --gold: #f4b400;
            --gold-light: #ffcc00;
            --bg-dark: #1c1c1c;
            --bg-card: rgba(30, 30, 30, 0.75);
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text: #f0f0f0;
            --text-muted: #bbbbbb;
            --border: #444;
            --radius: 18px;
            --transition: 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 20%, #3a1010, #0f0505);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* شريط التنقل */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(244, 180, 0, 0.4);
            padding: 0 25px;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--gold);
            font-size: 2rem;
            font-weight: 800;
        }

        .logo .basket-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px var(--gold));
            transition: transform 0.3s;
        }

        .logo:hover .basket-icon {
            transform: rotate(-5deg) scale(1.1);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a,
        .nav-links button {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 30px;
            transition: var(--transition);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
        }

        .nav-links a:hover,
        .nav-links button:hover {
            background: rgba(244,180,0,0.15);
            color: var(--gold);
        }

        .btn-logout {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid var(--red);
            color: var(--red-light);
            padding: 8px 22px;
            border-radius: 30px;
            font-weight: bold;
        }

        .btn-logout:hover {
            background: var(--red);
            color: white;
        }

        /* زر الإشعارات */
        .notif-btn {
            position: relative;
            background: none;
            border: none;
            color: var(--gold);
            font-size: 1.8rem;
            cursor: pointer;
            transition: 0.3s;
            padding: 5px;
        }

        .notif-btn:hover {
            color: var(--gold-light);
            transform: scale(1.1);
        }

        .notif-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--red);
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            display: none;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--gold);
            font-size: 2rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                right: 0;
                background: rgba(20, 0, 0, 0.95);
                backdrop-filter: blur(20px);
                border-bottom: 2px solid var(--gold);
                padding: 25px;
                gap: 18px;
                border-radius: 0 0 20px 20px;
            }
            .nav-links.show {
                display: flex;
            }
            .menu-toggle {
                display: block;
            }
        }

        /* المحتوى الرئيسي */
        .main-container {
            flex: 1;
            padding: 35px 25px;
            max-width: 1350px;
            margin: 0 auto;
            width: 100%;
        }

        /* قسم البحث */
        .search-section {
            background: var(--bg-card);
            backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 0 1px rgba(244,180,0,0.15) inset;
            border-top: 1px solid rgba(244,180,0,0.3);
        }

        .search-section h2 {
            color: var(--gold-light);
            margin-bottom: 20px;
        }

        .search-form {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-field {
            flex: 1 1 200px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .search-field label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .search-field input {
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(255,255,255,0.07);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .search-field input:focus {
            border-color: var(--gold);
        }

        .btn-search {
            padding: 12px 30px;
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid var(--red-light);
            color: white;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            align-self: flex-end;
            backdrop-filter: blur(10px);
        }

        .btn-search:hover {
            background: var(--red);
        }

        /* بطاقات الإجراءات السريعة */
        .quick-actions {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .action-card {
            flex: 1 1 200px;
            background: var(--bg-card);
            backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 25px;
            text-align: center;
            color: var(--text);
            text-decoration: none;
            transition: var(--transition);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border-top: 1px solid rgba(244,180,0,0.25);
        }

        .action-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 15px 35px rgba(244,180,0,0.2);
        }

        .action-card .icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .action-card .title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        /* العروض المميزة */
        .featured-section h2 {
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 20px;
        }

        .featured-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            margin-bottom: 20px;
        }

        .product-card {
            background: var(--bg-card);
            backdrop-filter: blur(18px);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--glass-border);
            transition: var(--transition);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .product-card:hover {
            border-color: var(--gold);
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(244,180,0,0.2);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #111;
        }

        .product-card .info {
            padding: 15px;
        }

        .product-card .info h3 {
            margin-bottom: 5px;
        }

        .product-card .price {
            color: var(--gold);
            font-weight: bold;
            font-size: 1.2rem;
        }

        .badge {
            background: var(--red);
            color: white;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .view-all {
            display: inline-block;
            margin-top: 15px;
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
        }

        /* تنبيه الباقة */
        .package-alert {
            background: rgba(244,180,0,0.1);
            border: 1px solid var(--gold);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .package-alert a {
            color: var(--gold-light);
            font-weight: bold;
        }

        /* نافذة الإشعارات */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .modal-content {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--gold);
            border-radius: var(--radius);
            padding: 30px;
            width: 90%;
            max-width: 500px;
            color: var(--text);
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: var(--gold);
            margin-bottom: 20px;
            text-align: center;
        }

        .notif-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border-left: 3px solid var(--gold);
            cursor: pointer;
            transition: 0.2s;
        }

        .notif-item.unread {
            border-left-color: var(--red);
            background: rgba(220,53,69,0.1);
        }

        .notif-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .notif-item small {
            color: var(--text-muted);
            display: block;
            margin-top: 5px;
        }

        .close-modal {
            background: var(--red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">
            <span class="basket-icon">🧺</span>
            <span>سلة</span>
        </a>
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="nav-links" id="navLinks"></div>
        <div style="display:flex; align-items:center; gap:15px;">
            <button class="notif-btn" id="notifBtn">
                🔔
                <span class="notif-badge" id="notifBadge">0</span>
            </button>
            <button class="btn-logout" id="logoutBtn" style="display:none;">تسجيل الخروج</button>
        </div>
    </nav>

    <!-- نافذة الإشعارات -->
    <div class="modal" id="notifModal">
        <div class="modal-content">
            <h3>🔔 الإشعارات</h3>
            <div id="notifList"></div>
            <button class="close-modal" onclick="document.getElementById('notifModal').style.display='none'">إغلاق</button>
        </div>
    </div>

    <div class="main-container">
        <div id="packageAlert" class="package-alert" style="display:none;"></div>

        <div class="search-section">
            <h2>🔍 ابحث عن منتج أو متجر</h2>
            <form class="search-form" id="searchForm">
                <div class="search-field">
                    <label for="keyword">كلمة مفتاحية</label>
                    <input type="text" id="keyword" placeholder="اسم المنتج أو المتجر...">
                </div>
                <div class="search-field">
                    <label for="location">الموقع</label>
                    <input type="text" id="location" placeholder="المدينة أو المنطقة...">
                </div>
                <div class="search-field">
                    <label for="radius">نطاق البحث (كم)</label>
                    <input type="number" id="radius" placeholder="مثلاً 50" min="1">
                </div>
                <button type="submit" class="btn-search">بحث</button>
            </form>
        </div>

        <div class="quick-actions" id="quickActions"></div>

        <div class="featured-section">
            <h2>🔥 عروض مميزة</h2>
            <div class="featured-grid" id="featuredGrid"></div>
            <a href="offers.html" class="view-all">عرض الكل ←</a>
        </div>
    </div>

    <footer>© 2025 سلة - جميع الحقوق محفوظة</footer>

    <script>
        let currentUser = null;

        // ========== التحقق من المستخدم ==========
        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/me', { credentials: 'include' });
                if (res.ok) {
                    currentUser = await res.json();
                    document.getElementById('logoutBtn').style.display = 'inline-block';
                } else {
                    currentUser = null;
                    document.getElementById('logoutBtn').style.display = 'none';
                }
            } catch (e) {
                currentUser = null;
            }
            updateUI();
            if (currentUser) loadNotifications();
        }

        // ========== تحديث الواجهة ==========
        function updateUI() {
            const navLinks = document.getElementById('navLinks');
            const quickActions = document.getElementById('quickActions');
            const packageAlert = document.getElementById('packageAlert');

            if (currentUser && (currentUser.role === 'seller' || currentUser.role === 'admin')) {
                navLinks.innerHTML = `
                    <a href="dashboard.html">الرئيسية</a>
                    <a href="offers.html">العروض</a>
                    <a href="create-offer.html">إضافة منتج</a>
                    <a href="profile.html">ملفي</a>
                    <a href="upgrade.html">ترقية</a>
                `;
                quickActions.innerHTML = `
                    <a href="create-offer.html" class="action-card">
                        <div class="icon">➕</div>
                        <div class="title">إضافة منتج</div>
                    </a>
                    <a href="offers.html" class="action-card">
                        <div class="icon">⭐</div>
                        <div class="title">العروض المميزة</div>
                    </a>
                    <a href="profile.html" class="action-card">
                        <div class="icon">👤</div>
                        <div class="title">ملفي الشخصي</div>
                    </a>
                    <a href="upgrade.html" class="action-card">
                        <div class="icon">⬆️</div>
                        <div class="title">ترقية الباقة</div>
                    </a>
                `;

                const current = currentUser.currentProducts || 0;
                const max = currentUser.maxProducts || 20;
                const remaining = Math.max(0, max - current);
                if (remaining <= 5) {
                    packageAlert.style.display = 'block';
                    packageAlert.innerHTML = `⚠️ تنبيه: أنت على وشك الوصول للحد الأقصى (${current}/${max}). <a href="upgrade.html">ترقية الباقة</a>`;
                } else {
                    packageAlert.style.display = 'none';
                }
            } else {
                navLinks.innerHTML = `
                    <a href="dashboard.html">الرئيسية</a>
                    <a href="offers.html">العروض</a>
                    <a href="login.html">تسجيل الدخول</a>
                `;
                quickActions.innerHTML = `
                    <a href="offers.html" class="action-card">
                        <div class="icon">⭐</div>
                        <div class="title">العروض المميزة</div>
                    </a>
                    <a href="login.html" class="action-card">
                        <div class="icon">🔑</div>
                        <div class="title">تسجيل الدخول للبيع</div>
                    </a>
                `;
                packageAlert.style.display = 'none';
            }
        }

        // ========== تحميل العروض المميزة ==========
        async function loadFeatured() {
            try {
                const res = await fetch('/api/featured');
                const data = await res.json();
                const products = data.products || [];
                const grid = document.getElementById('featuredGrid');

                if (!products.length) {
                    grid.innerHTML = '<p style="color:var(--text-muted);">لا توجد عروض مميزة حالياً</p>';
                    return;
                }
                grid.innerHTML = products.map(p => `
                    <div class="product-card" onclick="window.location.href='product-details.html?id=${p.id}'">
                        <img src="${p.image || 'https://via.placeholder.com/300x200/1c1c1c/f4b400?text=🧺+سلة'}" alt="${p.name}">
                        <div class="info">
                            <span class="badge">مميز</span>
                            <h3>${p.name}</h3>
                            <p style="color:var(--text-muted);">${p.store_name || ''}</p>
                            <p class="price">${p.price}$</p>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        // ========== الإشعارات ==========
        async function loadNotifications() {
            if (!currentUser) return;
            try {
                const res = await fetch('/api/notifications', { credentials: 'include' });
                const notifs = await res.json();
                const unreadCount = notifs.filter(n => !n.is_read).length;
                const badge = document.getElementById('notifBadge');
                if (unreadCount > 0) {
                    badge.textContent = unreadCount;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }

                const notifList = document.getElementById('notifList');
                if (notifs.length === 0) {
                    notifList.innerHTML = '<p style="text-align:center; color:var(--text-muted);">لا توجد إشعارات</p>';
                } else {
                    notifList.innerHTML = notifs.map(n => `
                        <div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="readNotif('${n.id}')">
                            <p>${n.message}</p>
                            <small>${new Date(n.created_at).toLocaleString('ar')}</small>
                        </div>
                    `).join('');
                }
            } catch (err) { console.error(err); }
        }

        async function readNotif(id) {
            await fetch(`/api/notifications/${id}/read`, { method: 'PUT', credentials: 'include' });
            loadNotifications();
        }

        document.getElementById('notifBtn').addEventListener('click', () => {
            document.getElementById('notifModal').style.display = 'flex';
            loadNotifications();
        });

        // ========== البحث ==========
        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const keyword = document.getElementById('keyword').value.trim();
            if (keyword) {
                window.location.href = `offers.html?search=${encodeURIComponent(keyword)}`;
            }
        });

        // ========== القائمة للجوال ==========
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('navLinks').classList.toggle('show');
        });

        // ========== تسجيل الخروج ==========
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.href = 'index.html';
        });

        // بدء التشغيل
        checkAuth().then(loadFeatured);
    </script>
</body>
</html>
