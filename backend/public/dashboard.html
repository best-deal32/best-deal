<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لوحة التحكم | Fargo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        
        :root {
            --bg-deep: #021a2b;
            --sky-dark: #0a3d62;
            --sky-mid: #1e6b8a;
            --sky-light: #2e86ab;
            --sky-accent: #45b3e0;
            --text-primary: #e6f7ff;
            --text-dim: #b0d4e8;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(ellipse at top, #022c43 0%, var(--bg-deep) 70%);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(4, 40, 70, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(69, 179, 224, 0.3);
            border-radius: 2rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }

        .btn-sky {
            background: linear-gradient(135deg, var(--sky-mid), var(--sky-light));
            color: #fff;
            font-weight: 800;
            border-radius: 1.2rem;
            padding: 0.7rem 1.5rem;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-sky:hover {
            background: linear-gradient(135deg, #1a5670, #2e86ab);
            transform: translateY(-2px);
        }

        .btn-outline-sky {
            background: transparent;
            border: 2px solid var(--sky-accent);
            color: var(--sky-accent);
            font-weight: 800;
            border-radius: 1.2rem;
            padding: 0.7rem 1.5rem;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn-outline-sky:hover {
            background: rgba(69, 179, 224, 0.15);
            color: #fff;
        }

        .balance-value {
            font-size: clamp(2rem, 8vw, 3rem);
            font-weight: 900;
            color: var(--sky-accent);
            text-shadow: 0 0 20px rgba(69, 179, 224, 0.6);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--sky-accent);
        }

        .lang-selector {
            background: rgba(4,40,70,0.7);
            border-radius: 3rem;
            padding: 0.3rem;
            display: inline-flex;
            gap: 0.2rem;
            border: 1px solid rgba(69, 179, 224, 0.3);
        }
        .lang-option {
            padding: 0.4rem 0.9rem;
            border-radius: 3rem;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-dim);
        }
        .lang-option.active {
            background: linear-gradient(135deg, var(--sky-mid), var(--sky-light));
            color: #fff;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(2, 26, 43, 0.96);
            border-top: 1px solid rgba(69, 179, 224, 0.3);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }
        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-link.active { color: var(--sky-accent); }
        .nav-link i { font-size: 1.5rem; margin-bottom: 3px; }
        .nav-link span { font-size: 10px; }

        .notification-bell { position: relative; cursor: pointer; }
        .notification-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ef4444;
            color: #fff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .activity-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 1.2rem;
            transition: 0.2s;
            padding: 1rem;
        }
        .activity-item:hover {
            background: rgba(255,255,255,0.06);
        }

        .shield-icon {
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .shield-icon:active {
            transform: scale(0.95);
        }

        @media (max-width: 640px) {
            .glass-card {
                border-radius: 1.5rem;
                padding: 1rem;
            }
        }
    </style>
</head>
<body class="pb-28">

    <!-- شريط علوي -->
    <header class="px-5 py-4 flex justify-between items-center border-b border-[#2e86ab]/30 bg-[#021a2b]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <i id="shieldIcon" class="fa-solid fa-shield-halved text-3xl text-sky-400 drop-shadow-xl shield-icon"></i>
            <span class="text-xl font-black text-white italic tracking-wide hidden sm:inline">FARGO</span>
        </div>
        <div class="flex items-center gap-3">
            <div class="lang-selector">
                <div class="lang-option active" data-lang="ar">العربية</div>
                <div class="lang-option" data-lang="en">English</div>
                <div class="lang-option" data-lang="zh">中文</div>
                <div class="lang-option" data-lang="de">Deutsch</div>
            </div>
            <div class="notification-bell" id="notificationBell" onclick="toggleNotifications()">
                <i class="fa-regular fa-bell text-xl text-sky-200"></i>
                <span id="notificationCount" class="notification-badge" style="display: none;">0</span>
            </div>
            <img id="user-avatar" class="w-10 h-10 rounded-full border-2 border-sky-400" src="" alt="Avatar">
        </div>
    </header>

    <!-- لوحة الإشعارات المنسدلة -->
    <div id="notificationsDropdown" class="fixed top-16 left-4 w-72 max-h-80 overflow-y-auto bg-[#042840] border border-sky-500/30 rounded-2xl shadow-2xl z-50 hidden p-2">
        <div class="text-center text-sm text-sky-300 font-bold mb-2">الإشعارات</div>
        <div id="notificationsList" class="space-y-1 text-xs"></div>
        <button id="markAllReadBtn" class="text-[10px] text-sky-400 hover:underline mt-2 text-center w-full">تحديد الكل كمقروء</button>
    </div>

    <main class="max-w-5xl mx-auto px-4 mt-8">
        <!-- بطاقة الترحيب والرصيد -->
        <div class="glass-card p-6 mb-6 text-center">
            <h2 class="text-lg font-bold text-slate-200">مرحباً <span id="welcome-name" class="text-sky-300">.......</span></h2>
            <div class="balance-value mt-3" id="user-balance">$0.00</div>
            <p class="text-xs text-slate-400 mt-1">الرصيد المتاح للسحب</p>
            <div class="flex flex-wrap gap-4 justify-center mt-5">
                <button onclick="window.location.href='deposit.html'" class="btn-sky"><i class="fa-solid fa-circle-plus"></i> إيداع</button>
                <button onclick="window.location.href='withdraw.html'" class="btn-outline-sky"><i class="fa-solid fa-receipt"></i> سحب</button>
                <button onclick="window.location.href='support.html'" class="bg-white/10 text-white font-bold px-4 py-2 rounded-xl border border-white/20 backdrop-blur-sm"><i class="fa-solid fa-headset"></i> الدعم</button>
            </div>
        </div>

        <!-- بطاقات الأرباح والاستثمار والإحالات -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-6">
            <div class="glass-card p-5 text-center">
                <div class="flex justify-center items-center gap-2"><span class="text-sm text-slate-400">الأرباح</span><i class="fa-solid fa-chart-line text-sky-400"></i></div>
                <p class="stat-value mt-2" id="user-profit">$0.00</p>
                <button onclick="quickWithdrawProfit()" class="mt-3 text-xs bg-sky-900/30 hover:bg-sky-800/50 text-sky-300 px-4 py-2 rounded-xl transition w-fit mx-auto">سحب الأرباح</button>
            </div>
            <div class="glass-card p-5 text-center">
                <div class="flex justify-center items-center gap-2"><span class="text-sm text-slate-400">المعادن والعملات</span><i class="fa-solid fa-coins text-sky-400"></i></div>
                <p class="text-lg font-bold text-white mt-2">3% يوميًا</p>
                <p class="text-xs text-slate-400 mt-1">50$ - 10,000$</p>
                <button onclick="window.location.href='investments.html'" class="mt-3 text-xs bg-sky-900/30 hover:bg-sky-800/50 text-sky-300 px-4 py-2 rounded-xl transition w-fit mx-auto">استثمر الآن</button>
            </div>
            <div class="glass-card p-5 text-center">
                <div class="flex justify-center items-center gap-2"><span class="text-sm text-slate-400">الإحالات</span><i class="fa-solid fa-user-group text-sky-400"></i></div>
                <p class="text-lg font-mono text-sky-300 mt-2" id="referralCodeDisplay">------</p>
                <p class="text-xs text-slate-400 mt-1">15% من أول إيداع</p>
                <button onclick="window.location.href='referrals.html'" class="mt-3 text-xs bg-sky-900/30 hover:bg-sky-800/50 text-sky-300 px-4 py-2 rounded-xl transition w-fit mx-auto">تفاصيل</button>
            </div>
        </div>

        <!-- سجل النشاطات -->
        <div class="glass-card p-5 mb-4">
            <h3 class="text-sm font-bold text-sky-300 mb-3"><i class="fa-solid fa-clock-rotate-left ml-1"></i> آخر النشاطات</h3>
            <div id="activity-container" class="space-y-2 text-sm text-slate-300"></div>
        </div>
    </main>

    <!-- القائمة السفلية -->
    <div class="bottom-nav">
        <div class="nav-link active"><i class="fa-solid fa-house-chimney"></i><span>الرئيسية</span></div>
        <div onclick="window.location.href='deposit.html'" class="nav-link"><i class="fa-solid fa-wallet"></i><span>إيداع</span></div>
        <div onclick="window.location.href='investments.html'" class="nav-link"><i class="fa-solid fa-chart-line"></i><span>استثمار</span></div>
        <div onclick="window.location.href='referrals.html'" class="nav-link"><i class="fa-solid fa-users"></i><span>إحالات</span></div>
        <div onclick="window.location.href='support.html'" class="nav-link"><i class="fa-solid fa-headset"></i><span>دعم</span></div>
        <div onclick="logout()" class="nav-link text-red-400"><i class="fa-solid fa-power-off"></i><span>خروج</span></div>
    </div>

    <script>
        const API_BASE = '';
        let socket;
        let currentLang = localStorage.getItem('preferredLanguage') || 'ar';
        const translations = {};

        // i18n
        async function loadTranslations(lang) {
            try {
                const res = await fetch(`/locales/${lang}/translation.json`);
                if (res.ok) translations[lang] = await res.json();
            } catch (e) {}
        }
        function applyTranslations(lang) {
            const t = translations[lang] || {};
            document.querySelectorAll('[data-i18n]').forEach(el => {
                if (t[el.dataset.i18n]) el.textContent = t[el.dataset.i18n];
            });
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            localStorage.setItem('preferredLanguage', lang);
            currentLang = lang;
            document.querySelectorAll('.lang-option').forEach(o => o.classList.toggle('active', o.dataset.lang === lang));
            document.cookie = `i18n=${lang}; path=/; max-age=31536000`;
        }
        async function setLanguage(lang) {
            if (!translations[lang]) await loadTranslations(lang);
            applyTranslations(lang);
            fetchUserData();
        }
        document.querySelectorAll('.lang-option').forEach(opt => {
            opt.addEventListener('click', () => setLanguage(opt.dataset.lang));
        });

        // WebSocket
        function initSocket() {
            socket = io(window.location.origin, { withCredentials: true });
            socket.on('notification', data => {
                Swal.fire({ toast: true, position: 'top-end', icon: 'info', title: data.title, text: data.message, timer: 5000, background: '#042840', color: '#fff' });
                loadNotifications();
            });
        }

        // Auth
        async function fetchWithAuth(url, options = {}) {
            options.credentials = 'include';
            let res = await fetch(url, options);
            if (res.status === 401 || res.status === 403) {
                const refresh = await fetch(`${API_BASE}/api/auth/refresh`, { method: 'POST', credentials: 'include' });
                if (refresh.ok) res = await fetch(url, options);
                else { localStorage.clear(); window.location.href = 'login.html'; }
            }
            return res;
        }

        async function fetchUserData() {
            try {
                const res = await fetchWithAuth(`${API_BASE}/api/users/me`);
                if (!res.ok) throw new Error();
                const user = await res.json();
                localStorage.setItem('currentUser', JSON.stringify(user));
                updateUI(user);
                return user;
            } catch (e) { return null; }
        }

        function updateUI(user) {
            document.getElementById('welcome-name').innerText = user.fullName || user.username;
            document.getElementById('user-balance').innerText = `$${((user.balance||0)+(user.profit||0)).toLocaleString()}`;
            document.getElementById('user-profit').innerText = `$${(user.profit||0).toLocaleString()}`;
            document.getElementById('referralCodeDisplay').innerText = user.referralCode || '------';
            document.getElementById('user-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.username||'U')}&background=1e6b8a&color=fff&bold=true`;
            localStorage.setItem('currentUsername', user.username);
        }

        // باب الأدمن السري
        let shieldClickTimer = null;
        let shieldClickCount = 0;
        document.getElementById('shieldIcon').addEventListener('click', () => {
            shieldClickCount++;
            if (shieldClickCount === 1) {
                shieldClickTimer = setTimeout(() => { shieldClickCount = 0; }, 500);
            } else if (shieldClickCount === 2) {
                clearTimeout(shieldClickTimer);
                shieldClickCount = 0;
                const currentUsername = localStorage.getItem('currentUsername');
                if (currentUsername === 'freeze') {
                    Swal.fire({
                        title: 'بوابة القيادة السرية',
                        text: 'أدخل كلمة المرور للوصول إلى لوحة الإدارة',
                        input: 'password',
                        inputPlaceholder: 'كلمة المرور',
                        showCancelButton: true,
                        confirmButtonText: 'دخول',
                        cancelButtonText: 'إلغاء',
                        background: '#042840',
                        color: '#fff',
                        confirmButtonColor: '#2e86ab',
                        customClass: { input: 'text-center' }
                    }).then(async (result) => {
                        if (result.isConfirmed && result.value) {
                            try {
                                const res = await fetch(API_BASE + '/api/auth/verify-admin-gateway', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ secretPassword: result.value }),
                                    credentials: 'include'
                                });
                                const data = await res.json();
                                if (data.success) window.location.href = 'admin.html';
                                else Swal.fire({ icon: 'error', title: 'خطأ', text: 'كلمة المرور غير صحيحة', background: '#042840', color: '#fff' });
                            } catch (e) {
                                Swal.fire({ icon: 'error', title: 'خطأ', text: 'فشل الاتصال', background: '#042840', color: '#fff' });
                            }
                        }
                    });
                }
            }
        });

        // سحب سريع للأرباح
        async function quickWithdrawProfit() {
            const user = await fetchUserData();
            if (!user) return;
            const profit = user.profit || 0;
            if (profit <= 0) { Swal.fire('تنبيه', 'لا توجد أرباح حالياً', 'info'); return; }
            localStorage.setItem('quickWithdrawAmount', profit);
            window.location.href = `withdraw.html?amount=${profit}&type=profit`;
        }

        // سجل النشاطات
        async function loadActivities() {
            const res = await fetchWithAuth(`${API_BASE}/api/activity-logs/recent`);
            const activities = await res.json();
            const container = document.getElementById('activity-container');
            if (!activities.length) {
                container.innerHTML = '<div class="text-slate-500 text-center py-2">لا توجد نشاطات حديثة</div>';
                return;
            }
            container.innerHTML = activities.slice(0, 6).map(a => `
                <div class="activity-item flex justify-between items-center">
                    <div>
                        <span class="font-bold text-white">${esc(a.action)}</span>
                        <span class="text-slate-400 mx-2">-</span>
                        <span>${esc(a.details)}</span>
                    </div>
                    <span class="text-xs text-slate-500 whitespace-nowrap">${new Date(a.timestamp).toLocaleString()}</span>
                </div>
            `).join('');
        }

        // الإشعارات
        let notifications = [];
        async function loadNotifications() {
            const res = await fetchWithAuth(`${API_BASE}/api/notifications`);
            notifications = await res.json();
            const unread = notifications.filter(n => !n.isRead).length;
            const badge = document.getElementById('notificationCount');
            badge.style.display = unread > 0 ? 'flex' : 'none';
            badge.innerText = unread;
            const list = document.getElementById('notificationsList');
            list.innerHTML = notifications.map(n => `
                <div class="py-1 border-b border-white/5 ${!n.isRead ? 'font-bold text-sky-200' : 'text-slate-400'}">
                    <div>${esc(n.title)}</div>
                    <div class="text-[10px]">${esc(n.message)}</div>
                </div>
            `).join('');
        }

        function toggleNotifications() {
            const dropdown = document.getElementById('notificationsDropdown');
            dropdown.classList.toggle('hidden');
            if (!dropdown.classList.contains('hidden')) loadNotifications();
        }

        document.getElementById('markAllReadBtn').addEventListener('click', async () => {
            await fetchWithAuth(`${API_BASE}/api/notifications/read-all`, { method: 'PUT' });
            loadNotifications();
        });

        function logout() {
            Swal.fire({ title: 'تسجيل الخروج', text: 'هل أنت متأكد؟', icon: 'question', showCancelButton: true, confirmButtonColor: '#2e86ab', background: '#042840', color: '#fff' }).then(r => {
                if (r.isConfirmed) {
                    fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                    localStorage.clear();
                    window.location.href = 'login.html';
                }
            });
        }

        function esc(s) { return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

        // تهيئة
        window.onload = async () => {
            await loadTranslations(currentLang);
            applyTranslations(currentLang);
            const user = await fetchUserData();
            if (user) {
                initSocket();
                loadActivities();
                loadNotifications();
                setInterval(() => {
                    if (document.visibilityState === 'visible') fetchUserData();
                }, 20000);
            }
        };
    </script>
</body>
</html>
