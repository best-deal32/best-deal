<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لوحة التحكم | Vivor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        
        :root {
            --bg-deep: #040b14;
            --bg-card: #071426;
            --blue-mid: #1a3a6b;
            --blue-light: #2a5298;
            --blue-accent: #3b6cc2;
            --text-primary: #e0e6f0;
            --text-dim: #99a8c0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(ellipse at top, #0a1628 0%, var(--bg-deep) 70%);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 5rem;
        }

        .glass-card {
            background: rgba(11, 31, 59, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(43, 80, 150, 0.4);
            border-radius: 2rem;
            transition: all 0.3s ease;
        }

        .btn-blue {
            background: linear-gradient(135deg, var(--blue-mid), var(--blue-light));
            color: #fff;
            font-weight: 800;
            border-radius: 1.2rem;
            padding: 0.7rem 1.5rem;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-blue:hover {
            background: linear-gradient(135deg, #204080, #3265b0);
            transform: translateY(-2px);
        }

        .balance-text {
            font-size: 3rem;
            font-weight: 900;
            color: var(--blue-accent);
            text-shadow: 0 0 20px rgba(59,108,194,0.6);
        }

        .lang-selector {
            background: rgba(11,31,59,0.65);
            border-radius: 3rem;
            padding: 0.25rem;
            display: inline-flex;
            gap: 0.2rem;
            border: 1px solid rgba(43,80,150,0.4);
        }
        .lang-option {
            padding: 0.3rem 0.8rem;
            border-radius: 3rem;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-dim);
        }
        .lang-option.active {
            background: linear-gradient(135deg, var(--blue-mid), var(--blue-light));
            color: #fff;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(7,20,38,0.96);
            border-top: 1px solid rgba(43,80,150,0.4);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-link { display: flex; flex-direction: column; align-items: center; color: var(--text-dim); font-size: 10px; font-weight: 800; cursor: pointer; }
        .nav-link.active { color: var(--blue-accent); }
        .nav-link i { font-size: 1.4rem; margin-bottom: 2px; }

        .notification-bell { position: relative; cursor: pointer; }
        .notification-badge {
            position: absolute; top: -6px; right: -6px;
            background: #ef4444; color: #fff; border-radius: 50%;
            width: 18px; height: 18px; font-size: 10px;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <!-- شريط علوي -->
    <header class="px-5 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-dragon text-3xl text-blue-400 drop-shadow-xl"></i>
            <span class="text-2xl font-black text-white italic tracking-wider">VIVOR</span>
        </div>
        <div class="flex items-center gap-3">
            <div class="lang-selector">
                <div class="lang-option active" data-lang="ar">العربية</div>
                <div class="lang-option" data-lang="en">English</div>
                <div class="lang-option" data-lang="zh">中文</div>
                <div class="lang-option" data-lang="de">Deutsch</div>
            </div>
            <div class="notification-bell" id="notificationBell">
                <i class="fa-regular fa-bell text-xl text-blue-300"></i>
                <span id="notificationCount" class="notification-badge" style="display: none;">0</span>
            </div>
            <img id="user-avatar" class="w-10 h-10 rounded-full border-2 border-blue-400" src="" alt="U">
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4">
        <!-- بطاقة الترحيب والرصيد -->
        <div class="glass-card p-6 mb-6 text-center">
            <h2 class="text-lg font-bold text-slate-300">مرحباً <span id="welcome-name" class="text-blue-300">.......</span></h2>
            <div class="mt-2 balance-text" id="user-balance">$0.00</div>
            <p class="text-xs text-slate-400 mt-1">الرصيد المتاح للسحب</p>
            <div class="flex gap-4 justify-center mt-4">
                <button onclick="window.location.href='deposit.html'" class="btn-blue"><i class="fa-solid fa-circle-plus"></i> إيداع</button>
                <button onclick="window.location.href='withdraw.html'" class="btn-blue"><i class="fa-solid fa-receipt"></i> سحب</button>
            </div>
        </div>

        <!-- بطاقات الأرباح والاستثمار -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <!-- الأرباح -->
            <div class="glass-card p-5">
                <div class="flex justify-between items-center">
                    <span class="text-sm text-slate-400">الأرباح الصافية</span>
                    <i class="fa-solid fa-chart-line text-blue-400"></i>
                </div>
                <p class="text-2xl font-black text-green-400 mt-1" id="user-profit">$0.00</p>
                <button onclick="window.location.href='withdraw.html?type=profit&amount=' + (document.getElementById('user-profit').innerText.replace('$',''))" class="mt-3 text-xs bg-blue-900/30 hover:bg-blue-800/50 text-blue-300 px-3 py-1.5 rounded-lg transition">سحب الأرباح</button>
            </div>
            <!-- استثمار المعادن -->
            <div class="glass-card p-5">
                <div class="flex justify-between items-center">
                    <span class="text-sm text-slate-400">استثمار المعادن</span>
                    <i class="fa-solid fa-gem text-blue-400"></i>
                </div>
                <p class="text-lg font-bold text-white mt-1">3% يومياً</p>
                <p class="text-xs text-slate-400 mt-1">الحد الأدنى 50$ - الأقصى 10,000$</p>
                <button onclick="window.location.href='investments.html'" class="mt-3 text-xs bg-blue-900/30 hover:bg-blue-800/50 text-blue-300 px-3 py-1.5 rounded-lg transition">استثمر الآن</button>
            </div>
        </div>

        <!-- المكافأة اليومية والإحالات -->
        <div class="grid grid-cols-2 gap-6 mb-6">
            <!-- المكافأة اليومية -->
            <div class="glass-card p-5 text-center">
                <i class="fa-solid fa-gift text-2xl text-blue-400 mb-2"></i>
                <p class="text-sm text-white font-bold" id="dailyBonusAmount">0.50 $</p>
                <p class="text-[10px] text-slate-400" id="bonusStreakText"></p>
                <button id="claimDailyBonusBtn" class="mt-3 w-full bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2 rounded-xl transition">استلام المكافأة</button>
            </div>
            <!-- الإحالات -->
            <div class="glass-card p-5 text-center">
                <i class="fa-solid fa-user-group text-2xl text-blue-400 mb-2"></i>
                <p class="text-sm text-white font-bold">كود الإحالة</p>
                <p class="text-lg font-mono text-blue-300" id="referralCodeDisplay">------</p>
                <p class="text-[10px] text-slate-400 mt-1">تربح 15% من أول إيداع للمدعو</p>
                <button onclick="window.location.href='referrals.html'" class="mt-2 text-xs bg-blue-900/30 hover:bg-blue-800/50 text-blue-300 px-3 py-1.5 rounded-lg transition">تفاصيل الإحالات</button>
            </div>
        </div>

        <!-- سجل النشاطات -->
        <div class="glass-card p-5 mb-6">
            <h3 class="text-sm font-bold text-blue-300 mb-3"><i class="fa-solid fa-clock-rotate-left ml-1"></i> آخر النشاطات</h3>
            <div id="activity-container" class="space-y-3 text-sm text-slate-300"></div>
        </div>

        <!-- زر فتح تذكرة دعم -->
        <div class="text-center mb-10">
            <button onclick="openTicketModal()" class="btn-blue py-3 px-8"><i class="fa-solid fa-headset"></i> فتح تذكرة دعم</button>
        </div>
    </main>

    <!-- نافذة إنشاء تذكرة -->
    <div id="ticketModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-[#0b1f3b] border border-blue-500/40 rounded-3xl p-6 w-full max-w-md">
            <h3 class="text-xl font-bold text-blue-300 mb-4">تذكرة دعم جديدة</h3>
            <input type="text" id="ticketSubject" class="w-full bg-black/50 border border-blue-500/30 rounded-xl p-3 mb-3 text-white" placeholder="الموضوع">
            <textarea id="ticketMessage" rows="4" class="w-full bg-black/50 border border-blue-500/30 rounded-xl p-3 mb-4 text-white" placeholder="اشرح مشكلتك..."></textarea>
            <div class="flex gap-3">
                <button onclick="submitTicket()" class="btn-blue flex-1">إرسال</button>
                <button onclick="closeTicketModal()" class="bg-gray-700 hover:bg-gray-600 text-white px-5 py-2 rounded-xl">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- القائمة السفلية -->
    <div class="bottom-nav">
        <div class="nav-link active"><i class="fa-solid fa-house-chimney"></i><span>الرئيسية</span></div>
        <div onclick="window.location.href='deposit.html'" class="nav-link"><i class="fa-solid fa-wallet"></i><span>إيداع</span></div>
        <div onclick="window.location.href='investments.html'" class="nav-link"><i class="fa-solid fa-chart-line"></i><span>استثمار</span></div>
        <div onclick="window.location.href='referrals.html'" class="nav-link"><i class="fa-solid fa-users"></i><span>إحالات</span></div>
        <div onclick="logout()" class="nav-link text-red-400"><i class="fa-solid fa-power-off"></i><span>خروج</span></div>
    </div>

    <script>
        const API_BASE = '';
        let socket;
        let currentLang = localStorage.getItem('preferredLanguage') || 'ar';
        const translations = {};

        // i18n
        async function loadTranslations(lang) {
            try {
                const res = await fetch(`/locales/${lang}/translation.json`);
                if (!res.ok) throw new Error();
                translations[lang] = await res.json();
            } catch (e) { /* fallback */ }
        }
        function applyTranslations(lang) {
            const t = translations[lang] || {};
            document.querySelectorAll('[data-i18n]').forEach(el => { if (t[el.dataset.i18n]) el.textContent = t[el.dataset.i18n]; });
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            localStorage.setItem('preferredLanguage', lang);
            currentLang = lang;
            document.querySelectorAll('.lang-option').forEach(o => o.classList.toggle('active', o.dataset.lang === lang));
            document.cookie = `i18n=${lang}; path=/; max-age=31536000`;
        }
        async function setLanguage(lang) {
            if (!translations[lang]) await loadTranslations(lang);
            applyTranslations(lang);
            fetchUserData();
            loadDailyBonusStatus();
        }
        document.querySelectorAll('.lang-option').forEach(opt => {
            opt.addEventListener('click', () => setLanguage(opt.dataset.lang));
        });

        // Socket
        function initSocket() {
            socket = io(window.location.origin, { withCredentials: true });
            socket.on('notification', data => {
                Swal.fire({ toast: true, position: 'top-end', icon: 'info', title: data.title, text: data.message, timer: 5000, background: '#071426', color: '#fff' });
                loadNotifications();
            });
        }

        async function fetchWithAuth(url, options = {}) {
            options.credentials = 'include';
            let res = await fetch(url, options);
            if (res.status === 401 || res.status === 403) {
                const refresh = await fetch(`${API_BASE}/api/auth/refresh`, { method: 'POST', credentials: 'include' });
                if (refresh.ok) res = await fetch(url, options);
                else { localStorage.clear(); window.location.href = 'login.html'; }
            }
            return res;
        }

        async function fetchUserData() {
            try {
                const res = await fetchWithAuth(`${API_BASE}/api/users/me`);
                if (!res.ok) throw new Error();
                const user = await res.json();
                localStorage.setItem('currentUser', JSON.stringify(user));
                updateUI(user);
                return user;
            } catch (e) { return null; }
        }

        function updateUI(user) {
            document.getElementById('welcome-name').innerText = user.fullName || user.username;
            document.getElementById('user-balance').innerText = `$${(user.withdrawableAmount || (user.balance||0)+(user.profit||0)).toLocaleString()}`;
            document.getElementById('user-profit').innerText = `$${(user.profit||0).toLocaleString()}`;
            document.getElementById('referralCodeDisplay').innerText = user.referralCode || '------';
            document.getElementById('user-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.username||'U')}&background=1a3a6b&color=fff&bold=true`;
        }

        async function loadDailyBonusStatus() {
            const res = await fetchWithAuth(`${API_BASE}/api/daily-bonus/status`);
            const data = await res.json();
            const btn = document.getElementById('claimDailyBonusBtn');
            if (data.canClaim) {
                btn.disabled = false; btn.classList.remove('opacity-50');
            } else {
                btn.disabled = true; btn.classList.add('opacity-50');
            }
            document.getElementById('dailyBonusAmount').innerText = `${(data.nextBonusAmount||0.5).toFixed(2)} $`;
            if (data.currentStreak) document.getElementById('bonusStreakText').innerText = `السلسلة: ${data.currentStreak} يوم`;
        }

        document.getElementById('claimDailyBonusBtn').addEventListener('click', async () => {
            const res = await fetchWithAuth(`${API_BASE}/api/daily-bonus/claim`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                Swal.fire('تم', data.message, 'success');
                fetchUserData();
                loadDailyBonusStatus();
            } else Swal.fire('خطأ', data.message, 'error');
        });

        // الأنشطة
        async function loadActivities() {
            const res = await fetchWithAuth(`${API_BASE}/api/activity-logs/recent`);
            const activities = await res.json();
            const container = document.getElementById('activity-container');
            if (!activities.length) { container.innerHTML = '<p class="text-slate-500 text-center">لا توجد نشاطات</p>'; return; }
            container.innerHTML = activities.slice(0,8).map(a => `
                <div class="flex justify-between items-center py-1 border-b border-white/5">
                    <span>${escapeHtml(a.action)} - ${escapeHtml(a.details)}</span>
                    <span class="text-xs text-slate-500">${new Date(a.timestamp).toLocaleString()}</span>
                </div>
            `).join('');
        }

        // التذاكر
        function openTicketModal() { document.getElementById('ticketModal').classList.remove('hidden'); }
        function closeTicketModal() { document.getElementById('ticketModal').classList.add('hidden'); }
        async function submitTicket() {
            const subject = document.getElementById('ticketSubject').value.trim();
            const message = document.getElementById('ticketMessage').value.trim();
            if (!subject || !message) { Swal.fire('خطأ', 'يرجى ملء الموضوع والرسالة', 'error'); return; }
            const res = await fetchWithAuth(`${API_BASE}/api/support/tickets`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ subject, message })
            });
            const data = await res.json();
            if (data.success) {
                Swal.fire('تم', 'تم فتح التذكرة، سنرد عليك قريباً', 'success');
                closeTicketModal();
            } else Swal.fire('خطأ', data.message, 'error');
        }

        // إشعارات
        async function loadNotifications() {
            const res = await fetchWithAuth(`${API_BASE}/api/notifications`);
            const notifs = await res.json();
            const unread = notifs.filter(n => !n.isRead).length;
            const badge = document.getElementById('notificationCount');
            badge.style.display = unread > 0 ? 'flex' : 'none';
            badge.innerText = unread;
        }

        function logout() {
            Swal.fire({ title: 'تسجيل الخروج', text: 'هل أنت متأكد؟', icon: 'question', showCancelButton: true, confirmButtonColor: '#3b6cc2' }).then(r => {
                if (r.isConfirmed) {
                    fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                    localStorage.clear();
                    window.location.href = 'login.html';
                }
            });
        }

        function escapeHtml(s) { return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

        // بدء التشغيل
        window.onload = async () => {
            await loadTranslations(currentLang);
            applyTranslations(currentLang);
            const user = await fetchUserData();
            if (user) {
                initSocket();
                loadDailyBonusStatus();
                loadActivities();
                loadNotifications();
                setInterval(() => { if (document.visibilityState === 'visible') fetchUserData(); }, 15000);
            }
        };
    </script>
</body>
</html>
