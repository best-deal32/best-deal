<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - MarketHub</title>
    <style>
        :root {
            --green-dark: #059669; --green-light: #6ee7b7;
            --blue-dark: #1e40af; --blue-light: #93c5fd;
            --white: #ffffff; --bg-glass: rgba(255, 255, 255, 0.1);
            --border-glass: rgba(255, 255, 255, 0.2);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #065f46 0%, #1e3a8a 100%);
            min-height: 100vh; color: var(--white); display: flex; flex-direction: column;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glass); padding: 15px 30px;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
        }
        .logo { font-size: 1.8rem; font-weight: 800; }
        .logo .emerald-text { color: var(--green-light); } .logo .blue-text { color: var(--blue-light); }
        .nav-links { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .nav-links a, .nav-links button {
            color: var(--white); text-decoration: none; padding: 8px 16px;
            border-radius: 20px; transition:0.3s; background: none; border: none;
            cursor: pointer; font-size: 1rem; font-family: inherit;
        }
        .nav-links a:hover, .nav-links button:hover { background: rgba(255,255,255,0.15); }
        .btn-outline-light {
            border: 1px solid rgba(255,255,255,0.5); background: transparent; color: white;
            padding: 8px 20px; border-radius: 30px; text-decoration: none; transition:0.3s;
        }
        .btn-outline-light:hover { background: rgba(255,255,255,0.1); }
        .main-container { flex:1; padding:30px 20px; max-width:1200px; margin:0 auto; width:100%; }
        .search-section {
            background: var(--bg-glass); backdrop-filter: blur(10px); border:1px solid var(--border-glass);
            border-radius:25px; padding:25px; margin-bottom:40px;
        }
        .search-form { display:flex; gap:15px; flex-wrap:wrap; }
        .search-field { flex:1 1 200px; }
        .search-field label { font-size:0.9rem; color:rgba(255,255,255,0.8); }
        .search-field input {
            width:100%; padding:12px 15px; border-radius:12px; background:rgba(255,255,255,0.1);
            border:1px solid var(--border-glass); color:white; margin-top:6px;
        }
        .btn-search {
            padding:12px 30px; background:white; color:var(--green-dark); font-weight:bold;
            border:none; border-radius:50px; cursor:pointer; align-self:flex-end;
        }
        .quick-actions { display:flex; gap:20px; margin-bottom:40px; flex-wrap:wrap; }
        .action-card {
            flex:1 1 200px; background:var(--bg-glass); backdrop-filter:blur(10px);
            border:1px solid var(--border-glass); border-radius:20px; padding:25px;
            text-align:center; color:white; text-decoration:none; transition:0.3s;
        }
        .action-card:hover { background:rgba(255,255,255,0.2); transform:translateY(-5px); }
        .action-card .icon { font-size:2.5rem; margin-bottom:10px; }
        .action-card .title { font-weight:600; }
        .featured-section h2 { font-size:1.6rem; margin-bottom:20px; }
        .featured-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:20px; }
        .product-card {
            background:var(--bg-glass); backdrop-filter:blur(10px); border-radius:20px;
            overflow:hidden; border:1px solid var(--border-glass);
        }
        .product-card img { width:100%; height:160px; object-fit:cover; background:rgba(0,0,0,0.3); }
        .product-card .info { padding:15px; }
        .product-card .info h3 { margin-bottom:5px; }
        .product-card .price { color:var(--green-light); font-weight:bold; }
        .badge { background:var(--green-dark); padding:2px 10px; border-radius:20px; font-size:0.75rem; }
        .view-all { color:var(--green-light); text-decoration:none; margin-top:20px; display:inline-block; }
        footer { text-align:center; padding:20px; color:rgba(255,255,255,0.5); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><span class="emerald-text">Market</span><span class="blue-text">Hub</span></div>
        <div class="nav-links" id="navLinks">
            <!-- سيتم ملؤها حسب الحالة -->
        </div>
    </nav>

    <div class="main-container">
        <!-- قسم البحث -->
        <div class="search-section">
            <h2>🔍 ابحث عن منتج أو متجر</h2>
            <form class="search-form" id="searchForm">
                <div class="search-field">
                    <label for="keyword">كلمة مفتاحية</label>
                    <input type="text" id="keyword" placeholder="اسم المنتج أو المتجر...">
                </div>
                <button type="submit" class="btn-search">بحث</button>
            </form>
        </div>

        <!-- أزرار سريعة -->
        <div class="quick-actions" id="quickActions">
            <!-- تُملأ حسب الحالة -->
        </div>

        <!-- العروض المميزة -->
        <div class="featured-section">
            <h2>🔥 عروض مميزة</h2>
            <div class="featured-grid" id="featuredGrid"></div>
            <a href="offers.html" class="view-all">عرض الكل ←</a>
        </div>
    </div>

    <footer>© 2025 MarketHub</footer>

    <script>
        // ---------- التحقق من حالة المستخدم ----------
        let currentUser = null; // سيحتوي على بيانات المستخدم أو null للزائر

        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/me', { credentials: 'include' });
                if (res.ok) {
                    currentUser = await res.json();
                } else {
                    currentUser = null; // زائر
                }
            } catch (err) {
                currentUser = null;
            }
            updateUI();
        }

        // ---------- تحديث واجهة المستخدم بناءً على الدور ----------
        function updateUI() {
            const navLinks = document.getElementById('navLinks');
            const quickActions = document.getElementById('quickActions');

            if (currentUser && (currentUser.role === 'seller' || currentUser.role === 'admin')) {
                // ********** واجهة البائع / الأدمن **********
                navLinks.innerHTML = `
                    <a href="dashboard.html">الرئيسية</a>
                    <a href="offers.html">العروض</a>
                    <a href="create-offer.html">إضافة منتج</a>
                    <a href="profile.html">ملفي</a>
                    <button id="logoutBtn" class="btn-outline-light">تسجيل خروج</button>
                `;
                quickActions.innerHTML = `
                    <a href="create-offer.html" class="action-card">
                        <div class="icon">➕</div><div class="title">إضافة منتج جديد</div>
                    </a>
                    <a href="offers.html" class="action-card">
                        <div class="icon">⭐</div><div class="title">العروض المميزة</div>
                    </a>
                    <a href="profile.html" class="action-card">
                        <div class="icon">👤</div><div class="title">ملفي الشخصي</div>
                    </a>
                `;
                // ربط زر الخروج
                document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                    e.preventDefault();
                    await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                    window.location.reload();
                });
            } else {
                // ********** واجهة الزائر **********
                navLinks.innerHTML = `
                    <a href="dashboard.html">الرئيسية</a>
                    <a href="offers.html">العروض</a>
                    <a href="login.html" class="btn-outline-light">تسجيل الدخول</a>
                `;
                quickActions.innerHTML = `
                    <a href="offers.html" class="action-card">
                        <div class="icon">⭐</div><div class="title">العروض المميزة</div>
                    </a>
                    <a href="login.html" class="action-card">
                        <div class="icon">🔑</div><div class="title">تسجيل الدخول للبيع</div>
                    </a>
                `;
            }
        }

        // ---------- تحميل العروض المميزة ----------
        async function loadFeatured() {
            try {
                const res = await fetch('/api/featured');
                if (res.ok) {
                    const data = await res.json();
                    const grid = document.getElementById('featuredGrid');
                    if (data.length === 0) {
                        grid.innerHTML = '<p>لا توجد عروض مميزة حالياً</p>';
                        return;
                    }
                    grid.innerHTML = data.map(item => `
                        <div class="product-card">
                            <img src="${item.image || 'https://via.placeholder.com/300x200/059669/white?text=No+Image'}" alt="${item.name}">
                            <div class="info">
                                <span class="badge">مميز</span>
                                <h3>${item.name}</h3>
                                <p>${item.store_name || ''}</p>
                                <p class="price">${item.price}$</p>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error(err);
            }
        }

        // ---------- البحث ----------
        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const keyword = document.getElementById('keyword').value.trim();
            if (keyword) {
                window.location.href = `offers.html?search=${encodeURIComponent(keyword)}`;
            }
        });

        // ---------- بدء التشغيل ----------
        checkAuth().then(loadFeatured);
    </script>
</body>
</html>
