<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - سلة</title>
    <style>
        :root {
            --primary-red: #b22222;
            --primary-light-red: #dc3545;
            --primary-yellow: #f4b400;
            --primary-light-yellow: #ffcc00;
            --bg-dark: #1c1c1c;
            --bg-card: #262626;
            --text: #f5f5f5;
            --text-muted: #bbbbbb;
            --border: #404040;
            --radius: 16px;
            --input-bg: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #2d1a1a 0%, #0f0a0a 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* شريط علوي */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--primary-yellow);
            padding: 0 20px;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--primary-yellow);
            font-size: 2rem;
            font-weight: 800;
        }
        .logo .basket-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 8px var(--primary-yellow));
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-links a, .nav-links button {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 30px;
            transition: 0.3s;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
        }
        .nav-links a:hover, .nav-links button:hover {
            background: rgba(244,180,0,0.1);
            color: var(--primary-yellow);
        }
        .btn-logout {
            background: transparent;
            border: 2px solid var(--primary-yellow);
            color: var(--primary-yellow);
            padding: 8px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-logout:hover { background: var(--primary-yellow); color: #000; }
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--primary-yellow);
            font-size: 2rem;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px; left: 0; right: 0;
                background: #1a1a1a;
                border-bottom: 2px solid var(--primary-yellow);
                padding: 20px; gap: 15px;
            }
            .nav-links.show { display: flex; }
            .menu-toggle { display: block; }
        }

        /* المحتوى الرئيسي */
        .main-container {
            flex: 1;
            padding: 30px 20px;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }

        /* قسم البحث */
        .search-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border-top: 4px solid var(--primary-yellow);
        }
        .search-section h2 {
            color: var(--primary-yellow);
            margin-bottom: 15px;
        }
        .search-form {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .search-field {
            flex: 1 1 200px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .search-field label {
            color: var(--text-muted);
            font-weight: 500;
        }
        .search-field input {
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }
        .search-field input:focus { border-color: var(--primary-yellow); }
        .btn-search {
            padding: 12px 30px;
            background: var(--primary-red);
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            align-self: flex-end;
        }
        .btn-search:hover { background: var(--primary-light-red); }

        /* أزرار سريعة */
        .quick-actions {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .action-card {
            flex: 1 1 200px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            text-align: center;
            color: var(--text);
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border-top: 3px solid var(--primary-yellow);
        }
        .action-card:hover {
            background: rgba(244,180,0,0.1);
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(244,180,0,0.2);
        }
        .action-card .icon { font-size: 2.5rem; margin-bottom: 10px; }
        .action-card .title { font-weight: 600; font-size: 1.1rem; }

        /* العروض المميزة */
        .featured-section h2 {
            font-size: 1.8rem;
            color: var(--primary-yellow);
            margin-bottom: 20px;
        }
        .featured-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            margin-bottom: 20px;
        }
        .product-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .product-card:hover {
            border-color: var(--primary-yellow);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(244,180,0,0.2);
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #111;
        }
        .product-card .info { padding: 15px; }
        .product-card .info h3 { margin-bottom: 5px; color: var(--text); }
        .product-card .price {
            color: var(--primary-yellow);
            font-weight: bold;
            font-size: 1.2rem;
        }
        .badge {
            background: var(--primary-red);
            color: white;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .view-all {
            display: inline-block;
            margin-top: 15px;
            color: var(--primary-yellow);
            text-decoration: none;
            font-weight: 600;
        }
        .view-all:hover { text-decoration: underline; }

        /* رسالة الباقة */
        .package-alert {
            background: rgba(244,180,0,0.1);
            border: 1px solid var(--primary-yellow);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
            color: var(--primary-yellow);
        }
        .package-alert a { color: var(--primary-light-yellow); font-weight: bold; }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: auto;
        }
    </style>
</head>
<body>
    <!-- شريط التنقل -->
    <nav class="navbar">
        <a href="dashboard.html" class="logo">
            <span class="basket-icon">🧺</span>
            <span>سلة</span>
        </a>
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="nav-links" id="navLinks">
            <!-- تُملأ ديناميكياً -->
        </div>
    </nav>

    <div class="main-container">
        <!-- تنبيه الباقة (للبائع) -->
        <div id="packageAlert" class="package-alert" style="display:none;"></div>

        <!-- قسم البحث -->
        <div class="search-section">
            <h2>🔍 ابحث عن منتج أو متجر</h2>
            <form class="search-form" id="searchForm">
                <div class="search-field">
                    <label for="keyword">كلمة مفتاحية</label>
                    <input type="text" id="keyword" placeholder="اسم المنتج أو المتجر...">
                </div>
                <div class="search-field">
                    <label for="location">الموقع</label>
                    <input type="text" id="location" placeholder="المدينة أو المنطقة...">
                </div>
                <div class="search-field">
                    <label for="radius">نطاق البحث (كم)</label>
                    <input type="number" id="radius" placeholder="مثلاً 50" min="1">
                </div>
                <button type="submit" class="btn-search">بحث</button>
            </form>
        </div>

        <!-- أزرار سريعة -->
        <div class="quick-actions" id="quickActions">
            <!-- تُملأ حسب الصلاحية -->
        </div>

        <!-- العروض المميزة -->
        <div class="featured-section">
            <h2>🔥 عروض مميزة</h2>
            <div class="featured-grid" id="featuredGrid"></div>
            <a href="offers.html" class="view-all">عرض الكل ←</a>
        </div>
    </div>

    <footer>© 2025 سلة - جميع الحقوق محفوظة</footer>

    <script>
        let currentUser = null;

        // التحقق من حالة المستخدم
        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/me', { credentials: 'include' });
                if (res.ok) {
                    currentUser = await res.json();
                } else {
                    currentUser = null;
                }
            } catch (err) {
                currentUser = null;
            }
            updateUI();
        }

        // تحديث واجهة المستخدم حسب الدور
        function updateUI() {
            const navLinks = document.getElementById('navLinks');
            const quickActions = document.getElementById('quickActions');
            const packageAlert = document.getElementById('packageAlert');

            if (currentUser && (currentUser.role === 'seller' || currentUser.role === 'admin')) {
                // بائع / أدمن
                navLinks.innerHTML = `
                    <a href="dashboard.html">الرئيسية</a>
                    <a href="offers.html">العروض</a>
                    <a href="create-offer.html">إضافة منتج</a>
                    <a href="profile.html">ملفي</a>
                    <button id="logoutBtn" class="btn-logout">تسجيل خروج</button>
                `;
                quickActions.innerHTML = `
                    <a href="create-offer.html" class="action-card">
                        <div class="icon">➕</div><div class="title">إضافة منتج جديد</div>
                    </a>
                    <a href="offers.html" class="action-card">
                        <div class="icon">⭐</div><div class="title">العروض المميزة</div>
                    </a>
                    <a href="profile.html" class="action-card">
                        <div class="icon">👤</div><div class="title">ملفي الشخصي</div>
                    </a>
                    <a href="upgrade.html" class="action-card">
                        <div class="icon">⬆️</div><div class="title">ترقية الباقة</div>
                    </a>
                `;
                document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                    e.preventDefault();
                    await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                    window.location.href = 'index.html';
                });

                // عرض تنبيه الباقة إذا كان البائع قريباً من الحد
                const current = currentUser.currentProducts || 0;
                const max = currentUser.maxProducts || 20;
                const remaining = Math.max(0, max - current);
                if (remaining <= 5) {
                    packageAlert.style.display = 'block';
                    packageAlert.innerHTML = `⚠️ تنبيه: أنت على وشك الوصول للحد الأقصى من المنتجات (${current}/${max}). <a href="upgrade.html">ترقية الباقة</a>`;
                } else {
                    packageAlert.style.display = 'none';
                }
            } else {
                // زائر
                navLinks.innerHTML = `
                    <a href="dashboard.html">الرئيسية</a>
                    <a href="offers.html">العروض</a>
                    <a href="login.html" class="btn-logout" style="background:transparent; color:var(--primary-yellow);">تسجيل الدخول</a>
                `;
                quickActions.innerHTML = `
                    <a href="offers.html" class="action-card">
                        <div class="icon">⭐</div><div class="title">العروض المميزة</div>
                    </a>
                    <a href="login.html" class="action-card">
                        <div class="icon">🔑</div><div class="title">تسجيل الدخول للبيع</div>
                    </a>
                `;
                packageAlert.style.display = 'none';
            }
        }

        // تحميل العروض المميزة
        async function loadFeatured() {
            try {
                const res = await fetch('/api/featured');
                const data = await res.json();
                const grid = document.getElementById('featuredGrid');
                const products = data.products || [];

                if (products.length === 0) {
                    grid.innerHTML = '<p style="color:var(--text-muted);">لا توجد عروض مميزة حالياً</p>';
                    return;
                }
                grid.innerHTML = products.map(p => `
                    <div class="product-card">
                        <img src="${p.image || 'https://via.placeholder.com/300x200/1c1c1c/f4b400?text=🧺+سلة'}" alt="${p.name}">
                        <div class="info">
                            <span class="badge">مميز</span>
                            <h3>${p.name}</h3>
                            <p style="color:var(--text-muted);">${p.store_name || ''}</p>
                            <p class="price">${p.price}$</p>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('خطأ في تحميل العروض:', err);
            }
        }

        // البحث
        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const keyword = document.getElementById('keyword').value.trim();
            if (keyword) {
                window.location.href = `offers.html?search=${encodeURIComponent(keyword)}`;
            }
        });

        // زر القائمة للجوال
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('navLinks').classList.toggle('show');
        });

        // بدء التشغيل
        checkAuth().then(loadFeatured);
    </script>
</body>
</html>
