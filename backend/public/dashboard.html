<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - سلة</title>
    <style>
        :root {
            --bg-dark: #0d0d0d;
            --bg-card: #1a1a1a;
            --gold: #d4af37;
            --gold-light: #f1c40f;
            --text: #e0e0e0;
            --text-muted: #aaaaaa;
            --border: #333;
            --radius: 16px;
            --input-bg: #222;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* الشريط العلوي */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--gold);
            padding: 15px 30px;
        }
        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo .basket-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 6px var(--gold-light));
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-links a, .nav-links button {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 30px;
            transition: 0.3s;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
        }
        .nav-links a:hover, .nav-links button:hover { color: var(--gold); background: rgba(212,175,55,0.1); }
        .btn-outline-light {
            border: 1px solid var(--gold);
            color: var(--gold);
            background: transparent;
            padding: 8px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-outline-light:hover { background: var(--gold); color: #000; }

        .main-container {
            flex: 1;
            padding: 30px 20px;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }

        /* قسم البحث */
        .search-section {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .search-section h2 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: var(--gold);
        }
        .search-form {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .search-field {
            flex: 1 1 200px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .search-field label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .search-field input {
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }
        .search-field input:focus { border-color: var(--gold); }
        .btn-search {
            padding: 12px 30px;
            background: var(--gold);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(212,175,55,0.3);
        }
        .btn-search:hover { background: var(--gold-light); }

        /* أزرار سريعة */
        .quick-actions {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .action-card {
            flex: 1 1 200px;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            color: var(--text);
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .action-card:hover {
            background: rgba(212,175,55,0.1);
            border-color: var(--gold);
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(212,175,55,0.2);
        }
        .action-card .icon { font-size: 2.5rem; margin-bottom: 10px; }
        .action-card .title { font-weight: 600; font-size: 1.1rem; }

        /* العروض المميزة */
        .featured-section h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--gold);
        }
        .featured-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 20px;
        }
        .product-card {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .product-card:hover {
            border-color: var(--gold);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(212,175,55,0.2);
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #111;
        }
        .product-card .info {
            padding: 15px;
        }
        .product-card .info h3 { margin-bottom: 5px; color: var(--text); }
        .product-card .price {
            color: var(--gold);
            font-weight: bold;
            font-size: 1.2rem;
        }
        .badge {
            background: var(--gold);
            color: #000;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .view-all {
            display: inline-block;
            margin-top: 15px;
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
        }
        .view-all:hover { text-decoration: underline; }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
        }

        @media (max-width: 600px) {
            .search-form { flex-direction: column; }
            .btn-search { width: 100%; text-align: center; }
            .navbar { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <!-- الشريط العلوي -->
    <nav class="navbar">
        <a href="dashboard.html" class="logo">
            <span class="basket-icon">🧺</span>
            <span>سلة</span>
        </a>
        <div class="nav-links" id="navLinks">
            <!-- تُملأ ديناميكياً حسب الحالة -->
        </div>
    </nav>

    <div class="main-container">
        <!-- قسم البحث -->
        <div class="search-section">
            <h2>🔍 ابحث عن منتج أو متجر</h2>
            <form class="search-form" id="searchForm">
                <div class="search-field">
                    <label for="keyword">كلمة مفتاحية</label>
                    <input type="text" id="keyword" placeholder="اسم المنتج أو المتجر...">
                </div>
                <div class="search-field">
                    <label for="location">الموقع</label>
                    <input type="text" id="location" placeholder="المدينة أو المنطقة...">
                </div>
                <div class="search-field">
                    <label for="radius">نطاق البحث (كم)</label>
                    <input type="number" id="radius" placeholder="مثلاً 50" min="1">
                </div>
                <button type="submit" class="btn-search">بحث</button>
            </form>
        </div>

        <!-- أزرار سريعة -->
        <div class="quick-actions" id="quickActions">
            <!-- تُملأ حسب الصلاحية -->
        </div>

        <!-- العروض المميزة -->
        <div class="featured-section">
            <h2>🔥 عروض مميزة</h2>
            <div class="featured-grid" id="featuredGrid"></div>
            <a href="offers.html" class="view-all">عرض الكل ←</a>
        </div>
    </div>

    <footer>© 2025 سلة - جميع الحقوق محفوظة</footer>

    <script>
        let currentUser = null;

        // التحقق من حالة المستخدم
        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/me', { credentials: 'include' });
                if (res.ok) {
                    currentUser = await res.json();
                } else {
                    currentUser = null;
                }
            } catch (err) {
                currentUser = null;
            }
            updateUI();
        }

        // تحديث الواجهة حسب الدور
        function updateUI() {
            const navLinks = document.getElementById('navLinks');
            const quickActions = document.getElementById('quickActions');

            if (currentUser && (currentUser.role === 'seller' || currentUser.role === 'admin')) {
                // بائع / أدمن
                navLinks.innerHTML = `
                    <a href="dashboard.html">الرئيسية</a>
                    <a href="offers.html">العروض</a>
                    <a href="create-offer.html">إضافة منتج</a>
                    <a href="profile.html">ملفي</a>
                    <button id="logoutBtn" class="btn-outline-light">تسجيل خروج</button>
                `;
                quickActions.innerHTML = `
                    <a href="create-offer.html" class="action-card">
                        <div class="icon">➕</div><div class="title">إضافة منتج جديد</div>
                    </a>
                    <a href="offers.html" class="action-card">
                        <div class="icon">⭐</div><div class="title">العروض المميزة</div>
                    </a>
                    <a href="profile.html" class="action-card">
                        <div class="icon">👤</div><div class="title">ملفي الشخصي</div>
                    </a>
                `;
                document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                    e.preventDefault();
                    await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                    window.location.href = 'index.html';
                });
            } else {
                // زائر
                navLinks.innerHTML = `
                    <a href="dashboard.html">الرئيسية</a>
                    <a href="offers.html">العروض</a>
                    <a href="login.html" class="btn-outline-light">تسجيل الدخول</a>
                `;
                quickActions.innerHTML = `
                    <a href="offers.html" class="action-card">
                        <div class="icon">⭐</div><div class="title">العروض المميزة</div>
                    </a>
                    <a href="login.html" class="action-card">
                        <div class="icon">🔑</div><div class="title">تسجيل الدخول للبيع</div>
                    </a>
                `;
            }
        }

        // تحميل العروض المميزة
        async function loadFeatured() {
            try {
                const res = await fetch('/api/featured');
                const data = await res.json();
                const grid = document.getElementById('featuredGrid');
                const products = data.products || [];

                if (products.length === 0) {
                    grid.innerHTML = '<p style="color:var(--text-muted);">لا توجد عروض مميزة حالياً</p>';
                    return;
                }
                grid.innerHTML = products.map(p => `
                    <div class="product-card">
                        <img src="${p.image || 'https://via.placeholder.com/300x200/1a1a1a/d4af37?text=🧺+سلة'}" alt="${p.name}">
                        <div class="info">
                            <span class="badge">مميز</span>
                            <h3>${p.name}</h3>
                            <p style="color:var(--text-muted);">${p.store_name || ''}</p>
                            <p class="price">${p.price}$</p>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('خطأ في تحميل العروض:', err);
            }
        }

        // البحث
        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const keyword = document.getElementById('keyword').value.trim();
            if (keyword) {
                window.location.href = `offers.html?search=${encodeURIComponent(keyword)}`;
            }
        });

        // بدء التشغيل
        checkAuth().then(loadFeatured);
    </script>
</body>
</html>
