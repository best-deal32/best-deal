<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>استعادة كلمة المرور | Vivor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&display=swap');
        
        :root {
            --bg-deep: #040b14;
            --bg-card: #071426;
            --blue-mid: #1a3a6b;
            --blue-light: #2a5298;
            --blue-accent: #3b6cc2;
            --text-primary: #e0e6f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: radial-gradient(ellipse at top, #0a1628 0%, var(--bg-deep) 70%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
            position: relative;
        }

        .bg-glow-1 {
            position: absolute;
            top: -130px;
            left: -130px;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(59, 108, 194, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
        }
        .bg-glow-2 {
            position: absolute;
            bottom: -130px;
            right: -130px;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(42, 82, 152, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
        }

        .forgot-card {
            background: rgba(11, 31, 59, 0.85);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(59, 108, 194, 0.3);
            border-radius: 3rem;
            width: 100%;
            max-width: 500px;
            padding: 2.8rem 2.2rem;
            position: relative;
            z-index: 10;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.7s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dragon-icon-large {
            display: block;
            font-size: 4rem;
            color: var(--blue-accent);
            filter: drop-shadow(0 0 20px rgba(59, 108, 194, 0.6));
            text-align: center;
            margin-bottom: 0.3rem;
        }

        .forgot-title {
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 0.3rem;
        }

        .forgot-subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .step {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .step.active-step {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 1.8rem;
        }

        .input-label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: #93b4f5;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--blue-accent);
            font-size: 1.1rem;
        }

        .input-field {
            width: 100%;
            padding: 1rem 3rem 1rem 1.5rem;
            background: rgba(4, 11, 20, 0.7);
            border: 1.5px solid rgba(59, 108, 194, 0.3);
            border-radius: 1.2rem;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-field:focus {
            border-color: var(--blue-accent);
            background: rgba(7, 20, 38, 0.8);
            box-shadow: 0 0 15px rgba(59, 108, 194, 0.2);
        }

        .action-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--blue-mid) 0%, var(--blue-light) 100%);
            border: none;
            border-radius: 1.2rem;
            color: #fff;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 0.3rem;
            box-shadow: 0 10px 25px rgba(26, 58, 107, 0.5);
        }

        .action-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #204080 0%, #3265b0 100%);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(42, 82, 152, 0.6);
        }

        .action-btn:disabled {
            background: #1e2a3a;
            color: #556;
            cursor: not-allowed;
        }

        .action-btn.secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(59,108,194,0.3);
            box-shadow: none;
            margin-top: 0.8rem;
        }

        .action-btn.secondary:hover:not(:disabled) {
            background: rgba(59,108,194,0.1);
        }

        .back-link {
            display: inline-block;
            margin-top: 1.8rem;
            color: var(--blue-accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 2rem;
            background: rgba(11, 31, 59, 0.6);
            border-radius: 3rem;
            padding: 0.3rem;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid rgba(59, 108, 194, 0.25);
        }

        .lang-option {
            padding: 0.4rem 0.9rem;
            border-radius: 3rem;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            color: #99a8c0;
        }

        .lang-option.active {
            background: linear-gradient(135deg, var(--blue-mid), var(--blue-light));
            color: #fff;
        }

        .lang-option:hover:not(.active) {
            background: rgba(42, 82, 152, 0.2);
            color: #fff;
        }

        @media (max-width: 500px) {
            .forgot-card {
                padding: 2.2rem 1.5rem;
                border-radius: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="forgot-card">
        <div class="dragon-icon-large">
            <i class="fa-solid fa-dragon"></i>
        </div>
        <h1 class="forgot-title">VIVOR</h1>
        <p class="forgot-subtitle">استعادة كلمة المرور – سنرسل لك رابطاً لإعادة التعيين</p>

        <!-- الخطوة الأولى: إدخال البريد الإلكتروني -->
        <div id="step1" class="step active-step">
            <div class="input-group">
                <label class="input-label">البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="reset-email" class="input-field" placeholder="أدخل بريدك الإلكتروني" required>
                </div>
            </div>
            <button id="sendResetLinkBtn" class="action-btn">
                <i class="fa-solid fa-paper-plane"></i> إرسال رابط إعادة التعيين
            </button>
        </div>

        <!-- الخطوة الثانية: إدخال الرمز وكلمة المرور الجديدة -->
        <div id="step2" class="step">
            <div class="input-group">
                <label class="input-label">رمز إعادة التعيين</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="text" id="reset-token" class="input-field" placeholder="الرمز الذي وصلك" required>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">كلمة المرور الجديدة</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="new-password" class="input-field" placeholder="••••••••" required>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">تأكيد كلمة المرور الجديدة</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-check-circle"></i>
                    <input type="password" id="confirm-password" class="input-field" placeholder="••••••••" required>
                </div>
            </div>
            <button id="resetPasswordBtn" class="action-btn">
                <i class="fa-solid fa-rotate-right"></i> تغيير كلمة المرور
            </button>
            <button id="backToStep1Btn" class="action-btn secondary">
                <i class="fa-solid fa-arrow-right"></i> العودة للبريد الإلكتروني
            </button>
        </div>

        <a href="login.html" class="back-link">
            <i class="fa-solid fa-arrow-right ml-1"></i> العودة إلى تسجيل الدخول
        </a>

        <div class="lang-selector">
            <div class="lang-option active" data-lang="ar">العربية</div>
            <div class="lang-option" data-lang="en">English</div>
            <div class="lang-option" data-lang="zh">中文</div>
            <div class="lang-option" data-lang="de">Deutsch</div>
        </div>
    </div>

    <script>
        // ============================================================
        // الإعدادات العامة - استخدام المسارات النسبية
        // ============================================================
        const API_BASE_URL = '';
        const URL_FORGOT_PASSWORD = `${API_BASE_URL}/api/auth/forgot-password`;
        const URL_RESET_PASSWORD = `${API_BASE_URL}/api/auth/reset-password`;

        let socket = null;

        // ============================================================
        // نظام الترجمة متعدد اللغات (i18n)
        // ============================================================
        let currentLang = localStorage.getItem('preferredLanguage') || 'ar';
        const translations = {};

        async function loadTranslations(lang) {
            try {
                const response = await fetch(`/locales/${lang}/translation.json`);
                if (!response.ok) throw new Error();
                const data = await response.json();
                translations[lang] = data;
                return data;
            } catch (err) {
                console.warn(`Failed to load translations for ${lang}, falling back to ar`);
                if (lang !== 'ar') return loadTranslations('ar');
                return {};
            }
        }

        function applyTranslations(lang) {
            const t = translations[lang];
            if (!t) return;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.textContent = t[key];
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) {
                    el.placeholder = t[key];
                }
            });
            const htmlEl = document.documentElement;
            if (lang === 'ar') {
                htmlEl.setAttribute('dir', 'rtl');
                htmlEl.setAttribute('lang', 'ar');
            } else {
                htmlEl.setAttribute('dir', 'ltr');
                htmlEl.setAttribute('lang', lang);
            }
            localStorage.setItem('preferredLanguage', lang);
            currentLang = lang;
            document.querySelectorAll('.lang-option').forEach(opt => {
                if (opt.getAttribute('data-lang') === lang) opt.classList.add('active');
                else opt.classList.remove('active');
            });
            document.cookie = `i18n=${lang}; path=/; max-age=31536000`;
        }

        async function setLanguage(lang) {
            if (!translations[lang]) await loadTranslations(lang);
            applyTranslations(lang);
        }

        document.querySelectorAll('.lang-option').forEach(opt => {
            opt.addEventListener('click', async () => {
                const lang = opt.getAttribute('data-lang');
                if (lang === currentLang) return;
                await setLanguage(lang);
            });
        });

        // ============================================================
        // WebSocket (لتوافق النظام)
        // ============================================================
        function initSocket() {
            if (!socket) {
                socket = io(window.location.origin, { withCredentials: true });
                socket.on('connect', () => {
                    console.log('Socket connected on forgot-password page');
                });
                socket.on('notification', (data) => {
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: data.type || 'info',
                        title: data.title,
                        text: data.message,
                        showConfirmButton: false,
                        timer: 5000,
                        background: '#071426',
                        color: '#fff'
                    });
                });
            }
        }

        // ============================================================
        // دوال التحكم بالخطوات
        // ============================================================
        const sendBtn = document.getElementById('sendResetLinkBtn');
        const emailInput = document.getElementById('reset-email');
        const step1Div = document.getElementById('step1');
        const step2Div = document.getElementById('step2');
        let pendingEmail = null;

        // استخراج التوكن من الرابط إن وجد
        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('token');
        if (urlToken) {
            document.getElementById('reset-token').value = urlToken;
            step1Div.classList.remove('active-step');
            step2Div.classList.add('active-step');
        }

        sendBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            if (!email) {
                Swal.fire({
                    icon: 'warning',
                    title: translations[currentLang]?.warning || 'تنبيه',
                    text: translations[currentLang]?.email_required || 'يرجى إدخال بريدك الإلكتروني',
                    background: '#071426',
                    color: '#fff',
                    confirmButtonColor: '#3b6cc2'
                });
                return;
            }

            sendBtn.disabled = true;
            const originalText = sendBtn.innerHTML;
            sendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الإرسال...';

            try {
                const response = await fetch(URL_FORGOT_PASSWORD, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                    credentials: 'include'
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    pendingEmail = email;
                    step1Div.classList.remove('active-step');
                    step2Div.classList.add('active-step');
                    Swal.fire({
                        icon: 'success',
                        title: translations[currentLang]?.success || 'تم الإرسال',
                        text: data.message || (translations[currentLang]?.reset_link_sent || 'تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني'),
                        background: '#071426',
                        color: '#fff',
                        confirmButtonColor: '#3b6cc2'
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: translations[currentLang]?.error || 'فشل الإرسال',
                        text: data.message || (translations[currentLang]?.reset_link_failed || 'لم نتمكن من إرسال الرابط، يرجى التأكد من صحة البريد'),
                        background: '#071426',
                        color: '#fff',
                        confirmButtonColor: '#3b6cc2'
                    });
                }
            } catch (err) {
                console.error(err);
                Swal.fire({
                    icon: 'error',
                    title: translations[currentLang]?.connection_error_title || 'خطأ في الاتصال',
                    text: translations[currentLang]?.connection_error || 'فشل الاتصال بالخادم، يرجى المحاولة لاحقاً',
                    background: '#071426',
                    color: '#fff',
                    confirmButtonColor: '#3b6cc2'
                });
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = originalText;
            }
        });

        // ============================================================
        // إعادة تعيين كلمة المرور (الخطوة الثانية)
        // ============================================================
        const resetBtn = document.getElementById('resetPasswordBtn');
        const tokenInput = document.getElementById('reset-token');
        const newPassInput = document.getElementById('new-password');
        const confirmPassInput = document.getElementById('confirm-password');
        const backToStep1Btn = document.getElementById('backToStep1Btn');

        resetBtn.addEventListener('click', async () => {
            const token = tokenInput.value.trim();
            const newPassword = newPassInput.value;
            const confirmPassword = confirmPassInput.value;

            if (!token) {
                Swal.fire('خطأ', translations[currentLang]?.token_required || 'الرمز مطلوب', 'error');
                return;
            }
            if (!newPassword || !confirmPassword) {
                Swal.fire('خطأ', translations[currentLang]?.password_required || 'كلمة المرور الجديدة وتأكيدها مطلوبة', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                Swal.fire('خطأ', translations[currentLang]?.passwords_not_match || 'كلمتا المرور غير متطابقتين', 'error');
                return;
            }
            if (newPassword.length < 6) {
                Swal.fire('خطأ', translations[currentLang]?.password_too_short || 'كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                return;
            }

            resetBtn.disabled = true;
            const originalText = resetBtn.innerHTML;
            resetBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التغيير...';

            try {
                const response = await fetch(URL_RESET_PASSWORD, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword }),
                    credentials: 'include'
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: translations[currentLang]?.reset_success_title || 'تم التغيير',
                        text: data.message || (translations[currentLang]?.reset_success_message || 'تم تغيير كلمة المرور بنجاح، يمكنك تسجيل الدخول الآن'),
                        background: '#071426',
                        color: '#fff',
                        confirmButtonColor: '#3b6cc2'
                    }).then(() => {
                        window.location.href = 'login.html';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: translations[currentLang]?.reset_failed_title || 'فشل',
                        text: data.message || (translations[currentLang]?.reset_failed_message || 'الرمز غير صالح أو منتهي الصلاحية'),
                        background: '#071426',
                        color: '#fff',
                        confirmButtonColor: '#3b6cc2'
                    });
                }
            } catch (err) {
                console.error(err);
                Swal.fire({
                    icon: 'error',
                    title: translations[currentLang]?.connection_error_title || 'خطأ',
                    text: translations[currentLang]?.connection_error || 'فشل الاتصال بالسيرفر',
                    background: '#071426',
                    color: '#fff',
                    confirmButtonColor: '#3b6cc2'
                });
            } finally {
                resetBtn.disabled = false;
                resetBtn.innerHTML = originalText;
            }
        });

        backToStep1Btn.addEventListener('click', () => {
            step2Div.classList.remove('active-step');
            step1Div.classList.add('active-step');
            tokenInput.value = '';
            newPassInput.value = '';
            confirmPassInput.value = '';
        });

        // ============================================================
        // التحميل الأولي للترجمات
        // ============================================================
        window.onload = async () => {
            await loadTranslations(currentLang);
            applyTranslations(currentLang);
            initSocket();
        };
    </script>
</body>
</html>
