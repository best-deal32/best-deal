<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>استعادة كلمة المرور | Fargo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&display=swap');
        
        :root {
            --bg-deep: #040b14;
            --red-dark: #800000;
            --red-mid: #a00000;
            --red-light: #c00000;
            --red-accent: #ff3333;
            --text-primary: #e0e6f0;
            --text-dim: #99a8c0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: radial-gradient(ellipse at top, #1a0000 0%, var(--bg-deep) 70%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
            position: relative;
        }

        .bg-glow-1 {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 51, 51, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        .bg-glow-2 {
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(192, 0, 0, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        .forgot-card {
            background: rgba(20, 5, 5, 0.85);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 51, 51, 0.3);
            border-radius: 3rem;
            width: 100%;
            max-width: 500px;
            padding: 3rem 2.5rem;
            position: relative;
            z-index: 10;
            box-shadow: 0 35px 65px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.7s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shield-icon {
            display: block;
            font-size: 4rem;
            color: var(--red-accent);
            filter: drop-shadow(0 0 18px rgba(255, 51, 51, 0.5));
            text-align: center;
            margin-bottom: 0.3rem;
        }

        .forgot-title {
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
            color: #fff;
            margin-bottom: 0.3rem;
        }

        .forgot-subtitle {
            color: #ff9999;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .step {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .step.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 1.8rem;
        }

        .input-label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: #ff9999;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--red-accent);
            font-size: 1.1rem;
        }

        .input-field {
            width: 100%;
            padding: 1rem 3rem 1rem 1.5rem;
            background: rgba(4, 11, 20, 0.7);
            border: 1.5px solid rgba(255, 51, 51, 0.35);
            border-radius: 1.2rem;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-field:focus {
            border-color: var(--red-accent);
            box-shadow: 0 0 18px rgba(255, 51, 51, 0.25);
        }

        .btn-red {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, var(--red-mid) 0%, var(--red-light) 100%);
            border: none;
            border-radius: 1.2rem;
            color: #fff;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 0.5rem;
            box-shadow: 0 10px 25px rgba(160, 0, 0, 0.5);
        }

        .btn-red:hover:not(:disabled) {
            background: linear-gradient(135deg, #880000 0%, #b00000 100%);
            transform: translateY(-2px);
        }

        .btn-red:disabled {
            background: #1e2a3a;
            color: #5a6a7a;
            cursor: not-allowed;
        }

        .btn-outline-red {
            width: 100%;
            padding: 0.9rem;
            background: transparent;
            border: 1.5px solid var(--red-accent);
            color: var(--red-accent);
            font-weight: 700;
            border-radius: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.8rem;
        }

        .btn-outline-red:hover {
            background: rgba(255, 51, 51, 0.1);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 2rem;
            color: var(--red-accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 2rem;
            background: rgba(20, 5, 5, 0.6);
            border-radius: 3rem;
            padding: 0.3rem;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid rgba(255, 51, 51, 0.3);
        }

        .lang-option {
            padding: 0.4rem 0.9rem;
            border-radius: 3rem;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            color: #99a8c0;
        }

        .lang-option.active {
            background: linear-gradient(135deg, var(--red-mid), var(--red-light));
            color: #fff;
        }

        @media (max-width: 500px) {
            .forgot-card {
                padding: 2.5rem 1.8rem;
                border-radius: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="forgot-card">
        <div class="shield-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="forgot-title">FARGO</h1>
        <p class="forgot-subtitle">استعادة كلمة المرور</p>

        <!-- الخطوة الأولى: إدخال البريد الإلكتروني -->
        <div id="step1" class="step active">
            <div class="input-group">
                <label class="input-label">البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="reset-email" class="input-field" placeholder="أدخل بريدك الإلكتروني" required>
                </div>
            </div>
            <button id="sendResetLinkBtn" class="btn-red">
                <i class="fa-solid fa-paper-plane"></i> إرسال رابط إعادة التعيين
            </button>
        </div>

        <!-- الخطوة الثانية: إدخال الرمز وكلمة المرور الجديدة -->
        <div id="step2" class="step">
            <div class="input-group">
                <label class="input-label">رمز إعادة التعيين</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="text" id="reset-token" class="input-field" placeholder="الرمز الذي وصلك" required>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">كلمة المرور الجديدة</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="new-password" class="input-field" placeholder="••••••••" required>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">تأكيد كلمة المرور</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-check-circle"></i>
                    <input type="password" id="confirm-password" class="input-field" placeholder="••••••••" required>
                </div>
            </div>
            <button id="resetPasswordBtn" class="btn-red">
                <i class="fa-solid fa-rotate-right"></i> تغيير كلمة المرور
            </button>
            <button id="backToStep1Btn" class="btn-outline-red">
                <i class="fa-solid fa-arrow-right"></i> العودة لإدخال البريد
            </button>
        </div>

        <a href="login.html" class="back-link">
            <i class="fa-solid fa-arrow-right ml-1"></i> العودة إلى تسجيل الدخول
        </a>

        <div class="lang-selector">
            <div class="lang-option active" data-lang="ar">العربية</div>
            <div class="lang-option" data-lang="en">English</div>
            <div class="lang-option" data-lang="zh">中文</div>
            <div class="lang-option" data-lang="de">Deutsch</div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '';
        const URL_FORGOT_PASSWORD = `${API_BASE_URL}/api/auth/forgot-password`;
        const URL_RESET_PASSWORD = `${API_BASE_URL}/api/auth/reset-password`;

        let socket = null;
        let currentLang = localStorage.getItem('preferredLanguage') || 'ar';
        const translations = {};

        // i18n
        async function loadTranslations(lang) {
            try {
                const response = await fetch(`/locales/${lang}/translation.json`);
                if (!response.ok) throw new Error();
                const data = await response.json();
                translations[lang] = data;
                return data;
            } catch (err) {
                console.warn(`Failed to load translations for ${lang}, falling back to ar`);
                if (lang !== 'ar') return loadTranslations('ar');
                return {};
            }
        }

        function applyTranslations(lang) {
            const t = translations[lang];
            if (!t) return;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
            const htmlEl = document.documentElement;
            if (lang === 'ar') {
                htmlEl.setAttribute('dir', 'rtl');
                htmlEl.setAttribute('lang', 'ar');
            } else {
                htmlEl.setAttribute('dir', 'ltr');
                htmlEl.setAttribute('lang', lang);
            }
            localStorage.setItem('preferredLanguage', lang);
            currentLang = lang;
            document.querySelectorAll('.lang-option').forEach(opt => {
                if (opt.getAttribute('data-lang') === lang) opt.classList.add('active');
                else opt.classList.remove('active');
            });
            document.cookie = `i18n=${lang}; path=/; max-age=31536000`;
        }

        async function setLanguage(lang) {
            if (!translations[lang]) await loadTranslations(lang);
            applyTranslations(lang);
        }

        document.querySelectorAll('.lang-option').forEach(opt => {
            opt.addEventListener('click', async () => {
                const lang = opt.getAttribute('data-lang');
                if (lang === currentLang) return;
                await setLanguage(lang);
            });
        });

        // WebSocket (لوجودها في الصفحات الأخرى)
        function initSocket() {
            if (!socket) {
                socket = io(window.location.origin, { withCredentials: true });
                socket.on('connect', () => console.log('Socket connected'));
            }
        }

        // التنقل بين الخطوات
        const step1Div = document.getElementById('step1');
        const step2Div = document.getElementById('step2');
        const sendBtn = document.getElementById('sendResetLinkBtn');
        const resetBtn = document.getElementById('resetPasswordBtn');
        const backBtn = document.getElementById('backToStep1Btn');

        // استخراج التوكن من الرابط إن وجد
        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('token');
        if (urlToken) {
            document.getElementById('reset-token').value = urlToken;
            step1Div.classList.remove('active');
            step2Div.classList.add('active');
        }

        // إرسال رابط إعادة التعيين
        sendBtn.addEventListener('click', async () => {
            const email = document.getElementById('reset-email').value.trim();
            if (!email) {
                Swal.fire({
                    icon: 'warning', title: 'تنبيه', text: 'يرجى إدخال بريدك الإلكتروني',
                    background: '#1a0000', color: '#fff', confirmButtonColor: '#ff3333'
                });
                return;
            }

            sendBtn.disabled = true;
            const originalText = sendBtn.innerHTML;
            sendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الإرسال...';

            try {
                const response = await fetch(URL_FORGOT_PASSWORD, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                    credentials: 'include'
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    step1Div.classList.remove('active');
                    step2Div.classList.add('active');
                    Swal.fire({
                        icon: 'success', title: 'تم الإرسال',
                        text: data.message || 'تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني',
                        background: '#1a0000', color: '#fff', confirmButtonColor: '#ff3333'
                    });
                } else {
                    Swal.fire({
                        icon: 'error', title: 'فشل الإرسال',
                        text: data.message || 'لم نتمكن من إرسال الرابط، تأكد من صحة البريد',
                        background: '#1a0000', color: '#fff', confirmButtonColor: '#ff3333'
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error', title: 'خطأ في الاتصال',
                    text: 'فشل الاتصال بالخادم، حاول لاحقاً',
                    background: '#1a0000', color: '#fff', confirmButtonColor: '#ff3333'
                });
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = originalText;
            }
        });

        // تغيير كلمة المرور
        resetBtn.addEventListener('click', async () => {
            const token = document.getElementById('reset-token').value.trim();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (!token) {
                Swal.fire({ icon: 'error', title: 'خطأ', text: 'الرمز مطلوب', background: '#1a0000', color: '#fff' });
                return;
            }
            if (!newPassword || !confirmPassword) {
                Swal.fire({ icon: 'error', title: 'خطأ', text: 'كلمة المرور وتأكيدها مطلوبان', background: '#1a0000', color: '#fff' });
                return;
            }
            if (newPassword !== confirmPassword) {
                Swal.fire({ icon: 'error', title: 'خطأ', text: 'كلمتا المرور غير متطابقتين', background: '#1a0000', color: '#fff' });
                return;
            }
            if (newPassword.length < 6) {
                Swal.fire({ icon: 'error', title: 'ضعيفة', text: 'كلمة المرور 6 أحرف على الأقل', background: '#1a0000', color: '#fff' });
                return;
            }

            resetBtn.disabled = true;
            const originalText = resetBtn.innerHTML;
            resetBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التغيير...';

            try {
                const response = await fetch(URL_RESET_PASSWORD, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword }),
                    credentials: 'include'
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    Swal.fire({
                        icon: 'success', title: 'تم التغيير',
                        text: data.message || 'تم تغيير كلمة المرور بنجاح، يمكنك تسجيل الدخول الآن',
                        background: '#1a0000', color: '#fff', confirmButtonColor: '#ff3333'
                    }).then(() => {
                        window.location.href = 'login.html';
                    });
                } else {
                    Swal.fire({
                        icon: 'error', title: 'فشل',
                        text: data.message || 'الرمز غير صالح أو منتهي الصلاحية',
                        background: '#1a0000', color: '#fff', confirmButtonColor: '#ff3333'
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error', title: 'خطأ',
                    text: 'فشل الاتصال بالسيرفر',
                    background: '#1a0000', color: '#fff', confirmButtonColor: '#ff3333'
                });
            } finally {
                resetBtn.disabled = false;
                resetBtn.innerHTML = originalText;
            }
        });

        // العودة للخطوة الأولى
        backBtn.addEventListener('click', () => {
            step2Div.classList.remove('active');
            step1Div.classList.add('active');
        });

        window.onload = async () => {
            await loadTranslations(currentLang);
            applyTranslations(currentLang);
            initSocket();
        };
    </script>
</body>
</html>
