<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترقية الباقة - سلة</title>
    <style>
        :root {
            --primary-red: #b22222;
            --primary-light-red: #dc3545;
            --primary-yellow: #f4b400;
            --primary-light-yellow: #ffcc00;
            --bg-dark: #1c1c1c;
            --bg-card: #262626;
            --text: #f5f5f5;
            --text-muted: #bbbbbb;
            --border: #404040;
            --radius: 16px;
            --input-bg: #333;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #2d1a1a 0%, #0f0a0a 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--primary-yellow);
            padding: 0 20px;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--primary-yellow);
            font-size: 2rem;
            font-weight: 800;
        }
        .logo .basket-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 8px var(--primary-yellow));
        }
        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 30px;
            transition: 0.3s;
        }
        .nav-links a:hover { background: rgba(244,180,0,0.1); color: var(--primary-yellow); }
        .btn-logout {
            background: transparent;
            border: 2px solid var(--primary-yellow);
            color: var(--primary-yellow);
            padding: 8px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-logout:hover { background: var(--primary-yellow); color: #000; }
        .menu-toggle { display:none; background:none; border:none; color:var(--primary-yellow); font-size:2rem; cursor:pointer; }
        @media (max-width: 768px) {
            .nav-links { display:none; flex-direction:column; position:absolute; top:70px; left:0; right:0; background:#1a1a1a; border-bottom:2px solid var(--primary-yellow); padding:20px; gap:15px; }
            .nav-links.show { display:flex; }
            .menu-toggle { display:block; }
        }

        .main-container {
            flex: 1;
            padding: 30px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .back-link { color:var(--primary-yellow); text-decoration:none; margin-bottom:20px; display:inline-block; font-weight:500; }
        .back-link:hover { text-decoration:underline; }
        h1 { font-size:2.2rem; color:var(--primary-yellow); margin-bottom:10px; }
        .page-desc { color:var(--text-muted); margin-bottom:30px; }

        /* شبكة الباقات */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        .package-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border-top: 4px solid var(--primary-yellow);
            transition: 0.3s;
        }
        .package-card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(244,180,0,0.2); }
        .package-card h2 {
            color: var(--primary-yellow);
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 20px;
        }
        .plan-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .plan-option {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .plan-option:hover { border-color: var(--primary-yellow); background: #2a2a2a; }
        .plan-option.selected { border-color: var(--primary-yellow); background: rgba(244,180,0,0.1); }
        .plan-option .duration { font-weight: 600; color: var(--text); }
        .plan-option .price { font-weight: bold; color: var(--primary-yellow); font-size: 1.2rem; }
        .btn-buy {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: var(--primary-red);
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-buy:hover { background: var(--primary-light-red); }

        .modal {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            align-items:center; justify-content:center;
            z-index:200;
        }
        .modal-content {
            background: var(--bg-card);
            border: 2px solid var(--primary-yellow);
            border-radius: var(--radius);
            padding: 30px;
            width: 90%;
            max-width: 500px;
            color: var(--text);
            text-align: center;
        }
        .modal-content h3 { color: var(--primary-yellow); margin-bottom:20px; }
        .modal-content p { margin-bottom:15px; color:var(--text-muted); }
        .modal-content input[type="file"] { margin: 15px 0; }
        .modal-actions { display:flex; gap:10px; justify-content:center; margin-top:20px; }
        .save-btn { background:var(--primary-red); color:white; border:none; padding:10px 25px; border-radius:30px; font-weight:bold; cursor:pointer; }
        .cancel-btn { background:transparent; border:1px solid var(--text-muted); color:var(--text); padding:10px 25px; border-radius:30px; cursor:pointer; }

        footer { text-align:center; padding:20px; color:var(--text-muted); border-top:1px solid var(--border); margin-top:auto; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">
            <span class="basket-icon">🧺</span>
            <span>سلة</span>
        </a>
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="dashboard.html">الرئيسية</a>
            <a href="offers.html">العروض</a>
            <a href="profile.html">ملفي</a>
            <button class="btn-logout" id="logoutBtn">تسجيل الخروج</button>
        </div>
    </nav>

    <div class="main-container">
        <a href="dashboard.html" class="back-link">← العودة للوحة التحكم</a>
        <h1>⬆️ ترقية الباقة</h1>
        <p class="page-desc">اختر الباقة المناسبة لمتجرك وارفع إيصال الدفع. يمكنك شراء أكثر من باقة.</p>

        <div class="packages-grid" id="packagesGrid"></div>
    </div>

    <!-- مودال تأكيد الشراء ورفع الإيصال -->
    <div id="purchaseModal" class="modal">
        <div class="modal-content">
            <h3>تأكيد الترقية</h3>
            <p id="selectedPlanInfo"></p>
            <p>يرجى تحويل المبلغ إلى حساب شام كاش ورفع صورة الإيصال:</p>
            <p style="color:var(--primary-yellow); font-weight:bold;">رقم شام كاش: 0999123456</p>
            <input type="file" id="receiptImage" accept="image/*" required>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal()">إلغاء</button>
                <button class="save-btn" id="confirmPurchaseBtn">تأكيد وإرسال</button>
            </div>
        </div>
    </div>

    <footer>© 2025 سلة - جميع الحقوق محفوظة</footer>

    <script>
        // تعريف الباقات
        const packages = [
            {
                size: 50,
                title: '🥉 الباقة الأساسية (50 منتج)',
                plans: [
                    { duration: 'شهر', price: 5, label: 'شهر واحد' },
                    { duration: '3 شهور', price: 13, label: '3 أشهر' },
                    { duration: '6 شهور', price: 25, label: '6 أشهر' },
                    { duration: 'سنة', price: 40, label: 'سنة كاملة' }
                ]
            },
            {
                size: 100,
                title: '🥈 الباقة الفضية (100 منتج)',
                plans: [
                    { duration: 'شهر', price: 10, label: 'شهر واحد' },
                    { duration: '3 شهور', price: 25, label: '3 أشهر' },
                    { duration: '6 شهور', price: 40, label: '6 أشهر' },
                    { duration: 'سنة', price: 70, label: 'سنة كاملة' }
                ]
            },
            {
                size: 200,
                title: '🥇 الباقة الذهبية (200 منتج)',
                plans: [
                    { duration: 'شهر', price: 20, label: 'شهر واحد' },
                    { duration: '3 شهور', price: 50, label: '3 أشهر' },
                    { duration: '6 شهور', price: 85, label: '6 أشهر' },
                    { duration: 'سنة', price: 150, label: 'سنة كاملة' }
                ]
            }
        ];

        let selectedPackage = null; // { size, duration, price, label }

        // بناء واجهة الباقات
        function renderPackages() {
            const container = document.getElementById('packagesGrid');
            container.innerHTML = packages.map(pkg => `
                <div class="package-card">
                    <h2>${pkg.title}</h2>
                    <div class="plan-options">
                        ${pkg.plans.map(plan => `
                            <div class="plan-option" data-size="${pkg.size}" data-duration="${plan.duration}" data-price="${plan.price}" data-label="${plan.label}">
                                <span class="duration">${plan.label}</span>
                                <span class="price">${plan.price}$</span>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn-buy" data-size="${pkg.size}">شراء</button>
                </div>
            `).join('');

            // إضافة أحداث النقر على خيارات الخطط
            document.querySelectorAll('.plan-option').forEach(opt => {
                opt.addEventListener('click', function(e) {
                    // إلغاء التحديد السابق في نفس البطاقة
                    const card = this.closest('.package-card');
                    card.querySelectorAll('.plan-option').forEach(el => el.classList.remove('selected'));
                    this.classList.add('selected');
                    // تخزين الاختيار مؤقتاً
                    card.setAttribute('data-selected-size', this.dataset.size);
                    card.setAttribute('data-selected-duration', this.dataset.duration);
                    card.setAttribute('data-selected-price', this.dataset.price);
                    card.setAttribute('data-selected-label', this.dataset.label);
                });
            });

            // أحداث أزرار الشراء
            document.querySelectorAll('.btn-buy').forEach(btn => {
                btn.addEventListener('click', function() {
                    const card = this.closest('.package-card');
                    const size = card.getAttribute('data-selected-size');
                    const duration = card.getAttribute('data-selected-duration');
                    const price = card.getAttribute('data-selected-price');
                    const label = card.getAttribute('data-selected-label');
                    if (!size || !duration || !price) {
                        alert('يرجى اختيار المدة أولاً.');
                        return;
                    }
                    selectedPackage = {
                        size: parseInt(size),
                        duration: duration,
                        price: parseFloat(price),
                        label: label
                    };
                    // عرض المودال مع معلومات الباقة
                    document.getElementById('selectedPlanInfo').innerHTML = `
                        <strong>${packages.find(p=>p.size===parseInt(size)).title.split(' ').slice(0,2).join(' ')}</strong><br>
                        المدة: ${duration}<br>
                        السعر: <span style="color:var(--primary-yellow); font-weight:bold;">${price}$</span>
                    `;
                    document.getElementById('purchaseModal').style.display = 'flex';
                });
            });
        }

        function closeModal() {
            document.getElementById('purchaseModal').style.display = 'none';
            document.getElementById('receiptImage').value = '';
        }

        // تأكيد الشراء وإرسال الطلب
        document.getElementById('confirmPurchaseBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('receiptImage');
            const file = fileInput.files[0];
            if (!file) {
                alert('يرجى رفع صورة الإيصال.');
                return;
            }
            if (!selectedPackage) return;

            const formData = new FormData();
            formData.append('receipt', file);
            // نرسل pack (عدد المنتجات) كما هو متوقع في السيرفر
            formData.append('pack', selectedPackage.size);
            // نرسل أيضاً بيانات إضافية لاستخدامها عند تحديث السيرفر
            formData.append('duration', selectedPackage.duration);
            formData.append('amount', selectedPackage.price);

            try {
                const res = await fetch('/api/subscription/request', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });
                const data = await res.json();
                if (res.ok) {
                    alert('تم تقديم طلب الترقية بنجاح! سنقوم بمراجعته.');
                    closeModal();
                } else {
                    alert(data.message || 'فشل تقديم الطلب.');
                }
            } catch (err) {
                console.error(err);
                alert('خطأ في الاتصال بالخادم.');
            }
        });

        // زر القائمة للجوال
        document.getElementById('menuToggle').addEventListener('click', ()=>{
            document.getElementById('navLinks').classList.toggle('show');
        });

        // تسجيل الخروج
        document.getElementById('logoutBtn').addEventListener('click', async (e)=>{
            e.preventDefault();
            await fetch('/api/auth/logout', { method:'POST', credentials:'include' });
            window.location.href = 'index.html';
        });

        // بدء التشغيل
        renderPackages();
    </script>
</body>
</html>
