<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترقية الباقة - سلة</title>
    <style>
        :root {
            --red: #b22222;
            --red-light: #dc3545;
            --gold: #f4b400;
            --gold-light: #ffcc00;
            --bg-dark: #1c1c1c;
            --bg-card: rgba(30, 30, 30, 0.75);
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text: #f0f0f0;
            --text-muted: #bbbbbb;
            --border: #444;
            --radius: 20px;
            --transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 30% 20%, #3a1010, #0f0505);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* شريط التنقل */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(244, 180, 0, 0.4);
            padding: 0 25px;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--gold);
            font-size: 2rem;
            font-weight: 800;
        }

        .logo .basket-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px var(--gold));
            transition: transform 0.3s;
        }

        .logo:hover .basket-icon {
            transform: rotate(-5deg) scale(1.1);
        }

        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-links a, .nav-links button {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 30px;
            transition: var(--transition);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
        }

        .nav-links a:hover, .nav-links button:hover {
            background: rgba(244,180,0,0.15);
            color: var(--gold);
        }

        .btn-logout {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid var(--red);
            color: var(--red-light);
            padding: 8px 22px;
            border-radius: 30px;
            font-weight: bold;
        }

        .btn-logout:hover { background: var(--red); color: white; }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--gold);
            font-size: 2rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px; left:0; right:0;
                background: rgba(20, 0, 0, 0.95);
                backdrop-filter: blur(20px);
                border-bottom: 2px solid var(--gold);
                padding: 25px; gap: 18px;
                border-radius: 0 0 20px 20px;
            }
            .nav-links.show { display: flex; }
            .menu-toggle { display: block; }
        }

        .main-container {
            flex: 1;
            padding: 35px 25px;
            max-width: 1250px;
            margin: 0 auto;
            width: 100%;
        }

        .back-link { color: var(--gold); text-decoration:none; margin-bottom:20px; display:inline-block; font-weight:500; }
        .back-link:hover { text-decoration:underline; }

        h1 { font-size:2.4rem; color:var(--gold-light); margin-bottom:10px; display:flex; align-items:center; gap:12px; }
        .page-desc { color:var(--text-muted); margin-bottom:35px; font-size:1.1rem; }

        /* شبكة الباقات */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .package-card {
            background: var(--bg-card);
            backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border-top: 2px solid var(--gold);
            transition: var(--transition);
        }

        .package-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 45px rgba(0,0,0,0.6), 0 0 25px rgba(244,180,0,0.15);
        }

        .package-card h2 {
            color: var(--gold-light);
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 25px;
        }

        .plan-options { display: flex; flex-direction: column; gap: 14px; }

        .plan-option {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 16px 20px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .plan-option:hover { border-color: var(--gold); background: rgba(244,180,0,0.1); }
        .plan-option.selected {
            border-color: var(--gold);
            background: rgba(244,180,0,0.2);
            box-shadow: 0 0 15px rgba(244,180,0,0.2);
        }

        .plan-option .duration { font-weight: 600; color: var(--text); font-size:1.1rem; }
        .plan-option .price { font-weight: bold; color: var(--gold); font-size:1.4rem; }

        .btn-buy {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid var(--red-light);
            color: white;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .btn-buy:hover { background: var(--red); border-color: var(--red); }
        .btn-buy:active { transform: scale(0.97); }

        /* المودال */
        .modal {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            align-items:center; justify-content:center;
            z-index:200;
        }

        .modal-content {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--gold);
            border-radius: var(--radius);
            padding: 35px;
            width: 90%;
            max-width: 500px;
            color: var(--text);
            text-align: center;
        }

        .modal-content h3 { color: var(--gold-light); margin-bottom:20px; font-size:1.6rem; }
        .modal-content p { margin-bottom:15px; color:var(--text-muted); }
        .modal-content .price-highlight { color: var(--gold); font-size: 2rem; font-weight: bold; margin: 15px 0; }
        .modal-content input[type="file"] { margin: 15px 0; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; width: 100%; color: white; }
        .modal-actions { display:flex; gap:10px; justify-content:center; margin-top:25px; }
        .save-btn {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid var(--red-light);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }
        .save-btn:hover { background: var(--red); }
        .cancel-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: var(--text);
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
        }

        footer { text-align:center; padding:20px; color:var(--text-muted); border-top:1px solid rgba(255,255,255,0.1); margin-top:auto; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">
            <span class="basket-icon">🧺</span>
            <span>سلة</span>
        </a>
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="dashboard.html">الرئيسية</a>
            <a href="offers.html">العروض</a>
            <a href="profile.html">ملفي</a>
            <button class="btn-logout" id="logoutBtn">تسجيل الخروج</button>
        </div>
    </nav>

    <div class="main-container">
        <a href="dashboard.html" class="back-link">← العودة للوحة التحكم</a>
        <h1>⬆️ ترقية الباقة</h1>
        <p class="page-desc">اختر الباقة والمدة المناسبة لمتجرك. بعد الدفع عبر شام كاش، ارفع صورة الإيصال للمراجعة.</p>

        <div class="packages-grid" id="packagesGrid"></div>
    </div>

    <!-- مودال تأكيد الشراء -->
    <div id="purchaseModal" class="modal">
        <div class="modal-content">
            <h3>تأكيد الترقية</h3>
            <p id="selectedPlanInfo"></p>
            <p>المبلغ المطلوب تحويله عبر شام كاش:</p>
            <div class="price-highlight" id="selectedPrice"></div>
            <p style="color:var(--gold-light); font-weight:bold;">رقم شام كاش: 0999123456</p>
            <input type="file" id="receiptImage" accept="image/*" required>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal()">إلغاء</button>
                <button class="save-btn" id="confirmPurchaseBtn">تأكيد وإرسال</button>
            </div>
        </div>
    </div>

    <footer>© 2025 سلة - جميع الحقوق محفوظة</footer>

    <script>
        // تعريف الباقات كما تم الاتفاق عليه
        const packages = [
            {
                size: 50,
                title: '🥉 الباقة الأساسية (50 منتج)',
                plans: [
                    { duration: 'شهر', price: 5, label: 'شهر واحد' },
                    { duration: '3 شهور', price: 13, label: '3 أشهر' },
                    { duration: '6 شهور', price: 25, label: '6 أشهر' },
                    { duration: 'سنة', price: 40, label: 'سنة كاملة' }
                ]
            },
            {
                size: 100,
                title: '🥈 الباقة الفضية (100 منتج)',
                plans: [
                    { duration: 'شهر', price: 10, label: 'شهر واحد' },
                    { duration: '3 شهور', price: 25, label: '3 أشهر' },
                    { duration: '6 شهور', price: 40, label: '6 أشهر' },
                    { duration: 'سنة', price: 70, label: 'سنة كاملة' }
                ]
            },
            {
                size: 200,
                title: '🥇 الباقة الذهبية (200 منتج)',
                plans: [
                    { duration: 'شهر', price: 20, label: 'شهر واحد' },
                    { duration: '3 شهور', price: 50, label: '3 أشهر' },
                    { duration: '6 شهور', price: 85, label: '6 أشهر' },
                    { duration: 'سنة', price: 150, label: 'سنة كاملة' }
                ]
            }
        ];

        let selectedPackage = null; // { size, duration, price, label }

        // بناء واجهة الباقات
        function renderPackages() {
            const container = document.getElementById('packagesGrid');
            container.innerHTML = packages.map(pkg => `
                <div class="package-card">
                    <h2>${pkg.title}</h2>
                    <div class="plan-options">
                        ${pkg.plans.map(plan => `
                            <div class="plan-option" data-size="${pkg.size}" data-duration="${plan.duration}" data-price="${plan.price}" data-label="${plan.label}">
                                <span class="duration">${plan.label}</span>
                                <span class="price">${plan.price}$</span>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn-buy" data-size="${pkg.size}">شراء</button>
                </div>
            `).join('');

            // إضافة أحداث النقر على خيارات الخطط
            document.querySelectorAll('.plan-option').forEach(opt => {
                opt.addEventListener('click', function(e) {
                    const card = this.closest('.package-card');
                    card.querySelectorAll('.plan-option').forEach(el => el.classList.remove('selected'));
                    this.classList.add('selected');
                    card.setAttribute('data-selected-size', this.dataset.size);
                    card.setAttribute('data-selected-duration', this.dataset.duration);
                    card.setAttribute('data-selected-price', this.dataset.price);
                    card.setAttribute('data-selected-label', this.dataset.label);
                });
            });

            // أحداث أزرار الشراء
            document.querySelectorAll('.btn-buy').forEach(btn => {
                btn.addEventListener('click', function() {
                    const card = this.closest('.package-card');
                    const size = card.getAttribute('data-selected-size');
                    const duration = card.getAttribute('data-selected-duration');
                    const price = card.getAttribute('data-selected-price');
                    const label = card.getAttribute('data-selected-label');
                    if (!size || !duration || !price) {
                        alert('يرجى اختيار المدة أولاً.');
                        return;
                    }
                    selectedPackage = {
                        size: parseInt(size),
                        duration: duration,
                        price: parseFloat(price),
                        label: label
                    };
                    // عرض المودال
                    document.getElementById('selectedPlanInfo').innerHTML = `
                        <strong>${packages.find(p=>p.size===parseInt(size)).title}</strong><br>
                        المدة: ${duration}
                    `;
                    document.getElementById('selectedPrice').textContent = `${price}$`;
                    document.getElementById('purchaseModal').style.display = 'flex';
                });
            });
        }

        function closeModal() {
            document.getElementById('purchaseModal').style.display = 'none';
            document.getElementById('receiptImage').value = '';
        }

        // تأكيد الشراء
        document.getElementById('confirmPurchaseBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('receiptImage');
            const file = fileInput.files[0];
            if (!file) { alert('يرجى رفع صورة الإيصال.'); return; }
            if (!selectedPackage) return;

            const formData = new FormData();
            formData.append('receipt', file);
            formData.append('pack', selectedPackage.size);
            formData.append('duration', selectedPackage.duration);
            formData.append('amount', selectedPackage.price);

            try {
                const res = await fetch('/api/subscription/request', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });
                const data = await res.json();
                if (res.ok) {
                    alert('تم تقديم طلب الترقية بنجاح! سنقوم بمراجعته.');
                    closeModal();
                } else {
                    alert(data.message || 'فشل تقديم الطلب.');
                }
            } catch (err) { console.error(err); alert('خطأ في الاتصال.'); }
        });

        // زر القائمة للجوال
        document.getElementById('menuToggle').addEventListener('click', ()=>{
            document.getElementById('navLinks').classList.toggle('show');
        });

        // تسجيل الخروج
        document.getElementById('logoutBtn').addEventListener('click', async (e)=>{
            e.preventDefault();
            await fetch('/api/auth/logout', { method:'POST', credentials:'include' });
            window.location.href = 'index.html';
        });

        // بدء التشغيل
        renderPackages();
    </script>
</body>
</html>س
