<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - سلة</title>
    <style>
        :root {
            --bg-dark: #0d0d0d;
            --bg-card: #1a1a1a;
            --gold: #d4af37;
            --gold-light: #f1c40f;
            --text: #e0e0e0;
            --text-muted: #aaaaaa;
            --border: #333;
            --input-bg: #222;
            --radius: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }
        .login-card {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--gold);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(212, 175, 55, 0.15);
            max-width: 450px;
            width: 100%;
            padding: 40px 30px;
        }
        .basket-logo {
            font-size: 3.5rem;
            filter: drop-shadow(0 0 10px var(--gold-light));
            text-align: center;
            margin-bottom: 10px;
        }
        h1 {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--gold);
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
        }
        .form-group input::placeholder { color: var(--text-muted); }
        .form-group input:focus { border-color: var(--gold); background: #2a2a2a; }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            color: var(--text-muted);
        }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--gold); }
        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #000;
            background-color: var(--gold);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            margin-bottom: 20px;
        }
        .btn-login:hover { background-color: var(--gold-light); transform: translateY(-2px); }
        .extra-links { text-align: center; font-size: 0.9rem; margin-bottom: 10px; }
        .extra-links a { color: var(--gold); text-decoration: none; font-weight: 500; }
        .extra-links a:hover { color: var(--gold-light); text-decoration: underline; }
        .back-home {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-decoration: none;
        }
        .back-home:hover { color: var(--gold); }
        .error-message { color: #e74c3c; font-size: 0.85rem; margin-top: 5px; display: none; }
        .success-message { color: #2ecc71; font-size: 0.85rem; margin-top: 5px; display: none; }
        #resendLink { color: var(--gold-light); text-decoration: underline; cursor: pointer; background: none; border: none; font: inherit; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="basket-logo">🧺</div>
        <h1>سلة</h1>
        <p class="subtitle">تسجيل الدخول إلى حسابك</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginId">اسم المستخدم أو رقم الهاتف</label>
                <input type="text" id="loginId" placeholder="أدخل اسم المستخدم أو رقم الهاتف" required>
                <div class="error-message" id="loginIdError">يرجى ملء هذا الحقل</div>
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="********" required>
                <div class="error-message" id="passwordError">كلمة المرور مطلوبة</div>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">تذكرني</label>
            </div>
            <div id="serverError" class="error-message" style="margin-bottom: 15px;"></div>
            <div id="serverSuccess" class="success-message" style="margin-bottom: 15px;"></div>
            <button type="submit" class="btn-login">تسجيل الدخول</button>
        </form>
        <div class="extra-links">
            <a href="register.html">ليس لديك حساب؟ أنشئ واحداً</a>
        </div>
        <div class="extra-links">
            <a href="verify.html">تفعيل الحساب (تيليجرام)</a>
        </div>
    </div>
    <a href="index.html" class="back-home">← العودة إلى الصفحة الرئيسية</a>

    <script>
        const form = document.getElementById('loginForm');
        const loginId = document.getElementById('loginId');
        const password = document.getElementById('password');
        const rememberCheck = document.getElementById('rememberMe');
        const serverError = document.getElementById('serverError');
        const serverSuccess = document.getElementById('serverSuccess');

        // تحميل بيانات محفوظة إذا وجدت
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('rememberedLogin');
            if (saved) {
                const { loginId: savedId, password: savedPass } = JSON.parse(saved);
                loginId.value = savedId || '';
                password.value = savedPass || '';
                rememberCheck.checked = true;
            }
        });

        // تسجيل الدخول
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
            serverError.style.display = 'none';
            serverError.innerHTML = '';
            serverSuccess.style.display = 'none';

            const idValue = loginId.value.trim();
            const passValue = password.value;

            if (!idValue) {
                document.getElementById('loginIdError').style.display = 'block';
                return;
            }
            if (!passValue) {
                document.getElementById('passwordError').style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginId: idValue, password: passValue }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (!response.ok) {
                    // إذا كان الحساب غير موثق
                    if (response.status === 403 && data.message && data.message.includes('توثيق')) {
                        serverError.innerHTML = `الحساب غير موثّق. <button type="button" id="resendLink">تفعيل الحساب</button>`;
                        serverError.style.display = 'block';
                        document.getElementById('resendLink').addEventListener('click', () => {
                            window.location.href = 'verify.html';
                        });
                    } else {
                        serverError.textContent = data.message || 'فشل تسجيل الدخول';
                        serverError.style.display = 'block';
                    }
                    return;
                }

                // حفظ بيانات التذكر
                if (rememberCheck.checked) {
                    localStorage.setItem('rememberedLogin', JSON.stringify({ loginId: idValue, password: passValue }));
                } else {
                    localStorage.removeItem('rememberedLogin');
                }

                // التوجيه حسب الرابط من الخادم
                if (data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                console.error(err);
                serverError.textContent = 'خطأ في الاتصال بالخادم';
                serverError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
