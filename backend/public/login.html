<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - سلة</title>
    <style>
        :root {
            --red: #b22222;
            --red-light: #dc3545;
            --gold: #f4b400;
            --gold-light: #ffcc00;
            --bg-dark: #0f0505;
            --text: #f0f0f0;
            --text-muted: #bbbbbb;
            --glass-bg: rgba(25, 25, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.15);
            --input-bg: rgba(255, 255, 255, 0.07);
            --input-border: rgba(255, 255, 255, 0.2);
            --transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at 30% 10%, #4a1515, #0a0202);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
            overflow-x: hidden;
        }

        /* تأثيرات خلفية متحركة */
        .bg-decoration {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            z-index: -1;
            animation: float 12s infinite alternate ease-in-out;
        }

        .bg-decoration.red {
            width: 400px;
            height: 400px;
            background: var(--red);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .bg-decoration.gold {
            width: 350px;
            height: 350px;
            background: var(--gold);
            bottom: -120px;
            right: -80px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.1); }
            100% { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* بطاقة تسجيل الدخول */
        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 0 40px rgba(244, 180, 0, 0.15);
            max-width: 460px;
            width: 100%;
            padding: 45px 35px;
            text-align: center;
            position: relative;
            z-index: 2;
            transition: transform 0.4s;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 70px rgba(0,0,0,0.8), 0 0 60px rgba(244,180,0,0.25);
        }

        .basket-logo {
            font-size: 4.5rem;
            filter: drop-shadow(0 0 15px var(--gold));
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--gold-light);
            margin-bottom: 8px;
            letter-spacing: -1px;
            text-shadow: 0 4px 15px rgba(244,180,0,0.4);
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        /* مجموعة الحقول */
        .form-group {
            margin-bottom: 22px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--gold);
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--input-border);
            border-radius: 14px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
            backdrop-filter: blur(10px);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group input:focus {
            border-color: var(--gold);
            background: rgba(255,255,255,0.12);
        }

        /* تذكرني */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--red);
        }

        /* زر تسجيل الدخول */
        .btn-login {
            width: 100%;
            padding: 15px;
            font-size: 1.15rem;
            font-weight: 700;
            color: white;
            background: rgba(220, 53, 69, 0.25);
            border: 1px solid var(--red-light);
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.35);
            margin-bottom: 20px;
        }

        .btn-login:hover {
            background: var(--red);
            border-color: var(--red);
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(220, 53, 69, 0.5);
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        /* روابط */
        .extra-links {
            margin: 15px 0;
            font-size: 0.9rem;
        }

        .extra-links a {
            color: var(--gold-light);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .extra-links a:hover {
            color: white;
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-decoration: none;
            z-index: 2;
        }

        .back-home:hover {
            color: var(--gold);
        }

        /* رسائل الخطأ والنجاح */
        .error-message, .success-message {
            font-size: 0.9rem;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 12px;
            display: none;
        }

        .error-message {
            color: #fca5a5;
            background: rgba(220,53,69,0.15);
            border: 1px solid var(--red);
        }

        .success-message {
            color: #6ee7b7;
            background: rgba(46,204,113,0.1);
            border: 1px solid #2ecc71;
        }
    </style>
</head>
<body>
    <!-- تأثيرات الخلفية -->
    <div class="bg-decoration red"></div>
    <div class="bg-decoration gold"></div>

    <div class="login-card">
        <span class="basket-logo">🧺</span>
        <h1>سلة</h1>
        <p class="subtitle">تسجيل الدخول إلى حسابك</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginId">اسم المستخدم أو رقم الهاتف</label>
                <input type="text" id="loginId" placeholder="أدخل اسم المستخدم أو رقم الهاتف" required>
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="********" required>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">تذكرني</label>
            </div>
            <div id="serverError" class="error-message"></div>
            <div id="serverSuccess" class="success-message"></div>
            <button type="submit" class="btn-login">تسجيل الدخول</button>
        </form>
        <div class="extra-links">
            <a href="register.html">ليس لديك حساب؟ أنشئ واحداً</a>
        </div>
        <div class="extra-links">
            <a href="verify.html">تفعيل الحساب (تيليجرام)</a>
        </div>
    </div>
    <a href="index.html" class="back-home">← العودة إلى الصفحة الرئيسية</a>

    <script>
        const form = document.getElementById('loginForm');
        const loginId = document.getElementById('loginId');
        const password = document.getElementById('password');
        const rememberCheck = document.getElementById('rememberMe');
        const serverError = document.getElementById('serverError');
        const serverSuccess = document.getElementById('serverSuccess');

        // تحميل بيانات محفوظة إذا وجدت
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('rememberedLogin');
            if (saved) {
                const { loginId: savedId, password: savedPass } = JSON.parse(saved);
                loginId.value = savedId || '';
                password.value = savedPass || '';
                rememberCheck.checked = true;
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            // إخفاء الرسائل السابقة
            serverError.style.display = 'none';
            serverSuccess.style.display = 'none';

            const idValue = loginId.value.trim();
            const passValue = password.value;

            if (!idValue || !passValue) {
                serverError.textContent = 'يرجى ملء جميع الحقول';
                serverError.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginId: idValue, password: passValue }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (!response.ok) {
                    // إذا كان الحساب غير موثق
                    if (response.status === 403 && data.message && data.message.includes('توثيق')) {
                        serverError.innerHTML = `الحساب غير موثّق. <a href="verify.html" style="color:var(--gold-light);">انتقل لصفحة التفعيل</a>`;
                    } else {
                        serverError.textContent = data.message || 'فشل تسجيل الدخول';
                    }
                    serverError.style.display = 'block';
                    return;
                }

                // حفظ بيانات التذكر
                if (rememberCheck.checked) {
                    localStorage.setItem('rememberedLogin', JSON.stringify({
                        loginId: idValue,
                        password: passValue
                    }));
                } else {
                    localStorage.removeItem('rememberedLogin');
                }

                // التوجيه حسب الدور
                if (data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                console.error(err);
                serverError.textContent = 'خطأ في الاتصال بالخادم';
                serverError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
