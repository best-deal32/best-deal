<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - MarketHub</title>
    <style>
        :root {
            --green-dark: #059669; --green-light: #6ee7b7;
            --blue-dark: #1e40af; --blue-light: #93c5fd;
            --white: #ffffff; --text-light: #f0fdf4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--green-dark) 0%, var(--blue-dark) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; color: var(--white);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(15px);
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 450px; width: 100%; padding: 40px 30px;
        }
        h1 { text-align: center; font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; }
        h1 .emerald-text { color: var(--green-light); } h1 .blue-text { color: var(--blue-light); }
        .subtitle { text-align: center; color: rgba(255, 255, 255, 0.8); margin-bottom: 30px; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-light); }
        .form-group input {
            width: 100%; padding: 14px 16px; border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px; background: rgba(255, 255, 255, 0.1); color: var(--white);
            font-size: 1rem; outline: none; transition: border-color 0.3s, background 0.3s;
        }
        .form-group input::placeholder { color: rgba(255, 255, 255, 0.6); }
        .form-group input:focus { border-color: var(--green-light); background: rgba(255, 255, 255, 0.15); }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; color: var(--text-light); }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--green-dark); }
        .btn-login {
            width: 100%; padding: 14px; font-size: 1.1rem; font-weight: 700; color: var(--green-dark);
            background-color: var(--white); border: none; border-radius: 50px; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15); margin-bottom: 20px;
        }
        .btn-login:hover { background-color: #ecfdf5; transform: translateY(-2px); }
        .extra-links { text-align: center; font-size: 0.9rem; }
        .extra-links a { color: var(--green-light); text-decoration: none; font-weight: 500; }
        .extra-links a:hover { color: var(--white); text-decoration: underline; }
        .back-home { display: block; text-align: center; margin-top: 25px; color: rgba(255, 255, 255, 0.65); font-size: 0.9rem; text-decoration: none; }
        .back-home:hover { color: var(--white); }
        .error-message { color: #fca5a5; font-size: 0.85rem; margin-top: 5px; display: none; }
        .success-message { color: #6ee7b7; font-size: 0.85rem; margin-top: 5px; display: none; }
        #resendVerificationLink { color: #6ee7b7; text-decoration: underline; cursor: pointer; background: none; border: none; font: inherit; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1><span class="emerald-text">Market</span><span class="blue-text">Hub</span></h1>
        <p class="subtitle">تسجيل الدخول إلى حسابك</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginId">البريد الإلكتروني / اسم المستخدم / رقم الهاتف</label>
                <input type="text" id="loginId" placeholder="example@mail.com أو اسم المستخدم" required>
                <div class="error-message" id="loginIdError">يرجى ملء هذا الحقل</div>
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="********" required>
                <div class="error-message" id="passwordError">كلمة المرور مطلوبة</div>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">تذكرني</label>
            </div>
            <div id="serverError" class="error-message" style="margin-bottom: 15px;"></div>
            <div id="serverSuccess" class="success-message" style="margin-bottom: 15px;"></div>
            <button type="submit" class="btn-login">تسجيل الدخول</button>
        </form>
        <div class="extra-links">
            <a href="register.html">ليس لديك حساب؟ أنشئ واحداً</a>
        </div>
    </div>
    <a href="index.html" class="back-home">← العودة إلى الصفحة الرئيسية</a>

    <script>
        const form = document.getElementById('loginForm');
        const loginId = document.getElementById('loginId');
        const password = document.getElementById('password');
        const rememberCheck = document.getElementById('rememberMe');
        const serverError = document.getElementById('serverError');
        const serverSuccess = document.getElementById('serverSuccess');

        // تحميل بيانات محفوظة
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('rememberedLogin');
            if (saved) {
                const { loginId: savedId, password: savedPass } = JSON.parse(saved);
                loginId.value = savedId || '';
                password.value = savedPass || '';
                rememberCheck.checked = true;
            }
        });

        // دالة إرسال طلب إعادة رمز التحقق
        async function resendVerificationCode(email) {
            serverError.style.display = 'none';
            serverSuccess.style.display = 'none';
            try {
                const response = await fetch('/api/auth/resend-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                if (response.ok) {
                    serverSuccess.textContent = 'تم إرسال رمز جديد إلى بريدك. تحقق من صندوق الوارد.';
                    serverSuccess.style.display = 'block';
                } else {
                    serverError.textContent = data.message || 'فشل إعادة الإرسال';
                    serverError.style.display = 'block';
                }
            } catch (err) {
                serverError.textContent = 'خطأ في الاتصال';
                serverError.style.display = 'block';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            // إخفاء جميع الرسائل السابقة
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
            serverError.style.display = 'none';
            serverError.innerHTML = '';
            serverSuccess.style.display = 'none';

            if (!loginId.value.trim()) {
                document.getElementById('loginIdError').style.display = 'block';
                return;
            }
            if (!password.value) {
                document.getElementById('passwordError').style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        loginId: loginId.value.trim(),
                        password: password.value
                    }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (!response.ok) {
                    // إذا كان الحساب غير موثّق (status 403)
                    if (response.status === 403 && data.message && data.message.includes('توثيق')) {
                        serverError.innerHTML = `الحساب غير موثّق. <button type="button" id="resendVerificationLink">إعادة إرسال رمز التحقق</button>`;
                        serverError.style.display = 'block';
                        // ربط الزر عند ظهوره
                        document.getElementById('resendVerificationLink').addEventListener('click', () => {
                            const emailCandidate = loginId.value.trim();
                            if (emailCandidate.includes('@')) {
                                resendVerificationCode(emailCandidate);
                            } else {
                                alert('يرجى إدخال بريدك الإلكتروني في حقل المستخدم لإعادة الإرسال.');
                            }
                        });
                    } else {
                        serverError.textContent = data.message || 'فشل تسجيل الدخول';
                        serverError.style.display = 'block';
                    }
                    return;
                }

                // نجاح الدخول
                if (rememberCheck.checked) {
                    localStorage.setItem('rememberedLogin', JSON.stringify({
                        loginId: loginId.value.trim(),
                        password: password.value
                    }));
                } else {
                    localStorage.removeItem('rememberedLogin');
                }

                // التوجيه
                if (data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                console.error(err);
                serverError.textContent = 'خطأ في الاتصال بالخادم';
                serverError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
