<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - سلة</title>
    <style>
        :root {
            --primary-red: #b22222;
            --primary-light-red: #dc3545;
            --primary-yellow: #f4b400;
            --primary-light-yellow: #ffcc00;
            --bg-dark: #1c1c1c;
            --bg-card: #262626;
            --text: #f5f5f5;
            --text-muted: #bbbbbb;
            --border: #404040;
            --input-bg: #333;
            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top, #2d1a1a 0%, #0f0a0a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }

        .login-card {
            background: rgba(38, 38, 38, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--primary-yellow);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(244, 180, 0, 0.15);
            max-width: 450px;
            width: 100%;
            padding: 40px 30px;
        }

        .basket-logo {
            font-size: 3.5rem;
            filter: drop-shadow(0 0 10px var(--primary-yellow));
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary-yellow);
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-yellow);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group input:focus {
            border-color: var(--primary-yellow);
            background: #3a3a3a;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            color: var(--text-muted);
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-red);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            background-color: var(--primary-red);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(220, 53, 69, 0.5);
            margin-bottom: 20px;
        }

        .btn-login:hover {
            background-color: var(--primary-light-red);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(220, 53, 69, 0.6);
        }

        .extra-links {
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .extra-links a {
            color: var(--primary-yellow);
            text-decoration: none;
            font-weight: 500;
        }

        .extra-links a:hover {
            color: var(--primary-light-yellow);
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-decoration: none;
        }

        .back-home:hover {
            color: var(--primary-yellow);
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            color: #2ecc71;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        #resendLink {
            color: var(--primary-light-yellow);
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            font: inherit;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="basket-logo">🧺</div>
        <h1>سلة</h1>
        <p class="subtitle">تسجيل الدخول إلى حسابك</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginId">اسم المستخدم أو رقم الهاتف</label>
                <input type="text" id="loginId" placeholder="أدخل اسم المستخدم أو رقم الهاتف" required>
                <div class="error-message" id="loginIdError">يرجى ملء هذا الحقل</div>
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="********" required>
                <div class="error-message" id="passwordError">كلمة المرور مطلوبة</div>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">تذكرني</label>
            </div>
            <div id="serverError" class="error-message" style="margin-bottom: 15px;"></div>
            <div id="serverSuccess" class="success-message" style="margin-bottom: 15px;"></div>
            <button type="submit" class="btn-login">تسجيل الدخول</button>
        </form>
        <div class="extra-links">
            <a href="register.html">ليس لديك حساب؟ أنشئ واحداً</a>
        </div>
        <div class="extra-links">
            <a href="verify.html">تفعيل الحساب (تيليجرام)</a>
        </div>
    </div>
    <a href="index.html" class="back-home">← العودة إلى الصفحة الرئيسية</a>

    <script>
        const form = document.getElementById('loginForm');
        const loginId = document.getElementById('loginId');
        const password = document.getElementById('password');
        const rememberCheck = document.getElementById('rememberMe');
        const serverError = document.getElementById('serverError');
        const serverSuccess = document.getElementById('serverSuccess');

        // تحميل بيانات محفوظة إذا وجدت
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('rememberedLogin');
            if (saved) {
                const { loginId: savedId, password: savedPass } = JSON.parse(saved);
                loginId.value = savedId || '';
                password.value = savedPass || '';
                rememberCheck.checked = true;
            }
        });

        // تسجيل الدخول
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
            serverError.style.display = 'none';
            serverError.innerHTML = '';
            serverSuccess.style.display = 'none';

            const idValue = loginId.value.trim();
            const passValue = password.value;

            if (!idValue) {
                document.getElementById('loginIdError').style.display = 'block';
                return;
            }
            if (!passValue) {
                document.getElementById('passwordError').style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginId: idValue, password: passValue }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (!response.ok) {
                    // إذا كان الحساب غير موثق
                    if (response.status === 403 && data.message && data.message.includes('توثيق')) {
                        serverError.innerHTML = `الحساب غير موثّق. <button type="button" id="resendLink">تفعيل الحساب</button>`;
                        serverError.style.display = 'block';
                        document.getElementById('resendLink').addEventListener('click', () => {
                            window.location.href = 'verify.html';
                        });
                    } else {
                        serverError.textContent = data.message || 'فشل تسجيل الدخول';
                        serverError.style.display = 'block';
                    }
                    return;
                }

                // حفظ بيانات التذكر
                if (rememberCheck.checked) {
                    localStorage.setItem('rememberedLogin', JSON.stringify({ loginId: idValue, password: passValue }));
                } else {
                    localStorage.removeItem('rememberedLogin');
                }

                // التوجيه حسب الرابط من الخادم
                if (data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                console.error(err);
                serverError.textContent = 'خطأ في الاتصال بالخادم';
                serverError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
