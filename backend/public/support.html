<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>الدعم الفني | Vivor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        :root {
            --bg-deep: #040b14;
            --blue-mid: #1a3a6b;
            --blue-light: #2a5298;
            --blue-accent: #3b6cc2;
            --green-mid: #1a5c3a;
            --green-light: #2d8a4e;
            --green-accent: #3ca374;
            --text-primary: #e0e6f0;
            --text-dim: #99a8c0;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(ellipse at top, #0a1628 0%, var(--bg-deep) 70%);
            color: var(--text-primary);
            margin: 0; padding: 0; min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 5rem;
        }
        .glass-card {
            background: rgba(11,31,59,0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(60,163,116,0.35);
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .btn-green {
            background: linear-gradient(135deg, var(--green-mid), var(--green-light));
            color: #fff; font-weight: 800; border-radius: 1.25rem;
            padding: 0.7rem 1.8rem; transition: 0.3s; cursor: pointer;
            border: none; display: inline-flex; align-items: center; gap: 0.5rem;
        }
        .btn-green:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-outline-green {
            background: transparent; border: 1.5px solid var(--green-accent);
            color: var(--green-accent); font-weight: 700; border-radius: 1.25rem;
            padding: 0.5rem 1.2rem; cursor: pointer; transition: 0.2s;
        }
        .btn-outline-green:hover { background: rgba(60,163,116,0.1); }
        .lang-selector {
            background: rgba(11,31,59,0.65); border-radius: 3rem; padding: 0.3rem;
            display: inline-flex; gap: 0.2rem; border: 1px solid rgba(60,163,116,0.3);
        }
        .lang-option {
            padding: 0.4rem 0.9rem; border-radius: 3rem; font-size: 0.7rem;
            font-weight: bold; cursor: pointer; color: var(--text-dim); transition: 0.2s;
        }
        .lang-option.active { background: linear-gradient(135deg, var(--green-mid), var(--green-light)); color: #fff; }
        .lang-option:hover:not(.active) { background: rgba(60,163,116,0.15); color: #fff; }
        .input-field {
            width: 100%; padding: 0.8rem 1.2rem; background: rgba(4,11,20,0.7);
            border: 1.5px solid rgba(60,163,116,0.3); border-radius: 1rem;
            color: #fff; font-weight: 600; font-size: 0.95rem; outline: none; transition: 0.3s;
        }
        .input-field:focus { border-color: var(--green-accent); box-shadow: 0 0 12px rgba(60,163,116,0.25); }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(7,20,38,0.96); border-top: 1px solid rgba(60,163,116,0.3);
            display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000;
        }
        .nav-link {
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-dim); font-size: 11px; font-weight: 800; cursor: pointer;
        }
        .nav-link.active { color: var(--green-accent); }
        .nav-link i { font-size: 1.5rem; margin-bottom: 3px; }
        .ticket-row {
            cursor: pointer; transition: 0.2s; padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .ticket-row:hover { background: rgba(60,163,116,0.1); }
        .badge {
            padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: bold;
        }
        .badge-open { background: rgba(59,130,246,0.2); color: #3b82f6; }
        .badge-closed { background: rgba(239,68,68,0.2); color: #ef4444; }
        @media (max-width: 640px) {
            .glass-card { padding: 1.2rem; border-radius: 1.5rem; }
        }
    </style>
</head>
<body>

<header class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
    <button onclick="window.location.href='dashboard.html'" class="text-slate-400 hover:text-green-400 transition">
        <i class="fa-solid fa-arrow-right text-xl"></i>
    </button>
    <div class="flex items-center gap-3">
        <i class="fa-solid fa-dragon text-3xl text-green-400 drop-shadow-xl"></i>
        <span class="text-xl font-black text-white italic tracking-wide">VIVOR</span>
    </div>
    <div class="lang-selector">
        <div class="lang-option active" data-lang="ar">العربية</div>
        <div class="lang-option" data-lang="en">English</div>
        <div class="lang-option" data-lang="zh">中文</div>
        <div class="lang-option" data-lang="de">Deutsch</div>
    </div>
</header>

<main class="max-w-4xl mx-auto px-4 mt-6">
    <!-- زر فتح تذكرة جديدة -->
    <div class="text-center mb-8">
        <button onclick="openNewTicketModal()" class="btn-green text-lg px-10 py-3"><i class="fa-solid fa-plus-circle"></i> فتح تذكرة جديدة</button>
    </div>

    <!-- قائمة التذاكر -->
    <div class="glass-card p-6 mb-6">
        <h3 class="text-xl font-black text-green-300 mb-4 flex items-center gap-2"><i class="fa-solid fa-ticket"></i> تذاكري</h3>
        <div id="ticketsList" class="space-y-1"></div>
        <div id="noTickets" class="text-center py-8 text-slate-500 hidden">لا توجد تذاكر سابقة.</div>
    </div>

    <!-- تفاصيل تذكرة (مخفي) -->
    <div id="ticketDetailPanel" class="glass-card p-6 hidden">
        <button onclick="closeTicketDetail()" class="text-slate-400 hover:text-white mb-4 flex items-center gap-1"><i class="fa-solid fa-arrow-right ml-1"></i> العودة للقائمة</button>
        <div id="ticketDetailContent"></div>
        <div class="mt-6">
            <textarea id="replyMessage" rows="3" class="input-field" placeholder="اكتب ردك..."></textarea>
            <button onclick="sendReply()" class="btn-green mt-3">إرسال الرد</button>
            <button id="closeTicketBtn" class="btn-outline-green mt-2 hidden">إغلاق التذكرة</button>
        </div>
    </div>
</main>

<!-- نافذة تذكرة جديدة -->
<div id="newTicketModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card p-6 w-full max-w-md">
        <h3 class="text-xl font-bold text-green-300 mb-4">تذكرة جديدة</h3>
        <input type="text" id="newSubject" class="input-field mb-3" placeholder="الموضوع">
        <textarea id="newMessage" rows="4" class="input-field mb-4" placeholder="الرسالة"></textarea>
        <div class="flex gap-3">
            <button onclick="submitNewTicket()" class="btn-green flex-1">إرسال</button>
            <button onclick="closeNewTicketModal()" class="bg-gray-600 text-white px-4 py-2 rounded-xl">إلغاء</button>
        </div>
    </div>
</div>

<!-- القائمة السفلية -->
<div class="bottom-nav">
    <div onclick="window.location.href='dashboard.html'" class="nav-link"><i class="fa-solid fa-house-chimney"></i><span>الرئيسية</span></div>
    <div onclick="window.location.href='deposit.html'" class="nav-link"><i class="fa-solid fa-wallet"></i><span>إيداع</span></div>
    <div onclick="window.location.href='investments.html'" class="nav-link"><i class="fa-solid fa-chart-line"></i><span>استثمار</span></div>
    <div onclick="window.location.href='support.html'" class="nav-link active"><i class="fa-solid fa-headset"></i><span>دعم</span></div>
    <div onclick="logout()" class="nav-link text-red-400"><i class="fa-solid fa-power-off"></i><span>خروج</span></div>
</div>

<script>
    const API = '';
    let currentTicketId = null;
    let currentUser = null;
    let currentLang = localStorage.getItem('preferredLanguage') || 'ar';

    // i18n
    async function loadTranslations(lang) {
        try { const res = await fetch(`/locales/${lang}/translation.json`); if (!res.ok) throw new Error(); return await res.json(); } catch { return {}; }
    }
    const translations = {};
    async function applyTranslations(lang) {
        if (!translations[lang]) translations[lang] = await loadTranslations(lang);
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
        localStorage.setItem('preferredLanguage', lang);
        currentLang = lang;
        document.querySelectorAll('.lang-option').forEach(o => o.classList.toggle('active', o.dataset.lang === lang));
        document.cookie = `i18n=${lang}; path=/; max-age=31536000`;
    }
    document.querySelectorAll('.lang-option').forEach(opt => {
        opt.addEventListener('click', async () => await applyTranslations(opt.dataset.lang));
    });

    // Auth
    async function fetchWithAuth(url, opt = {}) {
        opt.credentials = 'include';
        let res = await fetch(url, opt);
        if (res.status === 401 || res.status === 403) {
            const refresh = await fetch(API + '/api/auth/refresh', { method: 'POST', credentials: 'include' });
            if (refresh.ok) res = await fetch(url, opt);
            else { localStorage.clear(); window.location.href = 'login.html'; throw new Error('Session expired'); }
        }
        return res;
    }

    async function checkAuth() {
        try {
            const res = await fetchWithAuth(API + '/api/users/me');
            if (!res.ok) throw new Error();
            currentUser = await res.json();
            return true;
        } catch (e) {
            Swal.fire({ title: 'غير مصرح', text: 'يجب تسجيل الدخول', icon: 'warning', background: '#071426', color: '#fff' }).then(() => window.location.href = 'login.html');
            return false;
        }
    }

    // Load tickets
    async function loadTickets() {
        const res = await fetchWithAuth(API + '/api/support/tickets');
        const tickets = await res.json();
        const list = document.getElementById('ticketsList');
        const empty = document.getElementById('noTickets');
        list.innerHTML = '';
        if (!tickets.length) { empty.classList.remove('hidden'); return; }
        empty.classList.add('hidden');
        tickets.forEach(t => {
            const badge = t.status === 'open' ? '<span class="badge badge-open">مفتوحة</span>' : '<span class="badge badge-closed">مغلقة</span>';
            const div = document.createElement('div');
            div.className = 'ticket-row';
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="font-bold">${esc(t.subject)}</span>
                    <span>${badge}</span>
                </div>
                <div class="text-xs text-slate-400 mt-1">${new Date(t.createdAt).toLocaleString()}</div>
            `;
            div.addEventListener('click', () => viewTicket(t.id));
            list.appendChild(div);
        });
    }

    // View ticket detail
    async function viewTicket(ticketId) {
        currentTicketId = ticketId;
        const res = await fetchWithAuth(API + '/api/support/tickets/' + ticketId);
        const data = await res.json();
        document.getElementById('ticketsList').parentElement.classList.add('hidden');
        document.getElementById('noTickets').classList.add('hidden');
        const panel = document.getElementById('ticketDetailPanel');
        const content = document.getElementById('ticketDetailContent');
        panel.classList.remove('hidden');

        let html = `
            <h3 class="text-xl font-bold text-green-300 mb-2">${esc(data.ticket.subject)}</h3>
            <p class="text-slate-300 mb-2">${esc(data.ticket.message)}</p>
            <div class="text-xs text-slate-500 mb-4">${new Date(data.ticket.createdAt).toLocaleString()} | الحالة: ${data.ticket.status}</div>
            <h4 class="text-blue-300 mb-2">الردود:</h4>
        `;
        data.replies.forEach(r => {
            html += `<div class="bg-black/20 p-3 rounded-lg mb-2"><strong>${esc(r.username)}:</strong> ${esc(r.message)}</div>`;
        });
        content.innerHTML = html;

        const closeBtn = document.getElementById('closeTicketBtn');
        if (data.ticket.status === 'open' && currentUser && currentUser.id === data.ticket.userId) {
            closeBtn.classList.remove('hidden');
            closeBtn.onclick = () => closeTicket(ticketId);
        } else {
            closeBtn.classList.add('hidden');
        }
        document.getElementById('replyMessage').value = '';
    }

    function closeTicketDetail() {
        document.getElementById('ticketDetailPanel').classList.add('hidden');
        document.getElementById('ticketsList').parentElement.classList.remove('hidden');
        loadTickets();
    }

    async function sendReply() {
        const msg = document.getElementById('replyMessage').value.trim();
        if (!msg) { Swal.fire('تنبيه', 'الرجاء كتابة رد', 'warning', { background: '#071426', color: '#fff' }); return; }
        const res = await fetchWithAuth(API + '/api/support/tickets/' + currentTicketId + '/reply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('replyMessage').value = '';
            viewTicket(currentTicketId);
        } else {
            Swal.fire('خطأ', data.message, 'error');
        }
    }

    async function closeTicket(ticketId) {
        const res = await fetchWithAuth(API + '/api/admin/support/tickets/' + ticketId + '/status', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'closed' })
        });
        const data = await res.json();
        if (data.success) {
            viewTicket(ticketId);
            loadTickets();
        } else {
            Swal.fire('خطأ', data.message, 'error');
        }
    }

    // New ticket modal
    function openNewTicketModal() { document.getElementById('newTicketModal').classList.remove('hidden'); }
    function closeNewTicketModal() { document.getElementById('newTicketModal').classList.add('hidden'); }

    async function submitNewTicket() {
        const subject = document.getElementById('newSubject').value.trim();
        const message = document.getElementById('newMessage').value.trim();
        if (!subject || !message) { Swal.fire('خطأ', 'يرجى ملء الموضوع والرسالة', 'error'); return; }
        const res = await fetchWithAuth(API + '/api/support/tickets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ subject, message })
        });
        const data = await res.json();
        if (data.success) {
            Swal.fire('تم', 'تم فتح التذكرة بنجاح', 'success');
            closeNewTicketModal();
            document.getElementById('newSubject').value = '';
            document.getElementById('newMessage').value = '';
            loadTickets();
        } else {
            Swal.fire('خطأ', data.message, 'error');
        }
    }

    function logout() {
        Swal.fire({
            title: 'تسجيل الخروج', text: 'هل أنت متأكد؟',
            icon: 'question', showCancelButton: true,
            confirmButtonColor: '#c0392b', background: '#071426', color: '#fff'
        }).then(r => {
            if (r.isConfirmed) {
                fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                localStorage.clear();
                window.location.href = 'login.html';
            }
        });
    }

    function esc(s) { return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    // Init
    window.onload = async () => {
        await applyTranslations(currentLang);
        if (await checkAuth()) {
            loadTickets();
        }
    };
</script>
</body>
</html>
