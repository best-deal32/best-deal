<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>الدعم الفني | Vivor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        :root {
            --bg-deep: #040b14;
            --bg-card: #071426;
            --blue-mid: #1a3a6b;
            --blue-light: #2a5298;
            --blue-accent: #3b6cc2;
            --border-light: rgba(43, 80, 150, 0.4);
            --text-primary: #e0e6f0;
            --text-dim: #99a8c0;
        }
        body { font-family: 'Cairo', sans-serif; background: radial-gradient(ellipse at top, #0a1628 0%, var(--bg-deep) 70%); color: var(--text-primary); min-height: 100vh; padding-bottom: 5rem; }
        .glass-card { background: rgba(11,31,59,0.75); backdrop-filter: blur(15px); border: 1px solid var(--border-light); border-radius: 2rem; transition: 0.3s; }
        .btn-blue { background: linear-gradient(135deg, var(--blue-mid), var(--blue-light)); color: #fff; font-weight: 800; border-radius: 1.25rem; padding: 0.7rem 1.5rem; transition: 0.3s; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-blue:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .input-field { width: 100%; padding: 0.8rem 1.2rem; background: rgba(4,11,20,0.7); border: 1.5px solid rgba(59,108,194,0.3); border-radius: 1rem; color: #fff; font-weight: 600; font-size: 0.95rem; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: var(--blue-accent); box-shadow: 0 0 10px rgba(59,108,194,0.2); }
        .ticket-row { cursor: pointer; transition: 0.2s; }
        .ticket-row:hover { background: rgba(59,108,194,0.1); }
        .badge { padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; }
        .badge-open { background: rgba(59,130,246,0.2); color: #3b82f6; }
        .badge-closed { background: rgba(239,68,68,0.2); color: #ef4444; }
        .lang-selector { background: rgba(11,31,59,0.65); border-radius: 3rem; padding: 0.3rem; display: inline-flex; gap: 0.2rem; border: 1px solid var(--border-light); }
        .lang-option { padding: 0.4rem 0.9rem; border-radius: 3rem; font-size: 0.7rem; font-weight: bold; cursor: pointer; color: var(--text-dim); transition: 0.2s; }
        .lang-option.active { background: linear-gradient(135deg, var(--blue-mid), var(--blue-light)); color: #fff; }
        .lang-option:hover:not(.active) { background: rgba(42,82,152,0.2); color: #fff; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(7,20,38,0.96); border-top: 1px solid var(--border-light); display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .nav-link { display: flex; flex-direction: column; align-items: center; color: var(--text-dim); font-size: 11px; font-weight: 800; cursor: pointer; }
        .nav-link.active { color: var(--blue-accent); }
        .nav-link i { font-size: 22px; margin-bottom: 4px; }
    </style>
</head>
<body>

<header class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
    <button onclick="window.location.href='dashboard.html'" class="text-slate-400 hover:text-blue-400 transition">
        <i class="fa-solid fa-arrow-right text-xl"></i>
    </button>
    <div class="flex items-center gap-3">
        <i class="fa-solid fa-dragon text-3xl text-blue-400 drop-shadow-xl"></i>
        <span class="text-xl font-black text-white italic tracking-wide">VIVOR</span>
    </div>
    <div class="lang-selector">
        <div class="lang-option active" data-lang="ar">العربية</div>
        <div class="lang-option" data-lang="en">English</div>
    </div>
</header>

<main class="max-w-4xl mx-auto px-4 mt-6">
    <!-- زر فتح تذكرة جديدة -->
    <div class="text-center mb-6">
        <button onclick="openNewTicketModal()" class="btn-blue text-lg px-8 py-3"><i class="fa-solid fa-plus-circle"></i> فتح تذكرة جديدة</button>
    </div>

    <!-- قائمة التذاكر -->
    <div class="glass-card p-5 mb-6">
        <h3 class="text-lg font-bold text-blue-300 mb-4"><i class="fa-solid fa-ticket"></i> تذاكري</h3>
        <div id="ticketsList" class="space-y-2"></div>
        <div id="noTickets" class="text-center py-6 text-slate-500 hidden">لا توجد تذاكر حالية.</div>
    </div>

    <!-- تفاصيل تذكرة (مخفي افتراضياً) -->
    <div id="ticketDetailPanel" class="glass-card p-5 hidden">
        <button onclick="closeTicketDetail()" class="text-slate-400 hover:text-white mb-3"><i class="fa-solid fa-arrow-right ml-1"></i> العودة للقائمة</button>
        <div id="ticketDetailContent"></div>
        <div class="mt-4">
            <textarea id="replyMessage" rows="3" class="input-field" placeholder="اكتب ردك..."></textarea>
            <button onclick="sendReply()" class="btn-blue mt-2">إرسال الرد</button>
            <button id="closeTicketBtn" class="btn-blue mt-2 mr-2 bg-gray-600 hidden">إغلاق التذكرة</button>
        </div>
    </div>
</main>

<!-- نافذة تذكرة جديدة -->
<div id="newTicketModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card p-6 w-full max-w-md">
        <h3 class="text-xl font-bold text-blue-300 mb-4">تذكرة جديدة</h3>
        <input type="text" id="newSubject" class="input-field mb-3" placeholder="الموضوع">
        <textarea id="newMessage" rows="4" class="input-field mb-4" placeholder="الرسالة"></textarea>
        <div class="flex gap-3">
            <button onclick="submitNewTicket()" class="btn-blue flex-1">إرسال</button>
            <button onclick="closeNewTicketModal()" class="bg-gray-600 text-white px-4 py-2 rounded-xl">إلغاء</button>
        </div>
    </div>
</div>

<!-- القائمة السفلية -->
<div class="bottom-nav">
    <div onclick="window.location.href='dashboard.html'" class="nav-link"><i class="fa-solid fa-house-chimney"></i><span>الرئيسية</span></div>
    <div onclick="window.location.href='deposit.html'" class="nav-link"><i class="fa-solid fa-wallet"></i><span>إيداع</span></div>
    <div onclick="window.location.href='investments.html'" class="nav-link"><i class="fa-solid fa-chart-line"></i><span>استثمار</span></div>
    <div onclick="window.location.href='support.html'" class="nav-link active"><i class="fa-solid fa-headset"></i><span>الدعم</span></div>
    <div onclick="logout()" class="nav-link text-red-400"><i class="fa-solid fa-power-off"></i><span>خروج</span></div>
</div>

<script>
    const API = '';
    let currentTicketId = null;
    let currentUser = null;

    // تحميل الترجمات (اختياري)
    // ...

    async function fetchWithAuth(url, opt = {}) {
        opt.credentials = 'include';
        let res = await fetch(url, opt);
        if (res.status === 401 || res.status === 403) {
            const refresh = await fetch(API + '/api/auth/refresh', { method: 'POST', credentials: 'include' });
            if (refresh.ok) res = await fetch(url, opt);
            else { localStorage.clear(); window.location.href = 'login.html'; }
        }
        return res;
    }

    async function checkAuth() {
        const res = await fetchWithAuth(API + '/api/users/me');
        if (res.ok) {
            currentUser = await res.json();
            return true;
        } else {
            Swal.fire({ icon: 'warning', title: 'غير مصرح', text: 'يجب تسجيل الدخول', background: '#071426', color: '#fff' }).then(() => window.location.href = 'login.html');
            return false;
        }
    }

    async function loadTickets() {
        const res = await fetchWithAuth(API + '/api/support/tickets');
        const tickets = await res.json();
        const list = document.getElementById('ticketsList');
        const noTickets = document.getElementById('noTickets');
        list.innerHTML = '';
        if (!tickets.length) {
            noTickets.classList.remove('hidden');
            return;
        }
        noTickets.classList.add('hidden');
        tickets.forEach(t => {
            const statusBadge = t.status === 'open' ? '<span class="badge badge-open">مفتوحة</span>' : '<span class="badge badge-closed">مغلقة</span>';
            const div = document.createElement('div');
            div.className = 'ticket-row p-3 border-b border-white/5';
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="font-bold">${esc(t.subject)}</span>
                    <span>${statusBadge}</span>
                </div>
                <div class="text-xs text-slate-400 mt-1">${new Date(t.createdAt).toLocaleString()}</div>
            `;
            div.addEventListener('click', () => viewTicket(t.id));
            list.appendChild(div);
        });
    }

    async function viewTicket(ticketId) {
        currentTicketId = ticketId;
        const res = await fetchWithAuth(API + '/api/support/tickets/' + ticketId);
        const data = await res.json();
        const panel = document.getElementById('ticketDetailPanel');
        const content = document.getElementById('ticketDetailContent');
        document.getElementById('ticketsList').parentElement.classList.add('hidden');
        document.getElementById('noTickets').classList.add('hidden');
        panel.classList.remove('hidden');

        let html = `
            <h3 class="text-xl font-bold text-blue-300 mb-2">${esc(data.ticket.subject)}</h3>
            <p class="text-slate-300 mb-2">${esc(data.ticket.message)}</p>
            <div class="text-xs text-slate-500 mb-4">${new Date(data.ticket.createdAt).toLocaleString()} | الحالة: ${data.ticket.status}</div>
            <h4 class="text-blue-200 mb-2">الردود:</h4>
        `;
        data.replies.forEach(r => {
            html += `<div class="bg-black/20 p-2 rounded-lg mb-2"><strong>${esc(r.username)}:</strong> ${esc(r.message)}</div>`;
        });
        content.innerHTML = html;

        const closeBtn = document.getElementById('closeTicketBtn');
        if (data.ticket.status === 'open' && currentUser.id === data.ticket.userId) {
            closeBtn.classList.remove('hidden');
            closeBtn.onclick = () => closeTicket(ticketId);
        } else {
            closeBtn.classList.add('hidden');
        }
    }

    function closeTicketDetail() {
        document.getElementById('ticketDetailPanel').classList.add('hidden');
        document.getElementById('ticketsList').parentElement.classList.remove('hidden');
        loadTickets();
    }

    async function sendReply() {
        const msg = document.getElementById('replyMessage').value.trim();
        if (!msg) return Swal.fire('خطأ', 'الرجاء كتابة رد', 'error');
        const res = await fetchWithAuth(API + '/api/support/tickets/' + currentTicketId + '/reply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('replyMessage').value = '';
            viewTicket(currentTicketId);
        } else {
            Swal.fire('خطأ', data.message, 'error');
        }
    }

    async function closeTicket(ticketId) {
        const res = await fetchWithAuth(API + '/api/support/tickets/' + ticketId + '/reply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'تم إغلاق التذكرة.' })
        });
        // استخدام مسار الحالة مباشرة
        await fetchWithAuth(API + '/api/admin/support/tickets/' + ticketId + '/status', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'closed' })
        });
        viewTicket(ticketId);
        loadTickets();
    }

    function openNewTicketModal() { document.getElementById('newTicketModal').classList.remove('hidden'); }
    function closeNewTicketModal() { document.getElementById('newTicketModal').classList.add('hidden'); }

    async function submitNewTicket() {
        const subject = document.getElementById('newSubject').value.trim();
        const message = document.getElementById('newMessage').value.trim();
        if (!subject || !message) return Swal.fire('خطأ', 'يرجى ملء الموضوع والرسالة', 'error');
        const res = await fetchWithAuth(API + '/api/support/tickets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ subject, message })
        });
        const data = await res.json();
        if (data.success) {
            Swal.fire('تم', 'تم فتح التذكرة', 'success');
            closeNewTicketModal();
            loadTickets();
        } else {
            Swal.fire('خطأ', data.message, 'error');
        }
    }

    function logout() {
        Swal.fire({ title: 'تسجيل الخروج', text: 'هل أنت متأكد؟', icon: 'question', showCancelButton: true, confirmButtonColor: '#3b6cc2', background: '#071426', color: '#fff' }).then(r => {
            if (r.isConfirmed) {
                fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                localStorage.clear();
                window.location.href = 'login.html';
            }
        });
    }

    function esc(s) { return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    // تهيئة
    window.onload = async () => {
        if (await checkAuth()) {
            loadTickets();
        }
    };
</script>
</body>
</html>
