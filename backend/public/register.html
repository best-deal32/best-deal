<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>إنشاء حساب | Vivor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        
        :root {
            --bg-deep: #040b14;
            --bg-card: #071426;
            --blue-mid: #1a3a6b;
            --blue-light: #2a5298;
            --blue-accent: #3b6cc2;
            --green-mid: #1a5c3a;
            --green-light: #2d8a4e;
            --green-accent: #3ca374;
            --text-primary: #e0e6f0;
            --text-dim: #99a8c0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: radial-gradient(ellipse at top, #0a1628 0%, var(--bg-deep) 70%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(11, 31, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(43, 80, 150, 0.4);
            border-radius: 3rem;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

        .step {
            display: none;
            animation: fadeSlide 0.5s ease;
        }
        .step.active {
            display: block;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dragon-icon {
            font-size: 3.5rem;
            color: var(--green-accent);
            filter: drop-shadow(0 0 15px rgba(60,163,116,0.6));
            display: block;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .title {
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: #93b4f5;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--green-accent);
            font-size: 1rem;
        }

        .input-field {
            width: 100%;
            padding: 0.9rem 2.8rem 0.9rem 1.2rem;
            background: rgba(4,11,20,0.7);
            border: 1.5px solid rgba(59,108,194,0.3);
            border-radius: 1rem;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-field:focus {
            border-color: var(--green-accent);
            box-shadow: 0 0 12px rgba(60,163,116,0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--green-mid), var(--green-light));
            border: none;
            border-radius: 1rem;
            color: #fff;
            font-weight: 900;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(26,92,58,0.5);
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #1e6e3e, #35a051);
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            background: #1e2a3a;
            color: #5a6a7a;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-secondary {
            background: transparent;
            border: 1.5px solid var(--green-accent);
            color: var(--green-accent);
            font-weight: 700;
            padding: 0.7rem 1.2rem;
            border-radius: 1rem;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background: rgba(60,163,116,0.15);
        }

        .skip-link {
            color: var(--green-accent);
            text-decoration: underline;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 0.5rem;
            display: inline-block;
        }

        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 2rem;
            background: rgba(11,31,59,0.6);
            border-radius: 3rem;
            padding: 0.3rem;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid rgba(59,108,194,0.25);
        }

        .lang-option {
            padding: 0.4rem 0.9rem;
            border-radius: 3rem;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            color: #99a8c0;
        }

        .lang-option.active {
            background: linear-gradient(135deg, var(--green-mid), var(--green-light));
            color: #fff;
        }

        @media (max-width: 500px) {
            .glass-card {
                padding: 2rem 1.5rem;
                border-radius: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="dragon-icon">
            <i class="fa-solid fa-dragon"></i>
        </div>
        <h1 class="title">VIVOR</h1>
        <p class="subtitle">أنشئ حسابك وابدأ رحلتك الاستثمارية</p>

        <!-- الخطوة الأولى: البيانات الأساسية -->
        <div id="step1" class="step active">
            <div class="input-group">
                <label class="input-label">اسم المستخدم</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" class="input-field" placeholder="اختر اسم مستخدم" required>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">الاسم الكامل</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-signature"></i>
                    <input type="text" id="fullName" class="input-field" placeholder="اسمك الكامل" required>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" class="input-field" placeholder="example@mail.com" required>
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="input-group">
                    <label class="input-label">كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" class="input-field" placeholder="••••••••" required>
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label">تأكيد كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-check-circle"></i>
                        <input type="password" id="confirmPassword" class="input-field" placeholder="••••••••" required>
                    </div>
                </div>
            </div>
            <button id="nextStepBtn" class="btn-primary">
                <i class="fa-solid fa-arrow-left"></i> متابعة
            </button>
        </div>

        <!-- الخطوة الثانية: كود الإحالة ورمز التحقق -->
        <div id="step2" class="step">
            <p class="text-sm text-slate-300 text-center mb-6">
                هل لديك كود إحالة؟ أدخله الآن أو تخطَّ هذه الخطوة.
            </p>
            <div class="input-group">
                <label class="input-label">كود الإحالة (اختياري)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-gift"></i>
                    <input type="text" id="referrerCode" class="input-field" placeholder="أدخل الكود أو اتركه فارغاً">
                </div>
                <span id="skipReferral" class="skip-link"><i class="fa-solid fa-forward ml-1"></i> تخطي</span>
            </div>

            <!-- رمز التحقق (اختياري) -->
            <div class="flex items-end gap-2 mb-4">
                <div class="input-group flex-1">
                    <label class="input-label">رمز التحقق (اختياري)</label>
                    <input type="text" id="verificationCode" class="input-field" placeholder="الرمز المرسل إلى بريدك">
                </div>
                <button type="button" id="sendCodeBtn" class="btn-secondary">
                    <i class="fa-regular fa-paper-plane ml-1"></i> إرسال الرمز
                </button>
            </div>

            <button id="registerBtn" class="btn-primary mt-4">
                <i class="fa-solid fa-user-plus"></i> إنشاء الحساب
            </button>
            <button id="backToStep1" class="btn-secondary w-full mt-2 justify-center">
                <i class="fa-solid fa-arrow-right ml-1"></i> العودة للبيانات
            </button>
        </div>

        <div class="lang-selector">
            <div class="lang-option active" data-lang="ar">العربية</div>
            <div class="lang-option" data-lang="en">English</div>
            <div class="lang-option" data-lang="zh">中文</div>
            <div class="lang-option" data-lang="de">Deutsch</div>
        </div>

        <p class="text-center text-sm text-slate-500 mt-6">
            لديك حساب؟ <a href="login.html" class="text-green-400 font-bold hover:underline">سجل دخول</a>
        </p>
    </div>

    <script>
        const API_BASE = '';
        const URL_SEND_VERIFICATION = API_BASE + '/api/auth/send-verification';
        const URL_REGISTER = API_BASE + '/api/users/register';
        const URL_CHECK_USERNAME = API_BASE + '/api/users/check-username';
        const URL_VALIDATE_EMAIL = API_BASE + '/api/auth/validate-email';

        let socket = null;
        let currentLang = localStorage.getItem('preferredLanguage') || 'ar';
        const translations = {};

        // i18n (مبسطة)
        async function loadTranslations(lang) {
            try {
                const res = await fetch(`/locales/${lang}/translation.json`);
                if (res.ok) translations[lang] = await res.json();
            } catch(e) {}
        }
        function applyTranslations(lang) {
            const t = translations[lang] || {};
            document.querySelectorAll('[data-i18n]').forEach(el => {
                if(t[el.dataset.i18n]) el.textContent = t[el.dataset.i18n];
            });
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            localStorage.setItem('preferredLanguage', lang);
            currentLang = lang;
            document.querySelectorAll('.lang-option').forEach(o => o.classList.toggle('active', o.dataset.lang === lang));
            document.cookie = `i18n=${lang}; path=/; max-age=31536000`;
        }
        document.querySelectorAll('.lang-option').forEach(opt => {
            opt.addEventListener('click', async () => { await applyTranslations(opt.dataset.lang); });
        });

        // WebSocket
        function initSocket() {
            if (!socket) {
                socket = io(window.location.origin, { withCredentials: true });
                socket.on('connect', () => console.log('Socket connected'));
            }
        }

        // التنقل بين الخطوات
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');

        document.getElementById('nextStepBtn').addEventListener('click', () => {
            const username = document.getElementById('username').value.trim();
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!username || !fullName || !email || !password) {
                Swal.fire({ icon: 'warning', title: 'حقول ناقصة', text: 'يرجى ملء جميع الحقول', background: '#071426', color: '#fff' });
                return;
            }
            if (password !== confirmPassword) {
                Swal.fire({ icon: 'error', title: 'خطأ', text: 'كلمتا المرور غير متطابقتين', background: '#071426', color: '#fff' });
                return;
            }
            if (password.length < 6) {
                Swal.fire({ icon: 'error', title: 'ضعيفة', text: 'كلمة المرور يجب أن تكون 6 أحرف على الأقل', background: '#071426', color: '#fff' });
                return;
            }
            if (!email.includes('@')) {
                Swal.fire({ icon: 'error', title: 'بريد غير صالح', text: 'يرجى إدخال بريد صحيح', background: '#071426', color: '#fff' });
                return;
            }

            step1.classList.remove('active');
            step2.classList.add('active');
        });

        document.getElementById('backToStep1').addEventListener('click', () => {
            step2.classList.remove('active');
            step1.classList.add('active');
        });

        document.getElementById('skipReferral').addEventListener('click', () => {
            document.getElementById('referrerCode').value = '';
            // يمكن إضافة تأثير بصري بسيط
        });

        // إرسال رمز التحقق
        let countdown = 0, countdownInterval;
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        sendCodeBtn.addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            if (!email || !email.includes('@')) {
                Swal.fire('خطأ', 'يرجى إدخال بريد صحيح في الخطوة الأولى', 'error');
                return;
            }
            if (countdown > 0) return;
            sendCodeBtn.disabled = true;
            const originalText = sendCodeBtn.innerHTML;
            sendCodeBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري...';
            try {
                const res = await fetch(URL_SEND_VERIFICATION, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ email }),
                    credentials: 'include'
                });
                const data = await res.json();
                if (data.success) {
                    Swal.fire('تم', 'تم إرسال رمز التحقق إلى بريدك', 'success');
                    startCountdown(60);
                } else {
                    Swal.fire('خطأ', data.message || 'فشل الإرسال', 'error');
                    sendCodeBtn.disabled = false;
                    sendCodeBtn.innerHTML = originalText;
                }
            } catch(e) {
                Swal.fire('خطأ', 'فشل الاتصال', 'error');
                sendCodeBtn.disabled = false;
                sendCodeBtn.innerHTML = originalText;
            }
        });

        function startCountdown(seconds) {
            if(countdownInterval) clearInterval(countdownInterval);
            countdown = seconds;
            const originalText = sendCodeBtn.innerHTML;
            sendCodeBtn.disabled = true;
            countdownInterval = setInterval(() => {
                countdown--;
                if(countdown <= 0) {
                    clearInterval(countdownInterval);
                    sendCodeBtn.disabled = false;
                    sendCodeBtn.innerHTML = originalText;
                } else {
                    sendCodeBtn.innerHTML = `إعادة الإرسال (${countdown})`;
                }
            }, 1000);
        }

        // تقديم التسجيل النهائي
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const referrerCode = document.getElementById('referrerCode').value.trim();
            const verificationCode = document.getElementById('verificationCode').value.trim();

            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري إنشاء الحساب...';

            try {
                const res = await fetch(URL_REGISTER, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({
                        username, password, fullName, email,
                        origin: 'غير محدد', currentLocation: 'غير محدد',
                        currentJob: 'غير محدد', work: 'غير محدد', profession: 'غير محدد',
                        verificationCode, referrerCode
                    }),
                    credentials: 'include'
                });
                const data = await res.json();
                if (data.success) {
                    Swal.fire({
                        icon: 'success', title: 'تم التسجيل',
                        text: data.message || 'يمكنك الآن تسجيل الدخول',
                        background: '#071426', color: '#fff'
                    }).then(() => window.location.href = 'login.html');
                } else {
                    Swal.fire({ icon: 'error', title: 'فشل', text: data.message, background: '#071426', color: '#fff' });
                }
            } catch(e) {
                Swal.fire({ icon: 'error', title: 'خطأ', text: 'فشل الاتصال', background: '#071426', color: '#fff' });
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> إنشاء الحساب';
            }
        });

        // التحقق من اسم المستخدم والايميل (تحسينات)
        let usernameTimeout, emailTimeout;
        document.getElementById('username').addEventListener('input', function() {
            clearTimeout(usernameTimeout);
            const val = this.value.trim();
            if (val.length < 3) return;
            usernameTimeout = setTimeout(async () => {
                const res = await fetch(`${URL_CHECK_USERNAME}?username=${val}`);
                const d = await res.json();
                if (d.exists) {
                    Swal.fire({ icon: 'warning', title: 'اسم مستخدم موجود', text: 'اختر اسماً آخر', toast: true, position: 'top-end', timer: 3000, background: '#071426', color: '#fff' });
                }
            }, 500);
        });
        document.getElementById('email').addEventListener('input', function() {
            clearTimeout(emailTimeout);
            const val = this.value.trim();
            if (!val.includes('@')) return;
            emailTimeout = setTimeout(async () => {
                const res = await fetch(`${URL_VALIDATE_EMAIL}?email=${encodeURIComponent(val)}`);
                const d = await res.json();
                if (!d.valid) {
                    Swal.fire({ icon: 'warning', title: 'بريد غير صالح', text: d.reason, toast: true, position: 'top-end', timer: 4000, background: '#071426', color: '#fff' });
                }
            }, 800);
        });

        window.onload = async () => {
            await loadTranslations(currentLang);
            applyTranslations(currentLang);
            initSocket();
        };
    </script>
</body>
</html>
