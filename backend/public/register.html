<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - MarketHub</title>
    <style>
        /* نفس التصميم السابق */
        :root {
            --green-dark: #059669; --green-light: #6ee7b7;
            --blue-dark: #1e40af; --blue-light: #93c5fd;
            --white: #ffffff; --text-light: #f0fdf4;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--green-dark) 0%, var(--blue-dark) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; color: var(--white);
        }
        .register-card {
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(15px);
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 480px; width: 100%; padding: 40px 30px;
        }
        h1 { text-align: center; font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; }
        h1 .emerald-text { color: var(--green-light); } h1 .blue-text { color: var(--blue-light); }
        .subtitle { text-align: center; color: rgba(255, 255, 255, 0.8); margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-light); }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px; background: rgba(255, 255, 255, 0.1); color: var(--white);
            font-size: 1rem; outline: none;
        }
        .form-group input:focus { border-color: var(--green-light); background: rgba(255,255,255,0.15); }
        .btn-register {
            width: 100%; padding: 14px; font-size: 1.1rem; font-weight: 700; color: var(--green-dark);
            background-color: var(--white); border: none; border-radius: 50px; cursor: pointer;
            margin-top: 10px; margin-bottom: 20px; transition:0.3s;
        }
        .btn-register:hover { background-color: #ecfdf5; transform: translateY(-2px); }
        .extra-links { text-align: center; font-size: 0.9rem; }
        .extra-links a { color: var(--green-light); text-decoration: none; }
        .error-message { color: #fca5a5; font-size: 0.85rem; margin-top: 5px; display: none; }
        .back-home { display: block; text-align: center; margin-top: 25px; color: rgba(255,255,255,0.65); font-size: 0.9rem; text-decoration: none; }
    </style>
</head>
<body>
    <div class="register-card">
        <h1><span class="emerald-text">Market</span><span class="blue-text">Hub</span></h1>
        <p class="subtitle">أنشئ حسابك الآن</p>
        <form id="registerForm">
            <div class="form-group">
                <label for="username">اسم المستخدم *</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="storeName">اسم المتجر *</label>
                <input type="text" id="storeName" required>
            </div>
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="اختياري إذا تم إدخال الهاتف">
            </div>
            <div class="form-group">
                <label for="phone">رقم الهاتف</label>
                <input type="tel" id="phone" placeholder="اختياري إذا تم إدخال البريد">
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور *</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">تأكيد كلمة المرور *</label>
                <input type="password" id="confirmPassword" required>
            </div>
            <div id="serverError" class="error-message" style="margin-bottom:10px;"></div>
            <button type="submit" class="btn-register">إنشاء حساب</button>
        </form>
        <div class="extra-links">
            <a href="login.html">لديك حساب؟ سجل الدخول</a>
        </div>
    </div>
    <a href="index.html" class="back-home">← العودة للرئيسية</a>

    <script>
        const form = document.getElementById('registerForm');
        const serverError = document.getElementById('serverError');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            serverError.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const storeName = document.getElementById('storeName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (!username || !storeName || !password) {
                serverError.textContent = 'الحقول المطلوبة فارغة';
                serverError.style.display = 'block';
                return;
            }
            if (!email && !phone) {
                serverError.textContent = 'يجب إدخال البريد الإلكتروني أو رقم الهاتف على الأقل';
                serverError.style.display = 'block';
                return;
            }
            if (password !== confirm) {
                serverError.textContent = 'كلمتا المرور غير متطابقتين';
                serverError.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, phone, password, storeName })
                });
                const data = await response.json();
                if (!response.ok) {
                    serverError.textContent = data.message || 'فشل التسجيل';
                    serverError.style.display = 'block';
                    return;
                }

                // تخزين بيانات التسجيل للتحقق
                sessionStorage.setItem('verifyEmail', email || '');
                sessionStorage.setItem('verifyPhone', phone || '');
                if (data.telegramLink) {
                    sessionStorage.setItem('telegramLink', data.telegramLink);
                }
                window.location.href = 'verify.html';
            } catch (err) {
                serverError.textContent = 'خطأ في الاتصال';
                serverError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
