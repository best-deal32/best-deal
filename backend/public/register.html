<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - سلة</title>
    <style>
        :root {
            --red: #b22222;
            --red-light: #dc3545;
            --gold: #f4b400;
            --gold-light: #ffcc00;
            --bg-dark: #0f0505;
            --text: #f0f0f0;
            --text-muted: #bbbbbb;
            --glass-bg: rgba(25, 25, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.15);
            --input-bg: rgba(255, 255, 255, 0.07);
            --input-border: rgba(255, 255, 255, 0.2);
            --transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at 30% 10%, #4a1515, #0a0202);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
            overflow-x: hidden;
        }

        /* تأثيرات خلفية متحركة */
        .bg-decoration {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            z-index: -1;
            animation: float 12s infinite alternate ease-in-out;
        }

        .bg-decoration.red {
            width: 400px;
            height: 400px;
            background: var(--red);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .bg-decoration.gold {
            width: 350px;
            height: 350px;
            background: var(--gold);
            bottom: -120px;
            right: -80px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.1); }
            100% { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* بطاقة التسجيل */
        .register-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 0 40px rgba(244, 180, 0, 0.15);
            max-width: 500px;
            width: 100%;
            padding: 45px 35px;
            text-align: center;
            position: relative;
            z-index: 2;
            transition: transform 0.4s;
        }

        .register-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 70px rgba(0,0,0,0.8), 0 0 60px rgba(244,180,0,0.25);
        }

        .basket-logo {
            font-size: 4.5rem;
            filter: drop-shadow(0 0 15px var(--gold));
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--gold-light);
            margin-bottom: 8px;
            letter-spacing: -1px;
            text-shadow: 0 4px 15px rgba(244,180,0,0.4);
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        /* مجموعة الحقول */
        .form-group {
            margin-bottom: 22px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--gold);
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--input-border);
            border-radius: 14px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
            backdrop-filter: blur(10px);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group input:focus {
            border-color: var(--gold);
            background: rgba(255,255,255,0.12);
        }

        /* زر التسجيل */
        .btn-register {
            width: 100%;
            padding: 15px;
            font-size: 1.15rem;
            font-weight: 700;
            color: white;
            background: rgba(220, 53, 69, 0.25);
            border: 1px solid var(--red-light);
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.35);
            margin-bottom: 20px;
        }

        .btn-register:hover {
            background: var(--red);
            border-color: var(--red);
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(220, 53, 69, 0.5);
        }

        .btn-register:active {
            transform: scale(0.97);
        }

        /* روابط */
        .extra-links {
            margin: 15px 0;
            font-size: 0.9rem;
        }

        .extra-links a {
            color: var(--gold-light);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .extra-links a:hover {
            color: white;
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-decoration: none;
            z-index: 2;
        }

        .back-home:hover {
            color: var(--gold);
        }

        /* رسائل الخطأ والنجاح */
        .error-message, .success-message {
            font-size: 0.9rem;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 12px;
            display: none;
        }

        .error-message {
            color: #fca5a5;
            background: rgba(220,53,69,0.15);
            border: 1px solid var(--red);
        }

        .success-message {
            color: #6ee7b7;
            background: rgba(46,204,113,0.1);
            border: 1px solid #2ecc71;
        }
    </style>
</head>
<body>
    <!-- تأثيرات الخلفية -->
    <div class="bg-decoration red"></div>
    <div class="bg-decoration gold"></div>

    <div class="register-card">
        <span class="basket-logo">🧺</span>
        <h1>سلة</h1>
        <p class="subtitle">أنشئ حسابك وابدأ في عرض ألبستك</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">اسم المستخدم *</label>
                <input type="text" id="username" placeholder="اختر اسم مستخدم فريد" required>
            </div>
            <div class="form-group">
                <label for="storeName">اسم المتجر</label>
                <input type="text" id="storeName" placeholder="اسم متجرك أو علامتك التجارية">
            </div>
            <div class="form-group">
                <label for="phone">رقم الهاتف *</label>
                <input type="tel" id="phone" placeholder="مثال: 0999123456" required>
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور *</label>
                <input type="password" id="password" placeholder="********" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">تأكيد كلمة المرور *</label>
                <input type="password" id="confirmPassword" placeholder="********" required>
            </div>
            <div id="serverError" class="error-message"></div>
            <div id="serverSuccess" class="success-message"></div>
            <button type="submit" class="btn-register">إنشاء حساب</button>
        </form>
        <div class="extra-links">
            <a href="login.html">لديك حساب؟ سجل الدخول</a>
        </div>
    </div>
    <a href="index.html" class="back-home">← العودة إلى الصفحة الرئيسية</a>

    <script>
        const form = document.getElementById('registerForm');
        const serverError = document.getElementById('serverError');
        const serverSuccess = document.getElementById('serverSuccess');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            // إخفاء الرسائل السابقة
            serverError.style.display = 'none';
            serverSuccess.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const storeName = document.getElementById('storeName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            // التحقق من الحقول
            if (!username || !phone || !password) {
                serverError.textContent = 'يرجى ملء جميع الحقول المطلوبة';
                serverError.style.display = 'block';
                return;
            }
            if (password !== confirm) {
                serverError.textContent = 'كلمتا المرور غير متطابقتين';
                serverError.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        phone,
                        password,
                        storeName: storeName || undefined
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    serverError.textContent = data.message || 'فشل التسجيل';
                    serverError.style.display = 'block';
                    return;
                }

                // تخزين رابط تيليجرام ورقم الهاتف للتحقق
                if (data.telegramLink) {
                    sessionStorage.setItem('telegramLink', data.telegramLink);
                    sessionStorage.setItem('verifyPhone', phone);
                }

                // الانتقال إلى صفحة التحقق
                window.location.href = 'verify.html';

            } catch (err) {
                console.error(err);
                serverError.textContent = 'خطأ في الاتصال بالخادم';
                serverError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
